<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farsi in 30 Days — Daily Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-dim: rgba(201,168,76,0.18);
  --ink: #0E0C0A;
  --paper: #FAF7F2;
  --paper2: #F0EBE1;
  --muted: #7A7060;
  --success: #2D6A4F;
  --success-bg: #D8F3DC;
  --danger: #9B2335;
  --danger-bg: #FFE0E3;
  --purple: #4A3F8F;
  --purple-bg: #ECEAF8;
  --radius: 10px;
  --radius-lg: 16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--ink);
  color: var(--paper);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── BACKGROUND TEXTURE ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 90%, rgba(74,63,143,0.08) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.layer { position: relative; z-index: 1; }

/* ── TYPOGRAPHY ── */
.serif { font-family: 'Playfair Display', serif; }
.mono { font-family: 'DM Mono', monospace; }

/* ── SCREENS ── */
.screen { display: none; padding: 20px 16px 60px; max-width: 680px; margin: 0 auto; }
.screen.active { display: block; }

/* ── HEADER ── */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 0.5px solid rgba(201,168,76,0.2);
  position: sticky; top: 0; z-index: 100;
  background: rgba(14,12,10,0.92);
  backdrop-filter: blur(12px);
}
.logo { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--gold); letter-spacing: 0.5px; }
.logo span { font-style: italic; font-size: 14px; color: var(--muted); margin-left: 6px; }
.stats-row { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
.stat-val { color: var(--gold); font-weight: 500; }

/* ── CARDS ── */
.card {
  background: rgba(255,255,255,0.04);
  border: 0.5px solid rgba(201,168,76,0.2);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
}
.card-solid {
  background: rgba(250,247,242,0.06);
  border: 0.5px solid rgba(250,247,242,0.12);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
}

/* ── BUTTONS ── */
.btn {
  cursor: pointer; border: none; font-family: 'DM Sans', sans-serif;
  font-size: 14px; border-radius: var(--radius); padding: 11px 20px;
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:active { transform: scale(0.97); }
.btn-gold {
  background: var(--gold); color: var(--ink); font-weight: 500;
}
.btn-gold:hover { background: var(--gold-light); }
.btn-outline {
  background: transparent; color: var(--paper);
  border: 0.5px solid rgba(250,247,242,0.25);
}
.btn-outline:hover { background: rgba(255,255,255,0.06); }
.btn-block { width: 100%; justify-content: center; }

/* ── PROGRESS BAR ── */
.prog-track { background: rgba(255,255,255,0.08); border-radius: 4px; height: 6px; overflow: hidden; }
.prog-fill { height: 6px; border-radius: 4px; background: var(--gold); transition: width 0.4s ease; }

/* ── DAY GRID ── */
.day-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin: 16px 0;
}
.day-dot {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  border: 0.5px solid transparent;
  color: var(--muted);
  background: rgba(255,255,255,0.04);
}
.day-dot.done { background: rgba(201,168,76,0.2); border-color: var(--gold); color: var(--gold); }
.day-dot.today { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.day-dot.locked { opacity: 0.3; cursor: default; }
.day-dot.today:hover { background: var(--gold-light); }
.day-dot.done:hover { background: rgba(201,168,76,0.3); }

/* ── LESSON QUESTION STYLES ── */
.q-label { font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; font-weight: 500; }
.q-main { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 20px; line-height: 1.3; }
.q-farsi { font-size: 28px; color: var(--gold); font-weight: 700; margin-bottom: 6px; letter-spacing: 1px; }
.q-phon { font-size: 13px; color: var(--muted); margin-bottom: 20px; font-family: 'DM Mono', monospace; }

.opt-btn {
  width: 100%; text-align: left; padding: 13px 16px;
  background: rgba(255,255,255,0.04);
  border: 1.5px solid rgba(250,247,242,0.12);
  border-radius: var(--radius); color: var(--paper);
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  cursor: pointer; margin-bottom: 8px;
  transition: all 0.15s;
}
.opt-btn:hover { border-color: var(--gold); background: var(--gold-dim); }
.opt-btn.correct { border-color: #2D6A4F; background: rgba(45,106,79,0.2); color: #A8D8B5; }
.opt-btn.wrong { border-color: #9B2335; background: rgba(155,35,53,0.2); color: #F4A8B2; }

.word-tile {
  display: inline-block; padding: 8px 14px; margin: 4px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(250,247,242,0.15);
  border-radius: var(--radius); font-size: 13px; cursor: pointer;
  transition: all 0.12s; color: var(--paper);
  font-family: 'DM Mono', monospace;
}
.word-tile:hover { border-color: var(--gold); background: var(--gold-dim); }
.word-tile.used { opacity: 0.25; pointer-events: none; }

.sentence-area {
  min-height: 52px; border-bottom: 1.5px solid rgba(201,168,76,0.3);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 8px 4px; margin-bottom: 16px;
}
.placed-tile {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  background: var(--gold-dim); border: 1.5px solid var(--gold);
  border-radius: var(--radius); font-size: 13px; cursor: pointer;
  color: var(--gold-light); font-family: 'DM Mono', monospace;
  transition: background 0.12s;
}
.placed-tile:hover { background: rgba(201,168,76,0.28); }

.feedback-box {
  border-radius: var(--radius); padding: 14px 18px; margin-top: 16px;
  font-size: 14px; line-height: 1.6;
}
.feedback-box.ok { background: rgba(45,106,79,0.18); border: 0.5px solid rgba(45,106,79,0.4); }
.feedback-box.bad { background: rgba(155,35,53,0.18); border: 0.5px solid rgba(155,35,53,0.4); }
.feedback-title { font-weight: 500; margin-bottom: 4px; }

.convo-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.convo-bubble {
  max-width: 82%; padding: 10px 14px; border-radius: 12px;
  font-size: 14px; line-height: 1.5;
}
.bubble-left { align-self: flex-start; background: rgba(74,63,143,0.25); border: 0.5px solid rgba(74,63,143,0.4); }
.bubble-right { align-self: flex-end; background: rgba(201,168,76,0.12); border: 0.5px solid rgba(201,168,76,0.3); }
.bubble-farsi { font-weight: 500; margin-bottom: 3px; }
.bubble-phon { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; }
.bubble-eng { font-size: 12px; color: rgba(250,247,242,0.65); margin-top: 4px; }

.conj-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
.conj-table td { padding: 7px 10px; border-bottom: 0.5px solid rgba(255,255,255,0.07); }
.conj-table td:first-child { color: var(--muted); }
.conj-table td:nth-child(2) { color: var(--gold); font-family: 'DM Mono', monospace; font-weight: 500; }
.conj-table td:last-child { color: rgba(250,247,242,0.5); font-family: 'DM Mono', monospace; font-size: 11px; }

/* ── RECAP CARD ── */
.recap-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 0.5px solid rgba(255,255,255,0.07); }
.recap-item:last-child { border-bottom: none; }
.recap-farsi { font-size: 16px; color: var(--gold); font-family: 'DM Mono', monospace; min-width: 110px; }
.recap-eng { font-size: 13px; color: var(--muted); }

/* ── RESULT ── */
.result-ring {
  width: 100px; height: 100px; border-radius: 50%;
  border: 3px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; margin: 0 auto 20px;
}
@keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.pop-in { animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp 0.3s ease forwards; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
.shake { animation: shake 0.4s ease; }

/* ── THEME BADGE ── */
.theme-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px;
  background: var(--gold-dim); border: 0.5px solid rgba(201,168,76,0.4);
  font-size: 12px; color: var(--gold); font-weight: 500;
  margin-bottom: 16px;
}

/* ── DIVIDER ── */
.divider { height: 0.5px; background: rgba(255,255,255,0.08); margin: 20px 0; }

/* text input */
input[type=text] {
  width: 100%; padding: 12px 14px;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(250,247,242,0.15);
  border-radius: var(--radius); color: var(--paper);
  font-size: 15px; font-family: 'DM Sans', sans-serif;
  outline: none; transition: border-color 0.15s;
}
input[type=text]:focus { border-color: var(--gold); }
input[type=text].ok { border-color: #2D6A4F; }
input[type=text].bad { border-color: #9B2335; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 4px; }

/* ── REFERENCE SCREEN ── */
.ref-tab-btn {
  cursor:pointer;padding:9px 14px;font-size:12px;letter-spacing:1px;
  text-transform:uppercase;white-space:nowrap;
  border:none;background:none;color:var(--muted);font-family:'DM Sans',sans-serif;
  border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s;
}
.ref-tab-btn.active { color:var(--gold);border-bottom-color:var(--gold); }
.ref-tab-btn:hover { color:var(--paper); }
.ref-section-head {
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);margin:24px 0 10px;font-weight:500;
}
.ref-rule {
  border-left:3px solid var(--gold);padding:12px 16px;margin-bottom:12px;
  background:rgba(255,255,255,0.03);border-radius:0 var(--radius) var(--radius) 0;
}
.ref-rule-title { font-weight:500;font-size:14px;margin-bottom:4px; }
.ref-rule-body  { font-size:13px;color:var(--muted);line-height:1.7; }
.ref-example {
  margin-top:8px;padding:9px 13px;
  background:rgba(255,255,255,0.04);border-radius:var(--radius);font-size:13px;
}
.ref-ex-farsi { font-size:17px;color:var(--gold);font-weight:500;margin-bottom:2px; }
.ref-ex-phon  { font-family:'DM Mono',monospace;font-size:11px;color:var(--muted); }
.ref-ex-eng   { font-size:12px;color:rgba(250,247,242,0.55);margin-top:2px; }
table.ref-vocab { width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px; }
table.ref-vocab th {
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:6px 8px;
  text-align:left;border-bottom:0.5px solid rgba(255,255,255,0.1);
}
table.ref-vocab td { padding:9px 8px;border-bottom:0.5px solid rgba(255,255,255,0.05);vertical-align:top; }
table.ref-vocab tr:hover td { background:rgba(201,168,76,0.06); }
.rv-farsi { color:var(--gold);font-size:15px;font-weight:500;min-width:110px; }
.rv-phon  { font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);min-width:120px; }
.rv-eng   { font-size:13px; }
.rv-note  { font-size:11px;color:var(--muted);font-style:italic; }
table.ref-conj { width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px; }
table.ref-conj th {
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:6px 8px;
  text-align:left;border-bottom:0.5px solid rgba(255,255,255,0.1);
}
table.ref-conj td { padding:9px 8px;border-bottom:0.5px solid rgba(255,255,255,0.05); }
table.ref-conj tr:hover td { background:rgba(201,168,76,0.06); }
.rc-person { color:var(--muted);font-size:12px; }
.rc-form   { color:var(--gold);font-size:15px;font-weight:500; }
.rc-phon   { font-family:'DM Mono',monospace;font-size:11px;color:var(--muted); }
.rc-eng    { font-size:12px;color:rgba(250,247,242,0.5); }
.conj-verb-label {
  background:rgba(201,168,76,0.1);border:0.5px solid rgba(201,168,76,0.25);
  border-radius:var(--radius) var(--radius) 0 0;padding:10px 14px;
  display:flex;justify-content:space-between;align-items:center;
}
.conj-verb-name { font-family:'Playfair Display',serif;font-size:16px; }
.conj-verb-root { font-family:'DM Mono',monospace;font-size:11px;color:var(--muted); }
.ref-phrase-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px; }
@media(max-width:480px){ .ref-phrase-grid{grid-template-columns:1fr;} }
.ref-phrase-card {
  background:rgba(255,255,255,0.04);border:0.5px solid rgba(201,168,76,0.2);
  border-radius:var(--radius);padding:12px 14px;
}
.ref-phrase-cat  { font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:5px; }
.ref-phrase-f    { font-size:16px;font-weight:500;color:var(--gold-light);margin-bottom:2px; }
.ref-phrase-p    { font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:3px; }
.ref-phrase-e    { font-size:13px; }
.ref-phrase-note { font-size:11px;color:var(--muted);font-style:italic;margin-top:3px; }
.ref-convo-scene {
  font-size:11px;letter-spacing:1px;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;padding-bottom:8px;
  border-bottom:0.5px solid rgba(255,255,255,0.08);
}
.ref-bubble-row { display:flex;flex-direction:column;margin-bottom:8px; }
.ref-bubble-row.right { align-items:flex-end; }
.ref-bubble-row.left  { align-items:flex-start; }
.ref-speaker { font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;padding:0 4px; }
.ref-bubble  { max-width:82%;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5; }
.ref-bubble.left  { background:rgba(74,63,143,0.2);border:0.5px solid rgba(74,63,143,0.35); }
.ref-bubble.right { background:rgba(201,168,76,0.1);border:0.5px solid rgba(201,168,76,0.25); }
.ref-b-farsi { font-size:15px;font-weight:500;color:var(--gold);margin-bottom:2px; }
.ref-b-phon  { font-family:'DM Mono',monospace;font-size:10px;color:var(--muted); }
.ref-b-eng   { font-size:12px;color:rgba(250,247,242,0.55);margin-top:3px; }
.ref-phon-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px; }
@media(max-width:480px){ .ref-phon-grid{grid-template-columns:1fr;} }
.ref-phon-item {
  background:rgba(255,255,255,0.04);border:0.5px solid rgba(201,168,76,0.2);
  border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px;
}
.ref-phon-key  { font-family:'DM Mono',monospace;font-size:17px;color:var(--gold);min-width:30px;text-align:center; }
.ref-phon-val  { font-size:12px;color:var(--muted);line-height:1.5; }
.ref-locked-day {
  opacity:0.35;border:0.5px dashed rgba(201,168,76,0.2);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);
}
.tense-pill {
  display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:2px 8px;border-radius:20px;margin-left:8px;font-weight:500;
}
.pill-present { background:rgba(42,92,94,0.25);color:#7DD4C8;border:0.5px solid rgba(42,92,94,0.5); }
.pill-past    { background:rgba(155,35,53,0.2);color:#F4A8B2;border:0.5px solid rgba(155,35,53,0.4); }
</style>
</head>
<body>
<div class="layer">

<!-- TOP BAR -->
<div class="top-bar">
  <div class="logo">فارسی <span>Academy</span></div>
  <div class="stats-row">
    <button class="btn btn-outline" onclick="openRef()" style="padding:5px 12px;font-size:12px;letter-spacing:1px">📚 Reference</button>
    <button class="btn btn-outline" onclick="launchReview()" style="padding:5px 12px;font-size:12px;letter-spacing:1px">🎯 Review</button>
    <button class="btn btn-outline" onclick="showSyncPanel()" style="padding:5px 10px;font-size:12px" title="Cross-device sync">⚙️</button>
  </div>
</div>

<!-- HOME SCREEN -->
<div class="screen active" id="s-home">
  <div style="padding-top:24px;padding-bottom:60px">
    <h1 class="serif" style="font-size:30px;line-height:1.2;margin-bottom:6px;padding-top:8px">Your Daily<br><em>Farsi Lesson</em></h1>
    <div id="home-theme" class="theme-badge"></div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px" id="home-date"></div>

    <!-- Daily activity completion -->
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px">
        <span style="color:var(--muted)">Today's activities</span>
        <span style="color:var(--gold)"><span id="home-actdone">0</span> of 3 done</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="home-actbar" style="width:0%"></div></div>
    </div>

    <!-- Recap from yesterday -->
    <div id="home-recap-section"></div>

    <!-- 3 Daily Activities -->
    <div style="font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:10px">Today's Activities</div>
    <div id="activity-cards"></div>

    <div style="font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;margin-top:8px">Progress</div>
    <div id="month-cards"></div>
    <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px;margin-bottom:20px">Tap a month to see its days · tap any day to review or replay</div>
    <div style="text-align:center;font-size:12px;color:var(--muted)">Bookmark this page · Open daily at 9am · Build your streak</div>
    <div style="text-align:center;margin-top:12px">
      <button class="btn btn-outline" style="font-size:12px;padding:6px 14px" onclick="showRestorePanel()">🔄 Restore from another device</button>
    </div>
  </div>
</div>

<!-- LESSON SCREEN -->
<div class="screen" id="s-lesson">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;padding-top:16px">
    <button class="btn btn-outline" onclick="goHome()" style="padding:6px 14px;font-size:13px">← Home</button>
    <div class="prog-track" style="flex:1"><div class="prog-fill" id="l-prog"></div></div>
  </div>
  <div id="l-act-label" style="font-size:12px;color:var(--gold);letter-spacing:1px;margin-bottom:16px;padding-left:2px"></div>
  <div id="l-q-area"></div>
  <div id="l-feedback" style="display:none"></div>
  <div id="l-actions" style="margin-top:16px"></div>
</div>

<!-- DAY VIEW SCREEN -->
<div class="screen" id="s-dayview"></div>

<!-- REFERENCE SCREEN -->
<div class="screen" id="s-ref">
  <div style="padding:16px 16px 60px;max-width:680px;margin:0 auto">
    <!-- ref header -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-top:16px">
      <button class="btn btn-outline" onclick="goHome()" style="padding:6px 14px;font-size:13px">← Home</button>
      <div style="flex:1">

/* ══════════════════════════════════════════════════════
   USER IDENTITY — persistent ID stored in localStorage
   Same ID across devices once you copy it to your phone
═══════════════════════════════════════════════════════ */
const SK     = 'farsi30_v4';
const UID_KEY = 'farsi30_uid';

function getUID(){
  let uid = localStorage.getItem(UID_KEY);
  if(!uid){
    uid = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,9);
    localStorage.setItem(UID_KEY, uid);
  }
  return uid;
}

const OLD_KEYS = ['farsi30_v1','farsi30_v2','farsi30_v3','farsi_progress_v2'];
let ST = {xp:0,streak:0,hearts:5,dailyXp:0,lastDate:'',completed:{},actDone:{},startDate:null,convDone:{},weakWords:{}};
let _cloudSaveTimer = null;

/* ── LOCAL LOAD (always runs first for instant startup) ── */
function loadLocalST(){
  try {
    let raw = localStorage.getItem(SK);
    if(!raw){ for(const k of OLD_KEYS){ const o=localStorage.getItem(k); if(o){raw=o;break;} } }
    if(raw){
      const p = JSON.parse(raw);
      ST.xp        = p.xp        || 0;
      ST.streak    = p.streak    || 0;
      ST.hearts    = 5;
      ST.dailyXp   = p.dailyXp  || 0;
      ST.lastDate  = p.lastDate  || '';
      ST.completed = p.completed || {};
      ST.actDone   = p.actDone   || {};
      ST.startDate = p.startDate || null;
      ST.convDone  = p.convDone  || {};
      ST.weakWords = p.weakWords || {};
      if(ST.completed && Object.keys(ST.actDone).length===0){
        Object.keys(ST.completed).forEach(d=>{ if(ST.completed[d]) ST.actDone[d]=3; });
      }
    }
  } catch(e){ console.warn('Local load error:',e); }
  if(!ST.startDate) ST.startDate = new Date().toDateString();
  const today = new Date().toDateString();
  if(ST.lastDate !== today) ST.dailyXp = 0;
  saveLocal();
}

function saveLocal(){
  try{ localStorage.setItem(SK, JSON.stringify(ST)); }catch(e){}
}

/* ── CLOUD SAVE (debounced — writes 2s after last change) ── */
function saveST(){
  saveLocal();
  if(!USE_CLOUD()) return;
  clearTimeout(_cloudSaveTimer);
  _cloudSaveTimer = setTimeout(saveCloud, 2000);
}

async function saveCloud(){
  if(!USE_CLOUD()) return;
  try{
    const uid = getUID();
    await fetch(`${SUPABASE_URL}/rest/v1/farsi_progress`, {
      method: 'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({
        user_id: uid,
        xp: ST.xp,
        streak: ST.streak,
        daily_xp: ST.dailyXp,
        last_date: ST.lastDate,
        completed: ST.completed,
        act_done: ST.actDone,
        start_date: ST.startDate,
        conv_done: ST.convDone,
        weak_words: ST.weakWords,
        updated_at: new Date().toISOString()
      })
    });
  } catch(e){ console.warn('Cloud save failed (offline?):', e); }
}

/* ── CLOUD LOAD (runs after local, merges if cloud is newer) ── */
async function loadCloud(){
  if(!USE_CLOUD()) return;
  try{
    const uid = getUID();
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/farsi_progress?user_id=eq.${uid}&select=*`,
      { headers:{ 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    const rows = await res.json();
    if(!rows || rows.length === 0) return;
    const cloud = rows[0];
    // Merge: take the higher XP value, union of completed days
    const mergedActDone = Object.assign({}, ST.actDone);
    const cloudAct = cloud.act_done || {};
    Object.keys(cloudAct).forEach(d=>{
      mergedActDone[d] = Math.max(mergedActDone[d]||0, cloudAct[d]||0);
    });
    ST.xp        = Math.max(ST.xp, cloud.xp||0);
    ST.streak    = Math.max(ST.streak, cloud.streak||0);
    ST.dailyXp   = Math.max(ST.dailyXp, cloud.daily_xp||0);
    ST.lastDate  = cloud.last_date || ST.lastDate;
    ST.completed = Object.assign({}, ST.completed, cloud.completed||{});
    ST.actDone   = mergedActDone;
    ST.startDate = ST.startDate || cloud.start_date;
    ST.convDone  = Object.assign({}, ST.convDone, cloud.conv_done||{});
    // weak words: merge by taking the max weight seen on each side
    const mergedWeak = Object.assign({}, ST.weakWords);
    const cloudWeak = cloud.weak_words || {};
    Object.keys(cloudWeak).forEach(k=>{ mergedWeak[k]=Math.max(mergedWeak[k]||0, cloudWeak[k]||0); });
    ST.weakWords = mergedWeak;
    saveLocal();
    buildHome(); // re-render with merged cloud data
    updateHeader();
  } catch(e){ console.warn('Cloud load failed (offline?):', e); }
}

/* ── FULL INIT ── */
async function loadST(){
  loadLocalST();   // instant — from localStorage
  loadCloud();     // async — merges cloud data when ready
}

async function restoreFromUID(){
  const input = document.getElementById('restore-uid-input');
  const newUID = input ? input.value.trim() : '';
  if(!newUID){ alert('Please paste your User ID first.'); return; }
  if(!USE_CLOUD()){ alert('Cloud sync is not configured yet. Complete the Supabase setup first.'); return; }
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/farsi_progress?user_id=eq.${newUID}&select=*`,
      { headers:{ 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    const rows = await res.json();
    if(!rows || rows.length===0){ alert('No progress found for that ID. Check it and try again.'); return; }
    // Save the new UID locally and load that data
    localStorage.setItem(UID_KEY, newUID);
    const cloud = rows[0];
    ST.xp        = cloud.xp        || 0;
    ST.streak    = cloud.streak    || 0;
    ST.dailyXp   = cloud.daily_xp  || 0;
    ST.lastDate  = cloud.last_date  || '';
    ST.completed = cloud.completed  || {};
    ST.actDone   = cloud.act_done   || {};
    ST.startDate = cloud.start_date || null;
    ST.convDone  = cloud.conv_done  || {};
    ST.weakWords = cloud.weak_words || {};
    saveLocal();
    document.getElementById('restore-panel').remove();
    buildHome(); updateHeader();
    alert('Progress restored successfully! 🎉');
  } catch(e){ alert('Could not connect to cloud. Check your internet connection.'); }
}

/* Determine which day to show — capped at 60 */
function getCurrentDay(){
  if(!ST.startDate) return 1;
  try{
    const start = new Date(ST.startDate);
    const now   = new Date();
    const diff  = Math.floor((now - start)/(1000*60*60*24));
    return Math.min(Math.max(diff+1, 1), 120);
  } catch(e){ return 1; }
}

/* ── MONTH-CARD ACCORDION ── */
const MONTH_META = [
  {n:1, title:'Foundations',        theme:'Greetings, core verbs, survival phrases'},
  {n:2, title:'Everyday Life',      theme:'Health, work, culture, past & future tense'},
  {n:3, title:'Family & Informal',  theme:'Humor, in-laws, tarof, verb deep-dives'},
  {n:4, title:'Fluency & Logistics',theme:'Conditionals, errands, problems, listening'},
];
let openMonth = null; // which month is expanded

function buildMonthCards(day){
  const wrap = document.getElementById('month-cards');
  const totalDays = CURRICULUM.length;
  const monthsAvail = Math.ceil(totalDays/30);
  const curMonth = Math.ceil(day/30);
  if(openMonth===null) openMonth = curMonth; // default: expand current month

  let html = '';
  for(let m=1;m<=monthsAvail && m<=MONTH_META.length;m++){
    const meta = MONTH_META[m-1];
    const startD = (m-1)*30+1;
    const endD = Math.min(m*30, totalDays);
    // completion count for the month
    let doneCount=0;
    for(let i=startD;i<=endD;i++){ if((ST.actDone[i]||0)>=3) doneCount++; }
    const totalInMonth = endD-startD+1;
    const isCur = (m===curMonth);
    const isOpen = (m===openMonth);
    const allDone = doneCount===totalInMonth;

    html += `<div class="card" style="margin-bottom:10px;padding:0;overflow:hidden;${isCur?'border:1.5px solid var(--gold);':''}">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer" onclick="toggleMonth(${m})">
        <div>
          <div class="serif" style="font-size:16px;color:${isCur?'#E8C97A':'var(--fg)'}">Month ${m} · ${meta.title}${isCur?' ●':''}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${meta.theme}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;color:${allDone?'#2D6A4F':(isCur?'var(--gold)':'var(--muted)')}">${allDone?'✓ ':''}${doneCount}/${totalInMonth}</div>
          <div style="font-size:15px;color:var(--muted);margin-top:2px">${isOpen?'▾':'▸'}</div>
        </div>
      </div>`;

    if(isOpen){
      html += `<div style="padding:0 12px 12px">`;
      for(let i=startD;i<=endD;i++){
        const les = CURRICULUM[i-1];
        const a = ST.actDone[i]||0;
        const locked = i>day;
        const isToday = i===day;
        const checks = a>=3 ? '✓✓✓' : (a>0 ? '✓'.repeat(a)+'·'.repeat(3-a) : '···');
        const checkColor = a>=3 ? '#2D6A4F' : (a>0 ? 'var(--gold)' : 'var(--muted)');
        let bg, bd, txt, sub;
        if(isToday){ bg='var(--gold)'; bd='var(--gold)'; txt='#0E0C0A'; sub='#5a4d24'; }
        else if(a>=3){ bg='rgba(201,168,76,0.12)'; bd='rgba(201,168,76,0.3)'; txt='var(--fg)'; sub='var(--muted)'; }
        else if(locked){ bg='rgba(255,255,255,0.02)'; bd='rgba(201,168,76,0.15)'; txt='var(--fg)'; sub='var(--muted)'; }
        else { bg='rgba(255,255,255,0.04)'; bd='rgba(201,168,76,0.2)'; txt='var(--fg)'; sub='var(--muted)'; }

        html += `<div style="display:flex;align-items:center;gap:11px;background:${bg};border:0.5px solid ${bd};border-radius:10px;padding:10px 13px;margin-top:8px;${locked?'opacity:0.4;':'cursor:pointer;'}" ${locked?'':`onclick="openDayPanel(${i})"`}>
          <div style="font-size:19px">${les.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:500;color:${txt}">Day ${i} · ${les.theme}${isToday?' — today':''}${locked?' 🔒':''}</div>
            <div style="font-size:11px;color:${sub};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${les.desc||les.theme}</div>
          </div>
          <div style="font-size:12px;color:${checkColor};letter-spacing:1px">${locked?'':checks}</div>
        </div>`;

        // Conversation of the Week — only for the 8 agreed weeks (M3: 13,14,15,16 · M4: 19,21,22,23)
        const CONV_WEEKS = [13,14,15,16,19,21,22,23];
        if(i%5===0 && i!==endD && CONV_WEEKS.includes(i/5)){
          const weekN = i/5;
          const convDone = ST.convDone && ST.convDone[weekN];
          const convLocked = a<3; // unlocked once that review day's 3 activities are done
          html += `<div style="display:flex;align-items:center;gap:11px;background:rgba(74,63,143,0.13);border:0.5px solid rgba(74,63,143,0.4);border-radius:10px;padding:10px 13px;margin-top:8px;${convLocked?'opacity:0.4;':'cursor:pointer;'}" ${convLocked?'':`onclick="launchConversation(${weekN})"`}>
            <div style="font-size:19px">🗣️</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:500;color:var(--fg)">Conversation of the Week${convLocked?' 🔒':''}</div>
              <div style="font-size:11px;color:#9a92c4">A full dialogue capstone — fill in the responses</div>
            </div>
            <div style="font-size:12px;color:${convDone?'#2D6A4F':'var(--muted)'};letter-spacing:1px">${convLocked?'':(convDone?'✓':'▸')}</div>
          </div>`;
        }
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  wrap.innerHTML = html;
}

  </div>`;
}

/* Launch a Conversation of the Week — runs fill-in-the-response through the lesson engine */
function launchConversation(weekN){
  const conv = CONVERSATIONS[weekN];
  if(!conv){ alert('This conversation is coming soon.'); return; }
  // Build a question list: only the "you" lines become fill-in questions; context lines are shown inline.
  activeDay = getCurrentDay();
  activeAct = 'convo';
  activeConvWeek = weekN;
  // Each "you" line becomes an MCQ; we thread the preceding context into the label.
  const qs = [];
  let context = [];
  conv.lines.forEach(line=>{
    if(line.you){
      const ctxHtml = context.map(c=>`<div style="margin-bottom:6px"><span style="font-size:11px;color:var(--muted)">${c.spk}:</span> <span style="color:var(--fg)">${c.f}</span> <span style="font-size:12px;color:var(--muted)">— ${c.e}</span></div>`).join('');
      qs.push({
        type:'mcq',
        label:`${ctxHtml?'<div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:12px;margin-bottom:14px;text-align:left">'+ctxHtml+'</div>':''}<div style="font-size:14px;color:var(--muted);margin-bottom:4px">Your line: ${line.prompt}</div>`,
        options:line.options,
        answer:line.answer,
        note:`"${line.answer}" — ${line.p} · ${line.e}`
      });
      context = [{spk:'You',f:line.answer,e:line.e}]; // your line becomes context for the next exchange
    } else {
      context.push(line);
    }
  });
  activeQs = qs;
  qIdx=0; sessionCorrect=0; sessionWrong=0; buildPlaced=[];
  updateHeader();
  document.getElementById('l-act-label').textContent='🗣️ Conversation of the Week · '+conv.title;
  renderProgress();
  renderQ();
  show('s-lesson');
}

function endConversation(){
  // Mark this week's conversation complete
  if(!ST.convDone) ST.convDone = {};
  ST.convDone[activeConvWeek] = true;
  saveST();
  const conv = CONVERSATIONS[activeConvWeek];
  const cc=document.getElementById('res-complete'); if(cc) cc.textContent='✓ Complete';
  const ring=document.getElementById('res-icon');
  ring.style.borderColor='#4A3F8F'; ring.textContent='🗣️';

}

/* ══════════════════════════════════════════════════════
   CUMULATIVE REVIEW MODE — practice only, no XP
   25 random questions across all unlocked days.
   Weak words (missed before) and older days appear more.
═══════════════════════════════════════════════════════ */
/* Weak-word tracking lives in ST.weakWords so it syncs to Supabase across devices. */
function getWeak(){
  if(!ST.weakWords) ST.weakWords = {};
  return ST.weakWords;
}
function recordMiss(f){
  if(!f) return;
  if(!ST.weakWords) ST.weakWords = {};
  ST.weakWords[f] = (ST.weakWords[f]||0) + 1;
  saveST();
}
function recordHit(f){
  if(!f) return;
  if(!ST.weakWords) ST.weakWords = {};
  if(ST.weakWords[f]){
    ST.weakWords[f] = Math.round((ST.weakWords[f] - 0.5) * 10) / 10;
    if(ST.weakWords[f] <= 0) delete ST.weakWords[f];
    saveST();
  }
}

function makeReviewQs(count){
  const day = getCurrentDay();
  const sh = a=>[...a].sort(()=>Math.random()-0.5);
  const weak = getWeak();

  // Full vocab pool across all unlocked days, tagged with day number
  const pool = [];
  for(let d=1; d<=day; d++){
    CURRICULUM[d-1].vocab.forEach(v=>pool.push({f:v.f, p:v.p, e:v.e, day:d}));
  }

  const noSameMeaning = (correct, p) => p.filter(x=>{
    if(x.f === correct.f) return false;
    const cParts = correct.e.toLowerCase().split(/[\/,]/).map(s=>s.trim());
    const xParts = x.e.toLowerCase().split(/[\/,]/).map(s=>s.trim());
    return !cParts.some(cp => xParts.some(xp => xp===cp || xp.includes(cp) || cp.includes(xp)));
  });

  // Weight each word: weak words boosted heavily, older days boosted
  const items = pool.map(v=>{
    let w = 1;
    w += Math.min(3, weak[v.f]||0) * 2;          // weak-word boost (up to +6)
    w += ((day - v.day) / Math.max(day,1)) * 2;  // older-day boost (up to +2)
    return {v, w};
  });

  // Weighted sampling without replacement
  const picked = [];
  while(picked.length < count && items.length){
    const total = items.reduce((s,it)=>s+it.w, 0);
    let r = Math.random() * total;
    let idx = items.length - 1;
    for(let i=0; i<items.length; i++){ r -= items[i].w; if(r <= 0){ idx = i; break; } }
    picked.push(items[idx].v);
    items.splice(idx, 1);
  }

  // Generate questions in 3 rotating formats
  return picked.map((v,i)=>{
    const wrongPool = sh(noSameMeaning(v, pool));
    const wrongE = wrongPool.slice(0,3).map(x=>x.e);
    const wrongF = wrongPool.slice(0,3).map(x=>x.f);
    const tag = `<span style="font-size:12px;color:var(--muted)">(Day ${v.day})</span>`;
    const fmt = i % 3;
    if(fmt===0) return {type:'mcq', label:`What does "${v.f}" mean? ${tag}`,
      options:sh([v.e,...wrongE]), answer:v.e, note:`"${v.f}" (${v.p}) = ${v.e}`, vocabF:v.f};
    if(fmt===1) return {type:'spoken', prompt:`How do you say "${v.e}" in Farsi? ${tag}`,
      options:sh([v.f,...wrongF]), answer:v.f, vocab:pool, note:`"${v.f}" — pronounced: ${v.p}`, vocabF:v.f};
    return {type:'mcq', label:`You hear "${v.p}" — what does it mean? ${tag}`,
      options:sh([v.e,...wrongE]), answer:v.e, note:`"${v.f}" (${v.p}) = ${v.e}`, vocabF:v.f};
  });
}

function launchReview(){
  activeDay = getCurrentDay();
  activeAct = 'review';
  activeQs = makeReviewQs(25);
  qIdx=0; sessionCorrect=0; sessionWrong=0; buildPlaced=[];
  updateHeader();
  document.getElementById('l-act-label').textContent='🎯 Cumulative Review · Days 1–'+activeDay+' · practice only';
  renderProgress();
  renderQ();
  show('s-lesson');
}

function endReview(){
  const total = activeQs.length;
  const acc = Math.round((sessionCorrect/Math.max(total,1))*100);
  const cc=document.getElementById('res-complete'); if(cc) cc.textContent=acc+'% recall';
  const ring=document.getElementById('res-icon');
  if(acc>=80){ring.style.borderColor='var(--gold)';ring.textContent='🎯';}
  else if(acc>=50){ring.style.borderColor='#4A3F8F';ring.textContent='👍';}
  else{ring.style.borderColor='#9B2335';ring.textContent='📚';}
  document.getElementById('res-title').textContent = acc>=80?'Sharp recall!':acc>=50?'Solid review!':'Good practice!';
  document.getElementById('res-sub').textContent = `${sessionCorrect}/${total} correct · Cumulative Review · Days 1–${getCurrentDay()}`;

  // Weak-word focus list
  const weak = getWeak();
  const weakList = Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let html='';
  if(weakList.length){
    const allVocab = {};
    for(let d=1; d<=getCurrentDay(); d++) CURRICULUM[d-1].vocab.forEach(v=>{ allVocab[v.f]=v; });
    html += `<div class="card" style="margin-bottom:16px;text-align:left"><div style="font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px">Words to focus on — these will appear more often</div>`;
    weakList.forEach(([f])=>{
      const v = allVocab[f];
      if(v) html += `<div class="recap-item"><span class="recap-farsi">${v.f}</span><div><div style="font-size:14px;font-weight:500">${v.e}</div><div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">🔊 ${v.p}</div></div></div>`;
    });
    html += `</div>`;
  }
  html += `<button class="btn btn-gold btn-block" style="margin-bottom:10px" onclick="launchReview()">New 25-question review →</button>`;
  document.getElementById('res-vocab').innerHTML = html;
  show('s-result');
}

/* ─────────────────────────────────────────────────────
   ACTIVITY 1 — TEACH-FIRST LESSON
   Every word gets a teach card. After every word a quick
   MCQ fires. Then all curated lesson questions run.
   Target: ~20 steps total.
───────────────────────────────────────────────────── */
function makeLessonQs(day){
  const lesson = CURRICULUM[day-1];
  const sh = a=>[...a].sort(()=>Math.random()-0.5);
  const vocab = lesson.vocab;

  // One teach card per word
  const teachCards = vocab.map(v=>({type:'teach', farsi:v.f, phon:v.p, eng:v.e, note:v.note||null}));

  // One immediate "lock-in" MCQ right after each teach card
  const lockIns = vocab.map(v=>{
    const wrongE = sh(vocab.filter(x=>x.f!==v.f)).slice(0,3).map(x=>x.e);
    return {type:'mcq', label:`Quick check — what does "${v.f}" mean?`,
      options:sh([v.e,...wrongE]), answer:v.e,
      note:`"${v.f}" (${v.p}) = ${v.e}`};
  });

  // Interleave: teach → lock-in, teach → lock-in…
  const mixed = [];
  teachCards.forEach((tc,i)=>{ mixed.push(tc); mixed.push(lockIns[i]); });

  // Then all curated lesson questions
  mixed.push(...lesson.questions);

  // Finally a pronunciation round: hear phonetic → pick meaning (uses all vocab)
  sh(vocab).slice(0,3).forEach(v=>{
    const wrongE = sh(vocab.filter(x=>x.f!==v.f)).slice(0,3).map(x=>x.e);
    mixed.push({type:'mcq', label:`You hear someone say "${v.p}" — what do they mean?`,
      options:sh([v.e,...wrongE]), answer:v.e, note:`"${v.f}" (${v.p}) = ${v.e}`});
  });

  return mixed;
}

/* ─────────────────────────────────────────────────────
   ACTIVITY 2 — VOCAB QUIZ  (12 questions)
   Cycles through 4 recognition-based formats.
───────────────────────────────────────────────────── */
function makeVocabQuizQs(day){
  const vocab = CURRICULUM[day-1].vocab;
  const sh = a=>[...a].sort(()=>Math.random()-0.5);
  const qs = [];

  // Exclude wrong options that share the same English meaning (handles "How are you?" duplicates etc.)
  const noSameMeaning = (correct, pool) => pool.filter(x=> {
    if(x.f === correct.f) return false;
    const ce = correct.e.toLowerCase();
    const xe = x.e.toLowerCase();
    // Exclude if English is identical OR any slash-separated variant matches
    const cParts = ce.split(/[\/,]/).map(p=>p.trim());
    const xParts = xe.split(/[\/,]/).map(p=>p.trim());
    return !cParts.some(cp => xParts.some(xp => xp === cp || xp.includes(cp) || cp.includes(xp)));
  });

  const getWrongF = (v) => sh(noSameMeaning(v, vocab)).slice(0,3).map(x=>x.f);
  const getWrongE = (v) => sh(noSameMeaning(v, vocab)).slice(0,3).map(x=>x.e);

  sh([...vocab,...vocab]).slice(0,12).forEach((v,i)=>{
    const fmt = i % 4;
    const wrongF = getWrongF(v);
    const wrongE = getWrongE(v);
    if(wrongF.length < 1 || wrongE.length < 1) return;

    if(fmt===0){
      qs.push({type:'mcq', label:`What does "${v.f}" mean?`,
        options:sh([v.e,...wrongE]), answer:v.e, note:`"${v.f}" (${v.p}) = ${v.e}`});
    } else if(fmt===1){
      qs.push({type:'spoken', prompt:`How do you say "${v.e}" in Farsi?`,
        options:sh([v.f,...wrongF]), answer:v.f, vocab,
        note:`"${v.f}" — pronounced: ${v.p}`});
    } else if(fmt===2){
      qs.push({type:'mcq', label:`You hear "${v.p}" — what does it mean?`,
        options:sh([v.e,...wrongE]), answer:v.e, note:`"${v.f}" (${v.p}) = ${v.e}`});
    } else {
      qs.push({type:'spoken', prompt:`You want to say "${v.e}". Which do you choose?`,
        options:sh([v.f,...wrongF]), answer:v.f, vocab,
        note:`"${v.f}" — pronounced: ${v.p}`});
    }
  });

  // Pad to 8 if needed
  while(qs.length < 8 && vocab.length >= 2){
    const v = vocab[qs.length % vocab.length];
    const wrongE = getWrongE(v);
    if(wrongE.length > 0){
      qs.push({type:'mcq', label:`What does "${v.f}" mean?`,
        options:sh([v.e,...wrongE]), answer:v.e, note:`"${v.f}" (${v.p}) = ${v.e}`});
    } else break;
  }
  return qs.slice(0,12);
}

/* ─────────────────────────────────────────────────────
   ACTIVITY 3 — CHALLENGE  (12 questions)
   Mix: cloze, spoken, sentence builds, cross-day recall,
   conversation MCQs, and harder context questions.
───────────────────────────────────────────────────── */
function makeChallengeQs(day){
  const lesson = CURRICULUM[day-1];
  const vocab = lesson.vocab;
  const sh = a=>[...a].sort(()=>Math.random()-0.5);
  const qs = [];

  // Same semantic deduplication helper used in quiz
  const noSameMeaning = (correct, pool) => pool.filter(x=> {
    if(x.f === correct.f) return false;
    const cParts = correct.e.toLowerCase().split(/[\/,]/).map(p=>p.trim());
    const xParts = x.e.toLowerCase().split(/[\/,]/).map(p=>p.trim());
    return !cParts.some(cp => xParts.some(xp => xp === cp || xp.includes(cp) || cp.includes(xp)));
  });

  // 4 cloze fill-in-the-blank sentences
  const clozeTemplates = [
    (v)=>({ tpl:`Man ___ hastam.`,  hint:`Complete: "I am ___.`,          eng:`I am ${v.e}.`       }),
    (v)=>({ tpl:`Man ___ daaram.`,  hint:`Complete: "I have ___.`,         eng:`I have ${v.e}.`     }),
    (v)=>({ tpl:`___ khoob-e.`,     hint:`Complete: "___ is good."`,       eng:`${v.e} is good.`   }),
    (v)=>({ tpl:`Man ___ mikhaham.`,hint:`Complete: "I want ___."`,        eng:`I want ${v.e}.`    }),
    (v)=>({ tpl:`Oo ___ darad.`,    hint:`Complete: "He/She has ___."`,    eng:`He/She has ${v.e}.`}),
  ];
  sh(vocab).slice(0,4).forEach(v=>{
    const s = clozeTemplates[Math.floor(Math.random()*clozeTemplates.length)](v);
    const wrongOpts = sh(noSameMeaning(v, vocab)).slice(0,3).map(x=>x.f);
    qs.push({type:'cloze', template:s.tpl, hint:s.hint, engHint:s.eng,
      options:sh([v.f,...wrongOpts]), answer:v.f,
      note:`"${v.f}" (${v.p}) = ${v.e}`});
  });

  // 3 spoken-context questions
  sh(vocab).slice(0,3).forEach(v=>{
    const wrongF = sh(noSameMeaning(v, vocab)).slice(0,3).map(x=>x.f);
    qs.push({type:'spoken', prompt:`You want to say "${v.e}". Which Farsi phrase do you use?`,
      options:sh([v.f,...wrongF]), answer:v.f, vocab,
      note:`"${v.f}" — pronounced: ${v.p}`});
  });

  // Up to 3 sentence builds (shuffled word tiles)
  const buildPool = lesson.questions.filter(q=>q.type==='build');
  if(buildPool.length >= 1){
    sh(buildPool).slice(0,Math.min(3,buildPool.length)).forEach(bq=>qs.push(bq));
  } else {
    const v1=vocab[0], v2=vocab[1]||vocab[0];
    qs.push({type:'build', english:`I have ${v2.e}.`,
      words:sh(['man',v2.f,'daaram','hastam',v1.f]),
      correct:['man',v2.f,'daaram'],
      note:`"Man ${v2.f} daaram." — Subject → Object → Verb.`});
  }

  // 2 cross-day MCQs from prior days' vocab
  const priorVocab = [];
  for(let d=Math.max(1,day-4);d<day;d++) priorVocab.push(...CURRICULUM[d-1].vocab);
  const crossPool = sh(priorVocab).slice(0,2);
  crossPool.forEach(pv=>{
    const wrong = sh(noSameMeaning(pv, priorVocab)).slice(0,3).map(x=>x.e);
    qs.push({type:'mcq', label:`From an earlier lesson — what does "${pv.f}" mean?`,
      options:sh([pv.e,...wrong]), answer:pv.e,
      note:`"${pv.f}" (${pv.p}) = ${pv.e}`});
  });
  // Day 1 fallback
  if(crossPool.length===0){
    const v=sh(vocab)[0];
    const wrong=sh(noSameMeaning(v, vocab)).slice(0,3).map(x=>x.e);
    qs.push({type:'mcq', label:`"${v.f}" in English is…`, options:sh([v.e,...wrong]),
      answer:v.e, note:`"${v.f}" (${v.p}) = ${v.e}`});
  }

  return sh(qs).slice(0,12);
}

function launchActivity(day, actNum){
  activeDay = day;
  activeAct = actNum;
  if(actNum===1) activeQs = makeLessonQs(day);
  else if(actNum===2) activeQs = makeVocabQuizQs(day);
  else activeQs = makeChallengeQs(day);
  qIdx=0; sessionCorrect=0; sessionWrong=0; buildPlaced=[];
  updateHeader();
  const labels=['','📖 Lesson','⚡ Vocab Quiz','🏅 Challenge'];
  document.getElementById('l-act-label').textContent=labels[actNum];
  renderProgress();
  renderQ();
  show('s-lesson');
}

function renderProgress(){
  document.getElementById('l-prog').style.width = Math.round((qIdx/activeQs.length)*100)+'%';
}

function renderQ(){
  document.getElementById('l-feedback').style.display='none';
  document.getElementById('l-actions').innerHTML='';
  const q = activeQs[qIdx];
  const area = document.getElementById('l-q-area');
  if(q.type==='teach') renderTeach(q,area);
  else if(q.type==='mcq') renderMCQ(q,area);
  else if(q.type==='translate') renderTranslate(q,area);
  else if(q.type==='typeit') renderTypeit(q,area);
  else if(q.type==='spoken') renderSpoken(q,area);
  else if(q.type==='cloze') renderCloze(q,area);
  else if(q.type==='conjugate') renderConjugate(q,area);
  else if(q.type==='build') renderBuild(q,area);
  else if(q.type==='convo') renderConvo(q,area);
  renderProgress();
}

/* SPOKEN — "how do you say X?" — options shown as Farsi + pronunciation so you recognise by sound */

/* MCQ */
function renderMCQ(q,area){
  area.innerHTML=`<div class="q-label">Choose the correct answer</div>
    <div class="q-main">${q.label}</div>
    <div id="opts"></div>`;
  q.options.forEach(o=>{
    const b=document.createElement('button');b.className='opt-btn';b.textContent=o;
    b.onclick=()=>checkMCQ(o,q,b); document.getElementById('opts').appendChild(b);
  });
}
function checkMCQ(sel,q,btn){
  document.querySelectorAll('.opt-btn').forEach(b=>b.onclick=null);
  const ok=sel===q.answer; btn.classList.add(ok?'correct':'wrong');
  if(!ok){document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct');});loseHeart();}
  showFeedback(ok,q.note); if(ok)sessionCorrect++;else sessionWrong++;
  document.getElementById('l-actions').innerHTML=`<button class="btn btn-gold btn-block" onclick="advance()">Continue →</button>`;
}

/* TRANSLATE */
function renderTranslate(q,area){
  const word = q.label.replace('Translate: ','').replace(/"/g,'');
  area.innerHTML=`<div class="q-label">Translate to English</div>
    <div class="q-farsi">${word}</div>
    <div class="q-phon">🔊 ${CURRICULUM[activeDay-1].vocab.find(v=>v.f===word)?.p||''}</div>
    <input type="text" id="tin" placeholder="Type your answer…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`;
  document.getElementById('l-actions').innerHTML=`<button class="btn btn-gold btn-block" onclick="checkTranslate()">Check →</button>`;
  setTimeout(()=>{ const i=document.getElementById('tin'); if(i){i.focus(); i.onkeydown=e=>{if(e.key==='Enter')checkTranslate();};}},100);
}
function checkTranslate(){
  const q=activeQs[qIdx]; const inp=document.getElementById('tin'); if(!inp||!inp.value.trim())return;
  const val=inp.value.trim().toLowerCase();
  const ok=val===q.answer.toLowerCase()||(q.alts&&q.alts.some(a=>val===a.toLowerCase()))||val.includes(q.answer.toLowerCase().split(' ')[0]);
  inp.disabled=true; inp.className=ok?'ok':'bad';
  if(!ok)loseHeart(); showFeedback(ok,ok?q.note:'Correct: '+q.answer+(q.note?' — '+q.note:''));
  if(ok)sessionCorrect++;else sessionWrong++;
  document.getElementById('l-actions').innerHTML=`<button class="btn btn-gold btn-block" onclick="advance()">Continue →</button>`;
}

/* BUILD */
function renderBuild(q,area){
  buildPlaced=[];
  area.innerHTML=`<div class="q-label">Build the sentence in Farsi</div>
    <div class="q-main" style="font-size:17px">"${q.english}"</div>
    <div class="sentence-area" id="sent-area"><span style="color:var(--muted);font-size:13px;font-style:italic">Tap words below…</span></div>
    <div id="word-pool"></div>`;
  const pool=document.getElementById('word-pool');
  // Shuffle display order — answer tiles are tracked by original index, not position
  const shuffledWords = [...q.words.map((w,i)=>({w,i}))].sort(()=>Math.random()-0.5);
  shuffledWords.forEach(({w,i})=>{
    const t=document.createElement('span');t.className='word-tile';t.textContent=w;t.dataset.i=i;
    t.onclick=()=>placeWord(w,i,t); pool.appendChild(t);
  });
  document.getElementById('l-actions').innerHTML=`<div style="display:flex;gap:8px">
    <button class="btn btn-outline" onclick="clearBuild()" style="flex:1">Clear</button>
    <button class="btn btn-gold" onclick="checkBuild()" style="flex:2">Check →</button>
  </div>`;
}
function placeWord(w,i,tile){
  if(tile.classList.contains('used'))return;
  tile.classList.add('used'); buildPlaced.push({w,i});
  const sa=document.getElementById('sent-area');
  if(buildPlaced.length===1)sa.innerHTML='';
  const pw=document.createElement('span');pw.className='placed-tile';pw.dataset.i=i;
  pw.innerHTML=w+' <small style="opacity:0.5">✕</small>';
  pw.onclick=()=>{buildPlaced=buildPlaced.filter(x=>x.i!==i);pw.remove();tile.classList.remove('used');if(buildPlaced.length===0)sa.innerHTML='<span style="color:var(--muted);font-size:13px;font-style:italic">Tap words below…</span>';};
  sa.appendChild(pw);
}
function clearBuild(){
  buildPlaced=[];
  document.querySelectorAll('.word-tile').forEach(t=>t.classList.remove('used'));
  document.getElementById('sent-area').innerHTML='<span style="color:var(--muted);font-size:13px;font-style:italic">Tap words below…</span>';
}
function checkBuild(){
  const q=activeQs[qIdx]; const placed=buildPlaced.map(x=>x.w);
  const ok=JSON.stringify(placed)===JSON.stringify(q.correct);
  if(ok){sessionCorrect++;showFeedback(true,q.note);}
  else{
    loseHeart();sessionWrong++;
    const sa=document.getElementById('sent-area');sa.classList.add('shake');setTimeout(()=>sa.classList.remove('shake'),400);
    showFeedback(false,'Correct: <span style="font-family:\'DM Mono\',monospace;color:var(--gold)">'+q.correct.join(' ')+'</span> — '+q.note);
  }
  document.getElementById('l-actions').innerHTML=`<button class="btn btn-gold btn-block" onclick="advance()">Continue →</button>`;
}

    <div class="convo-wrap">${bubbles}</div>
    <div class="q-main" style="font-size:16px">${q.mcq.prompt}</div>

  q.mcq.options.forEach(o=>{

      showFeedback(ok,q.mcq.note||''); if(ok)sessionCorrect++;else sessionWrong++;
      document.getElementById('l-actions').innerHTML=`<button class="btn btn-gold btn-block" onclick="advance()">Continue →</button>`;
    };
    document.getElementById('opts').appendChild(b);
  });
}

/* FEEDBACK & ADVANCE */
let lastWrong=false; // tracks whether the just-answered question was missed
function showFeedback(ok,note){
  lastWrong = !ok;
  if(activeAct==='review'){
    const q = activeQs[qIdx];
    if(q && q.vocabF){ ok ? recordHit(q.vocabF) : recordMiss(q.vocabF); }
  }
  const fb=document.getElementById('l-feedback'); fb.style.display='block';
  fb.className='feedback-box '+(ok?'ok':'bad');
  const retryNote = ok ? '' : '<div style="font-size:12px;margin-top:6px;color:var(--gold);font-style:italic">You\'ll see this one again before finishing.</div>';
  fb.innerHTML=`<div class="feedback-title">${ok?'✓ Correct!':'✗ Not quite'}</div>${note?'<div style="font-size:13px;margin-top:4px;line-height:1.6">'+note+'</div>':''}${retryNote}`;
}
function loseHeart(){ /* hearts removed — wrong answers are re-queued instead (see advance) */ }
function advance(){
  // Daily lessons: if the current question was missed, re-queue a copy to the end so it must be answered correctly before finishing.
  // Review mode stays single-pass (weak words are tracked separately) so it reflects real recall.
  if(lastWrong && activeAct!=='review'){
    const q=activeQs[qIdx];
    activeQs.push(q);            // same question object appended to end
    lastWrong=false;
  }
  lastWrong=false;
  qIdx++;
  if(qIdx>=activeQs.length) endLesson();
  else renderQ();
}

/* END LESSON */
function endLesson(){
  if(activeAct==='review'){ endReview(); return; }
  if(activeAct==='convo'){ endConversation(); return; }
  const total=activeQs.length;
  // XP/streak kept in ST for data continuity only (never shown). Every question is answered correctly (re-queue), so completion is guaranteed.
  const xpTables=[0,20,15,15];
  const xpEarned=xpTables[activeAct]||0;
  ST.xp=(ST.xp||0)+xpEarned;
  const today=new Date().toDateString();
  if(ST.lastDate!==today){ST.streak=(ST.streak||0)+1; ST.dailyXp=0; ST.lastDate=today;}
  ST.dailyXp=(ST.dailyXp||0)+xpEarned;
  // mark activity done (only advance, never go back)
  const prev = ST.actDone[activeDay]||0;
  if(activeAct > prev) ST.actDone[activeDay]=activeAct;
  if((ST.actDone[activeDay]||0)>=3) ST.completed[activeDay]=true;
  saveST(); updateHeader();

  const cc=document.getElementById('res-complete'); if(cc) cc.textContent='✓ Complete';

  const ring=document.getElementById('res-icon');
  ring.style.borderColor='var(--gold)'; ring.textContent='⭐';

  const actLabels=['','Main Lesson','Vocab Quiz','Challenge'];
  const lesson=CURRICULUM[activeDay-1];
  document.getElementById('res-title').textContent='Complete! '+lesson.icon;
  document.getElementById('res-sub').textContent=`${actLabels[activeAct]} · Day ${activeDay} — ${lesson.theme}`;

  // Next activity hint
  const nextAct = (ST.actDone[activeDay]||0)+1;
  const nextLabels=['','Vocab Quiz ⚡','Challenge 🏅',''];
  const nextHint = nextAct<=3
    ? `<div style="margin-bottom:16px;padding:12px 16px;background:rgba(201,168,76,0.08);border:0.5px solid rgba(201,168,76,0.3);border-radius:var(--radius);font-size:13px;color:var(--muted)">
        Next up: <strong style="color:var(--gold)">${nextLabels[nextAct]}</strong>.
        <button class="btn btn-gold" style="margin-top:10px;width:100%" onclick="launchActivity(${activeDay},${nextAct})">Start ${nextLabels[nextAct]} →</button>
      </div>`
    : `<div style="margin-bottom:16px;padding:12px 16px;background:rgba(45,106,79,0.12);border:0.5px solid rgba(45,106,79,0.4);border-radius:var(--radius);font-size:13px;color:#A8D8B5;text-align:center">🏆 All 3 activities complete for Day ${activeDay}!</div>`;

  // vocab summary
  const vhtml=`${nextHint}<div class="card"><div style="font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px">Today's Vocabulary</div>
    ${lesson.vocab.slice(0,5).map(v=>`<div class="recap-item"><span class="recap-farsi">${v.f}</span><div><div style="font-size:14px;font-weight:500">${v.e}</div><div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">🔊 ${v.p}</div></div></div>`).join('')}</div>`;
  document.getElementById('res-vocab').innerHTML=vhtml;

  show('s-result');
}

  3:{
    grammar:[
      {title:'Pronouns — the full set, no gender',body:'"Oo" covers he, she, AND it — Farsi makes no gender distinction at all. This applies to all pronouns. There is no "his" or "her."',ex:{f:'Oo ketaab darad. Oo khoob-e.',p:'oo ke-TAAB da-RAD. oo KHOO-be',e:'She has a book. He is good. — same "Oo" for both.'}},
      {title:'Formal vs Informal "you" — Shoma vs To',body:'This distinction matters a lot. Use "Shoma" (and verb endings -id) with anyone you\'ve just met, elders, people in service roles. Use "To" (verb endings -i) only with close friends, family, and children. When in doubt — use Shoma.',ex:{f:'Shoma chetoorid? · To chetori?',p:'sho-MA che-TOO-rid? · to che-TO-ri?',e:'How are you? (polite) · How are you? (casual)'}},
      {title:'Possession suffix: attach -am, -at, -esh to nouns',body:'The quickest way to say "my/your/his" is to attach a suffix to the noun. -am = my, -at = your (inf.), -esh = his/her/its.',ex:{f:'Esm-am · Esm-at · Khaane-am',p:'esm-AM · esm-AT · KHAA-ne-am',e:'My name · Your name · My house'}},

  4:{
    grammar:[
      {title:'To Be (Budan) — the personal endings pattern',body:'The endings -am, -i, (nothing), -im, -id, -and attach to "hast-" for all six persons. Memorise these endings — they repeat across nearly every verb in Farsi.',ex:{f:'Man hastam. · Oo hast. · Ma hastim.',p:'man HAS-tam · oo hast · ma HAS-tim',e:'I am. · He/She is. · We are.'}},
      {title:'Informal spoken shortcut — drop "hast", keep suffix',body:'In casual conversation, Iranians drop "hast" entirely and attach just the personal ending to the preceding word. Very common in everyday speech.',ex:{f:'Khoob-am. · Khoob-i? · Khoob-e.',p:'KHOO-bam · KHOO-bi? · KHOO-be',e:"I'm good. · Are you good? · He/She is good."}},
      {title:'"Nistam" — the negative of "to be"',body:'To say "I am not," use nistam/nisti/nist/nistim/nistid/nistand. The pattern mirrors "hastam" exactly.',ex:{f:'Man mariz nistam. · Oo injaa nist.',p:'man ma-RIZ nis-TAM · oo in-JAA nist',e:"I am not sick. · He/She is not here."}},

  5:{
    grammar:[
      {title:'Present tense prefix: mi-',body:'Nearly every present-tense verb uses the prefix "mi-" before the verb root. Spotting "mi-" immediately tells you: this verb is present tense. It\'s the most recognisable feature of Farsi verbs.',ex:{f:'mi-ravam · mi-khoram · mi-daanam · mi-beenam',p:'mi-RA-vam · mi-KHO-ram · mi-DAA-nam · mi-BEE-nam',e:'I go · I eat · I know · I see'}},
      {title:'Negation: replace mi- with ne-mi-',body:'To negate ANY present-tense verb, swap "mi-" for "ne-mi-". This rule has no common exceptions — it works for every verb.',ex:{f:'Nemikhaham. · Nemidaanam. · Nemifahmam.',p:'ne-mi-KHAA-ham · ne-mi-DAA-nam · ne-mi-FAH-mam',e:"I don't want. · I don't know. · I don't understand."}},
      {title:'"Nadaaram" — negating "to have"',body:'"Dashtan" (to have) is negated differently: "nadaaram" (not "ne-midaaram"). This is one of the most common verbs so worth memorising as a special case.',ex:{f:'Pul nadaaram. · Vaght nadaaram.',p:'pool na-DAA-ram · vaght na-DAA-ram',e:"I don't have money. · I don't have time."}},
    ],
    phrases:[

  6:{
    grammar:[
      {title:'Adjectives FOLLOW the noun, linked by ezafe (-e)',body:'This is the reverse of English. The ezafe particle "-e" acts as a connector between noun and descriptor. Every noun-adjective pair uses it.',ex:{f:'Khaane-e bozorg · Ketaab-e jadid · Doost-e khoob',p:'KHAA-ne-e bo-ZORG · ke-TAAB-e ja-DID · doost-e KHOOB',e:'Big house · New book · Good friend'}},
      {title:'Ezafe also links nouns to owners (possession)',body:'The same "-e" connector links a noun to its owner. Think of it as "of": "ketaab-e man" = "book of me" = my book.',ex:{f:'Ketaab-e man · Khaane-e oo · Doost-e ma',p:'ke-TAAB-e man · KHAA-ne-e oo · doost-e maa',e:'My book · His/Her house · Our friend'}},
      {title:'Plurals: add -ha (but not with numbers)',body:'Add "-ha" after any noun to make it plural. Exception: when a number is already present, no plural needed.',ex:{f:'Ketaab → Ketaabha · Doost → Doostha · Se ketaab (not ketaabha)',p:'ke-TAAB → ke-TAAB-ha',e:'Book → Books · Friend → Friends · Three books (no -ha needed)'}},
      {title:'Informal "is": drop "hast", add -e to end',body:'In casual spoken Farsi, attach "-e" to the last word of a sentence to mean "is." Used constantly in everyday speech.',ex:{f:'Khaane bozorg-e. · Chai khoob-e. · Doost-e man injaa-st.',p:'KHAA-ne bo-ZORG-e · chay KHOO-be · doost-e man in-JAA-st',e:"The house is big. · The tea is good. · My friend is here."}},

  7:{
    grammar:[
      {title:'Week 1 Consolidation — The 5 Rules You Now Know',body:'By end of Week 1 you have all five foundational rules: (1) SOV word order. (2) No gender, no articles. (3) "mi-" = present tense. (4) "ne-mi-" = negation. (5) Ezafe "-e" links noun to adjective/owner. Everything else builds on these.',ex:{f:'Man aab-e sard nemikhaham.',p:'man aab-e sard ne-mi-KHAA-ham',e:'Lit: "I cold-water don\'t-want." = I don\'t want cold water. (SOV + ezafe + negation all in one)'}},
      {title:'The personal endings — memorise this chart',body:'These endings attach to almost every verb. Learn them once, apply them everywhere.',ex:{f:'-am (I) · -i (you inf.) · — (he/she) · -im (we) · -id (you formal) · -and (they)',p:'hast-am · hast-i · hast · hast-im · hast-id · hast-and',e:'The complete "to be" as an example of all six endings'}},
      {title:'The shortcut "-e" = "is" in casual speech',body:'One of the most useful patterns in spoken Farsi: ending any description with "-e" informally means "is." You\'ll hear this constantly.',ex:{f:'Khoob-e. · Bozorg-e. · Khosh-mazeh-e.',p:'KHOO-be · bo-ZORG-e · khosh-MA-ze-e',e:"It's good. · It's big. · It's delicious."}},

  8:{
    grammar:[
      {title:'To Want (Khaastan) — structure and usage',body:'"Mikhaham" is the workhorse verb for requests, desires, and plans. It follows the mi- + root + ending pattern. Put the desired item between the subject and the verb (SOV applies).',ex:{f:'Man aab mikhaham. · Man raftan mikhaham.',p:'man aab mi-KHAA-ham · man raf-TAN mi-KHAA-ham',e:'I want water. · I want to go. (noun or infinitive after subject)'}},
      {title:'Making polite requests — the golden template',body:'This three-part structure works in every service situation in Iran: Man + [what you want] + mikhaham, lotfan. Learn it as a single unit.',ex:{f:'Man yek chai mikhaham, lotfan.',p:'man yek chay mi-KHAA-ham, LOT-fan',e:'I would like one tea, please.'}},
      {title:'Negating wants — Nemikhaham',body:'Drop mi-, add ne-mi- as usual. "Nemikhaham" = I don\'t want. Also used to politely decline: "Na mamnoon, nemikhaham" = No thanks, I don\'t want any.',ex:{f:'Na mamnoon, nemikhaham.',p:'na mam-NOON, ne-mi-KHAA-ham',e:'No thank you, I don\'t want (any).'}},
      {title:'Wanting to DO something — verb infinitive',body:'To say you want to DO something, put the infinitive (the "-tan/-dan" form of the verb) after "mikhaham." The infinitive goes in the object position.',ex:{f:'Man khordan mikhaham. · Man raftan nemikhaham.',p:'man khor-DAN mi-KHAA-ham · man raf-TAN ne-mi-KHAA-ham',e:'I want to eat. · I don\'t want to go.'}},
    ],
    phrases:[
      {cat:'Ordering',f:'Man ___ mikhaham, lotfan.',p:'man ___ mi-KHAA-ham, LOT-fan',e:'I would like ___, please.'},
      {cat:'Ordering',f:'Yek chai va yek aab lotfan.',p:'yek chay va yek aab LOT-fan',e:'One tea and one water please.'},
      {cat:'Declining',f:'Na mamnoon, nemikhaham.',p:'na mam-NOON, ne-mi-KHAA-ham',e:'No thanks, I don\'t want any.'},
      {cat:'Asking',f:'Chi mikhahid?',p:'chi mi-KHAA-hid?',e:'What would you like? (formal)',note:'Used by waiters, shopkeepers'},

      {title:'To Eat (Khordan) — present and past',body:'"Mikhoram" (I eat) is essential for food situations. Note: the past root is "khord-", present root is "khor-". This verb also appears in "Khoosh omadi" — "you ate well" → "welcome."',ex:{f:'Man naan mikhoram. · Man ghaza khordam.',p:'man naan mi-KHO-ram · man gha-ZAA khor-DAM',e:'I am eating bread. · I ate food.'}},
      {title:'Expressing hunger and fullness',body:'"Gorosneh" (hungry) and "seer" (full) are adjectives — combine them with "hastam" (I am) to describe your state. Very common at any meal.',ex:{f:'Man gorosneh hastam. · Seer shodam.',p:'man go-ROS-ne HAS-tam · seer sho-DAM',e:'I am hungry. · I got full. (lit: I became full)'}},
      {title:'Food vocabulary pattern — describing taste',body:'Combine "khoob/bad/khosh-mazeh" with "-e" to describe food. The ezafe pattern applies here too: "ghaza-e khosh-mazeh" = delicious food.',ex:{f:'Ghaza khosh-mazeh-e. · Naan-e tazeh khoob-e.',p:'gha-ZAA khosh-MA-ze-e · naan-e ta-ZE KHOO-be',e:'The food is delicious. · Fresh bread is good.'}},

      {title:'Time words sit before the verb',body:'In Farsi, time words like "emrooz" (today), "farda" (tomorrow), and "diruz" (yesterday) go at the start of the sentence or just before the verb — never after it.',ex:{f:'Emrooz miravam. · Farda nemiram.',p:'em-ROOZ mi-RA-vam · far-DA ne-mi-RAM',e:'I am going today. · I am not going tomorrow.'}},
      {title:'Present tense used for near future',body:'Farsi commonly uses the present tense with a future time word to express future plans. There is no need to change the verb form.',ex:{f:'Farda miravam bazar.',p:'far-DA mi-RA-vam ba-ZAR',e:'I am going to the market tomorrow. (present verb, future meaning)'}},
      {title:'Days of the week — the Persian calendar',body:'The Persian week starts on Saturday (Shanbeh). Sunday is Yekshanbeh (one-Saturday), Monday is Doshanbe (two-Saturday), and so on. This makes them easy to count once you know the numbers.',ex:{f:'Shanbeh · Yekshanbeh · Doshanbe · Seshanbe',p:'sham-BE · yek-sham-BE · do-sham-BE · se-sham-BE',e:'Saturday · Sunday · Monday · Tuesday'}},

      {title:'Adjectives follow nouns — the ezafe rule in full',body:'Every time you attach an adjective to a noun, you need the ezafe "-e" connector. This applies to colours, sizes, qualities — everything. The adjective never precedes the noun.',ex:{f:'Mashine-e bozorg · Khaane-e ghashang · Doost-e khoob',p:'maa-SHEEN-e bo-ZORG · KHAA-ne-e gha-SHANG · doost-e KHOOB',e:'Big car · Beautiful house · Good friend'}},
      {title:'Adjectives as predicates — drop the noun, keep "-e"',body:'To say "it is big" without repeating the noun, just use the adjective plus the informal "-e" ending. This is extremely common in spoken Farsi.',ex:{f:'Bozorg-e. · Ghashang-e. · Khoob nist.',p:'bo-ZORG-e · gha-SHANG-e · KHOOB nist',e:"It's big. · It's beautiful. · It's not good."}},
      {title:'Comparatives: add "-tar" to the adjective',body:'To compare, attach "-tar" to the adjective. "Bozorgtar" = bigger. "Khoobtar" = better. Add "az" (from) to complete the comparison.',ex:{f:'In bozorgtar-e. · Oon khoobtar az in-e.',p:'in bo-ZORG-tar-e · oon KHOOB-tar az in-e',e:"This one is bigger. · That one is better than this one."}},

      {title:'"Chiye?" — the all-purpose "what is it?" question',body:'"Chi-ye" (what is it?) is formed from "chi" (what) + "-ye" (informal "is"). Attach it to any noun with "-e" to ask what something is.',ex:{f:'Esm-et chi-ye? · In chi-ye? · Oon chi bood?',p:'es-MAT chi-YE? · in chi-YE? · oon chi bood?',e:'What is your name? · What is this? · What was that?'}},
      {title:'"Kojast?" versus "Koja miravi?"',body:'"Kojast?" (where is it?) asks about location of a stationary thing. "Koja miravi?" asks about destination of movement. Both use "koja" but with different verbs.',ex:{f:'Hammam kojast? · Koja miravi?',p:'ham-MAM ko-JAST? · ko-JA mi-RA-vi?',e:'Where is the bathroom? · Where are you going?'}},

  14:{
    grammar:[
      {title:'Week 2 consolidation — what you now control',body:'By end of Week 2 you can: express wants (mikhaham), navigate (miravam + directions), talk about food, use time words, describe things with adjectives and ezafe, and ask the seven key question words.',ex:{f:'Farda koja miravi? · Chi mikhaham beporsam?',p:'far-DA ko-JA mi-RA-vi? · chi mi-KHAAM be-por-SAM?',e:'Where are you going tomorrow? · What do I want to ask?'}},
      {title:'Negation recap — three patterns you know',body:'(1) ne-mi- for present verbs. (2) na- for dashtan (nadaaram). (3) nist/nistam for "to be." These three cover almost every negation you will need.',ex:{f:'Nemikhaham. · Nadaaram. · Nistam.',p:'ne-mi-KHAA-ham · na-DAA-ram · nis-TAM',e:"I don't want. · I don't have. · I am not."}},
      {title:'Chaining sentences with "va" and "vali"',body:'"Va" (and) and "vali/amma" (but) let you connect two sentences. The verb still comes last in each clause.',ex:{f:'Man aab mikhaham vali chai nadaaram.',p:'man aab mi-KHAA-ham va-LI chay na-DAA-ram',e:"I want water but I don't have tea."}},
    ],

  15:{
    grammar:[
      {title:'Expressing pain — "dard daaram" pattern',body:'To say something hurts, use the body part + "dard daaram" (I have pain). The body part goes in the subject/topic position. This is the standard way to describe pain to a doctor.',ex:{f:'Sar dard daaram. · Dast dard daaram.',p:'sar dard DAA-ram · dast dard DAA-ram',e:'I have a headache. · My hand/arm hurts. (lit: I have head pain)'}},
      {title:'Being sick — "mariz hastam"',body:'Combine "mariz" (sick) with "hastam" to say you are ill. Negate with "nistam" to say you are not sick.',ex:{f:'Man mariz hastam. · Mariz nistam.',p:'man ma-RIZ HAS-tam · ma-RIZ nis-TAM',e:'I am sick. · I am not sick.'}},
      {title:'Needing something — "lazem daaram"',body:'"Lazem" means necessary/needed. "Lazem daaram" = I need. Very useful in medical or emergency situations.',ex:{f:'Doktor lazem daaram. · Dava lazem daaram.',p:'dok-TOR LA-zem DAA-ram · da-VA LA-zem DAA-ram',e:'I need a doctor. · I need medicine.'}},
    ],

  16:{

      {title:'Possession with family — suffix vs full form',body:'You can say "my mother" two ways: attach "-am" suffix (madar-am) or use the ezafe full form (madar-e man). Both are correct. Suffix form is more natural in speech.',ex:{f:'Madar-am · Madar-e man · Baradar-am · Khahar-e man',p:'ma-DAR-am · ma-DAR-e man · ba-ra-DAR-am · KHaa-har-e man',e:'My mother · My mother · My brother · My sister'}},
      {title:'Introducing family members',body:'To introduce someone, use "in ___ -am-e" (this is my ___). The structure is: in + [relation] + possession suffix + -e.',ex:{f:'In madar-am-e. · In baradar-am-e.',p:'in ma-DAR-am-e · in ba-ra-DAR-am-e',e:'This is my mother. · This is my brother.'}},
      {title:'"Daari?" for family — do you have a ___?',body:'Use "daari?" with family words to ask if someone has siblings, children etc.',ex:{f:'Baradar daari? · Bache daari?',p:'ba-ra-DAR DAA-ri? · ba-CHE DAA-ri?',e:'Do you have a brother? · Do you have children?'}},

  17:{
    grammar:[
      {title:'Bargaining structure — geroon-e, arzon-kon',body:'In bazaars, bargaining is expected. "Geroon-e" = it is expensive. "Arzon-kon" = make it cheaper (informal command). "Takhfif darid?" = do you have a discount?',ex:{f:'Geroon-e. Takhfif darid? · Arzon-tar mikonid?',p:'ge-ROON-e. takh-FIF da-RID? · ar-ZON-tar mi-KO-nid?',e:"It's expensive. Do you have a discount? · Can you make it cheaper?"}},
      {title:'Commands — informal and formal',body:'Drop the "mi-" prefix and use just the verb root for an informal command. For formal commands, use "be-" + root + "-id".',ex:{f:'Bia! · Biaid! · Bekharid! · Berid!',p:'bi-A! · bi-AID! · be-KHA-rid! · be-RID!',e:'Come! (inf) · Come! (formal) · Buy! (formal) · Go! (formal)'}},
      {title:'Prices — saying numbers + currency',body:'Iranian currency is the Toman (informal) or Rial (official). In everyday speech people say "hezar" (thousand) + toman. "Bist hezar" = 20,000 tomans.',ex:{f:'Dah hezar toman. · Panjah hezar toman.',p:'dah he-ZAR to-MAN · pan-JAH he-ZAR to-MAN',e:'Ten thousand tomans. · Fifty thousand tomans.'}},
    ],
    phrases:[

      {cat:'Money',f:'Pul nadaaram.',p:'pool na-DAA-ram',e:"I don't have money."},

  18:{
    grammar:[
      {title:'"Hava" sentences — describing weather',body:'"Hava" (weather/air) is the subject of weather sentences. Combine it with an adjective and the informal "-e" ending to make weather statements.',ex:{f:'Hava garm-e. · Hava sard-e. · Hava khoob nist.',p:'ha-VA garm-e · ha-VA sard-e · ha-VA KHOOB nist',e:"It's hot. · It's cold. · The weather isn't good."}},
      {title:'"Baroon miyad" — rain is coming',body:'Weather events like rain and snow use "miyad" (is coming / comes). This is the third person singular of "miyam" (to come). Very natural in speech.',ex:{f:'Baroon miyad. · Barf miyad.',p:'ba-ROON mi-YAD · barf mi-YAD',e:"It's raining. (lit: rain is coming) · It's snowing."}},
      {title:'Seasons of the year',body:'The four seasons follow a logical pattern. Spring = Bahar, Summer = Tabestan, Autumn = Paeez, Winter = Zemestoon.',ex:{f:'Bahar · Tabestan · Paeez · Zemestoon',p:'ba-HAR · ta-bes-TAN · pa-EEZ · ze-mes-TOON',e:'Spring · Summer · Autumn · Winter'}},

      {cat:'Weather',f:'Hava sard-e.',p:'ha-VA sard-e',e:"It's cold."},

  19:{
    grammar:[
      {title:'Past tense — the complete system',body:'Past tense: drop "mi-", use the PAST ROOT + personal endings (-am, -i, nothing, -im, -id, -and). The past root is usually found by dropping "-an" from the infinitive.',ex:{f:'Raftan → raft- · Khordan → khord- · Goftan → goft-',p:'raf-TAN → raft · khor-DAN → khord · gof-TAN → goft',e:'To go → went · To eat → ate · To say → said'}},
      {title:'Third person singular past — no ending',body:'When "he/she/it" is the subject in past tense, NO ending is added. Just the bare past root. This is one of the most common forms you will hear.',ex:{f:'Raft. · Khord. · Goft. · Bood.',p:'raft · khord · goft · bood',e:'He/She went. · He/She ate. · He/She said. · He/She was.'}},
      {title:'Negating the past — "na-" before the root',body:'To negate past tense, add "na-" directly before the past root. No "mi-" is involved.',ex:{f:'Naraftam. · Nakhordim. · Nagoft.',p:'na-raf-TAM · na-khor-DIM · na-goft',e:"I didn't go. · We didn't eat. · He/She didn't say."}},
    ],
    phrases:[
      {cat:'Past',f:'Raftam.',p:'raf-TAM',e:'I went.'},
      {cat:'Past',f:'Khordam.',p:'khor-DAM',e:'I ate.'},

  20:{
    grammar:[
      {title:'Emotions as adjectives — combine with "hastam"',body:'Emotion words in Farsi are adjectives. Combine them with "hastam" (I am) to express your emotional state. Negate with "nistam".',ex:{f:'Man khoshhaal hastam. · Naarahat nistam.',p:'man khosh-HAAL HAS-tam · naa-ra-HAT nis-TAM',e:"I am happy. · I am not sad."}},
      {title:'Becoming an emotion — "shodan"',body:'To express a change of emotional state, use "shodam" (I became). "Khoshhaal shodam" = I became happy / I got happy.',ex:{f:'Khoshhaal shodam. · Naarahat shodam.',p:'khosh-HAAL sho-DAM · naa-ra-HAT sho-DAM',e:'I got happy. · I got sad/upset.'}},
      {title:'"Del-tang" — Farsi\'s most poetic emotion',body:'"Del-tang" literally means "tight heart." It describes homesickness, missing someone, or a deep sense of longing. There is no single English equivalent — it is somewhere between "I miss you" and "my heart aches for you."',ex:{f:'Del-tangat hastam. · Del-tang-e khaane-am hastam.',p:'del-TANG-at HAS-tam · del-TANG-e KHAA-ne-am HAS-tam',e:'I miss you. · I am homesick. (lit: my heart is tight for my home)'}},
    ],
    phrases:[
      {cat:'Happy',f:'Khoshhaal hastam.',p:'khosh-HAAL HAS-tam',e:'I am happy.'},
      {cat:'Sad',f:'Naarahat hastam.',p:'naa-ra-HAT HAS-tam',e:'I am sad/upset.'},
      {cat:'Tired',f:'Khaaste hastam.',p:'KHAAS-te HAS-tam',e:'I am tired.'},
      {cat:'Angry',f:'Asabani hastam.',p:'a-sa-BA-ni HAS-tam',e:'I am angry.'},
      {cat:'Scared',f:'Mitarsam.',p:'mi-TAR-sam',e:'I am scared. / I am afraid.',note:'"Mitarsam" = I fear (verb form)'},

  21:{

      {title:'Emotion + state vocabulary expanding',body:'You can now express complex states: physical (dard, mariz), emotional (khoshhaal, del-tang), and relational (family terms with possession suffixes).',ex:{f:'Khaaste va del-tang hastam vali khoshhaal-am.',p:'KHAAS-te va del-TANG HAS-tam va-LI khosh-HAAL-am',e:"I am tired and homesick but I am happy."}},

  22:{
    grammar:[
      {title:'Restaurant vocabulary — key verbs',body:'"Sefaresh dadan" = to place an order. "Hesaab khastan" = to ask for the bill. Both follow SOV: "Man sefaresh midaham" = I am placing an order.',ex:{f:'Man sefaresh midaham. · Hesaab lotfan.',p:'man se-FA-resh mi-DA-ham · he-SAAB LOT-fan',e:'I am ordering. · The bill please.'}},
      {title:'"Noshi jaan" and food culture',body:'"Noshi jaan" is said when someone starts eating — like "bon appétit." Responding with "mamnoon" is polite. Iranian hospitality means you will often be offered more food than you can eat — "seer shodam" (I am full) is essential.',ex:{f:'Noshi jaan! · Seer shodam, mamnoon.',p:'noo-SHI jaan · seer sho-DAM, mam-NOON',e:"Enjoy your meal! · I'm full, thank you."}},
    ],
    phrases:[
      {cat:'Ordering',f:'Menoo darid?',p:'me-NOO da-RID?',e:'Do you have a menu?'},
      {cat:'Ordering',f:'Man ___ mikhaham.',p:'man ___ mi-KHAA-ham',e:'I would like ___.'},
      {cat:'Ordering',f:'Sefaresh midaham.',p:'se-FA-resh mi-DA-ham',e:'I am ordering.'},
      {cat:'Bill',f:'Hesaab lotfan.',p:'he-SAAB LOT-fan',e:'The bill please.'},
      {cat:'Bill',f:'Hesaab chand-e?',p:'he-SAAB CHAN-de?',e:'How much is the bill?'},
      {cat:'Mealtime',f:'Noshi jaan!',p:'noo-SHI jaan',e:'Enjoy your meal!'},
      {cat:'Fullness',f:'Seer shodam.',p:'seer sho-DAM',e:"I'm full."},
      {cat:'Compliment',f:'Ghaza kheyli khosh-mazeh bood.',p:'gha-ZAA KHEY-li khosh-MA-ze bood',e:'The food was very delicious.'},
      {cat:'Asking',f:'Mikhori?',p:'mi-KHO-ri?',e:'Do you want to eat? / Are you eating?'},
      {cat:'Asking',f:'Chi darin?',p:'chi da-RIN?',e:'What do you have?',note:'Asking what food is available'},

  23:{
    grammar:[
      {title:'Transport vocabulary — getting around',body:'"Savaar shodan" = to board/get on. "Piadeh shodan" = to get off. These are used with all transport: taxi, bus, train, plane.',ex:{f:'Taksi savaar shodam. · Istgaah piadeh shodam.',p:'tak-SI sa-VAAR sho-DAM · ist-GAAH pi-AA-de sho-DAM',e:'I got in a taxi. · I got off at the station.'}},
      {title:'Buying tickets — key phrases',body:'At any ticket window, you need three things: destination, quantity, and price. Use "mikhaham" + destination + "bilit".',ex:{f:'Yek bilit-e Tehran mikhaham.',p:'yek bi-LIT-e teh-RAN mi-KHAA-ham',e:'I want one ticket to Tehran.'}},
      {title:'"Kharooj" and "Voroodi" — exit and entrance',body:'These two words are on every sign in airports, stations, and buildings. "Kharooj" = exit/departure. "Voroodi" = entrance/arrival.',ex:{f:'Kharooj koja-st? · Voroodi koja-st?',p:'kha-ROOJ ko-JA-st? · vo-ROO-di ko-JA-st?',e:'Where is the exit? · Where is the entrance?'}},
    ],
    phrases:[
      {cat:'Transport',f:'Taksi mikhaham.',p:'tak-SI mi-KHAA-ham',e:'I want a taxi.'},

      {cat:'Tickets',f:'Yek bilit-e ___ mikhaham.',p:'yek bi-LIT-e ___ mi-KHAA-ham',e:'I want one ticket to ___.'},

      {cat:'Station',f:'Istgaah kojast?',p:'ist-GAAH ko-JAST?',e:'Where is the station?'},
      {cat:'Navigation',f:'Kharooj kojast?',p:'kha-ROOJ ko-JAST?',e:'Where is the exit?'},
