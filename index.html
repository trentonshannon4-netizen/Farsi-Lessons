  24:{
    grammar:[
      {title:'Formal future tense — "khaham" + past root',body:'The formal future uses "khaham/khahi/khahad..." (conjugated "to want") + the past root of the main verb. This is the literary future tense.',ex:{f:'Man khaham raft. · Oo khahand khord.',p:'man KHAA-ham raft · oo KHAA-hand khord',e:'I will go. · They will eat.'}},
      {title:'Informal future — present tense + time word',body:'In everyday speech, Iranians use the present tense with a future time word. This is far more common than the formal future in conversation.',ex:{f:'Farda miravam. · Zood miaaym.',p:'far-DA mi-RA-vam · zood mi-AA-yam',e:"I'm going tomorrow. · I'm coming soon."}},
      {title:'"Inshallah" — the universal hope word',body:'"Inshallah" (God willing) is used for hopes, promises, plans, and polite uncertainty. Iranians use it constantly — for genuine hope and also as a polite way to say "maybe."',ex:{f:'Inshallah miaaym. · Inshallah khoob mishe.',p:'in-sha-LAAH mi-AA-yam · in-sha-LAAH KHOOB mi-SHE',e:"I'll come, God willing. · It will get better, hopefully."}},

    phrases:[
      {cat:'Future',f:'Farda miravam.',p:'far-DA mi-RA-vam',e:"I'm going tomorrow."},
      {cat:'Future',f:'Zood miaaym.',p:'zood mi-AA-yam',e:"I'll come soon."},
      {cat:'Future',f:'Baadan mikonam.',p:'ba-DAN mi-KO-nam',e:"I'll do it later."},
      {cat:'Formal future',f:'Khaham raft.',p:'KHAA-ham raft',e:'I will go. (formal)'},
      {cat:'Hope',f:'Inshallah.',p:'in-sha-LAAH',e:'God willing / Hopefully'},
      {cat:'Hope',f:'Inshallah khoob mishe.',p:'in-sha-LAAH KHOOB mi-SHE',e:'Hopefully it will get better.'},
      {cat:'Planning',f:'Mikhaam ___ bokonam.',p:'mi-KHAAM ___ bo-KO-nam',e:'I want to do ___.'},
      {cat:'Planning',f:'Mikhahim beriim.',p:'mi-KHAA-him be-RIM',e:"We want to go. / Let's go."},

        {spk:'You',f:'Kheyli mamnoon. Del-tangeton khaaham shod.',p:'KHEY-li mam-NOON. del-TANG-e-TOON KHAA-ham shod',e:'Thank you so much. I will miss you all.'},

  25:{
    grammar:[
      {title:'Colours with ezafe — describing objects by colour',body:'Colours follow the same ezafe rule as all adjectives: noun + "-e" + colour. The colour always comes after the noun.',ex:{f:'Mashine-e aabi · Ketaab-e sefid · Khaane-e sabz',p:'maa-SHEEN-e aa-BI · ke-TAAB-e se-FID · KHAA-ne-e sabz',e:'Blue car · White book · Green house'}},
      {title:'Asking about colour — "che rang-i?"',body:'"Rang" = colour. "Che rang-i?" = what colour is it? A very natural question when shopping.',ex:{f:'In che rang-i-e? · Oon che rang-i-e?',p:'in che RANG-i-e? · oon che RANG-i-e?',e:'What colour is this? · What colour is that?'}},
      {title:'Colour preferences',body:'Use "doost daaram" with colours to express preferences. Remember "doost daaram" works for liking things as well as people.',ex:{f:'Aabi doost daaram. · Siyaah doost nadaaram.',p:'aa-BI doost DAA-ram · si-YAAH doost na-DAA-ram',e:"I like blue. · I don't like black."}},

      {cat:'Colours',f:'Sefid · Siyaah · Naaranji · Sormaei',p:'se-FID · si-YAAH · naa-RAN-ji · sor-ma-EI',e:'White · Black · Orange · Purple/Navy'},
      {cat:'Describing',f:'Mashine-e aabi',p:'maa-SHEEN-e aa-BI',e:'Blue car'},

  26:{
    grammar:[
      {title:'Connectors — joining sentences naturally',body:'"Va" (and), "vali/amma" (but), "choon" (because), "pas" (so/therefore), "yaa" (or), "age" (if). These sit between two clauses. The verb still comes last in each clause.',ex:{f:'Man khaaste hastam choon kheyli kaaf kardam.',p:'man KHAAS-te HAS-tam choon KHEY-li kaaf kar-DAM',e:"I'm tired because I worked a lot."}},
      {title:'"Age" — if clauses (conditionals)',body:'"Age" introduces a condition. The result clause follows. Both clauses keep SOV order.',ex:{f:'Age biayi, khoshhaal misham.',p:'a-GE bi-AY-i, khosh-HAAL mi-SHAM',e:"If you come, I'll be happy."}},
      {title:'"Pas" — therefore and conclusion',body:'"Pas" draws a conclusion from what was just said. It sits at the start of the result clause, like "so" or "therefore" in English.',ex:{f:'Hava bad-e, pas nemiram.',p:'ha-VA bad-e, pas ne-mi-RAM',e:"The weather is bad, so I'm not going."}},
    ],
    phrases:[
      {cat:'And',f:'___ va ___',p:'___ va ___',e:'___ and ___'},
      {cat:'But',f:'___ vali ___',p:'___ va-LI ___',e:'___ but ___'},
      {cat:'Because',f:'___ choon ___',p:'___ choon ___',e:'___ because ___'},
      {cat:'So',f:'___ pas ___',p:'___ pas ___',e:'___ so/therefore ___'},
      {cat:'Or',f:'___ yaa ___',p:'___ yaa ___',e:'___ or ___'},
      {cat:'If',f:'Age ___, ___.',p:'a-GE ___',e:'If ___, ___.'},
      {cat:'Example',f:'Mikhaam chai yaa aab?',p:'mi-KHAAM chay yaa aab?',e:'Do I want tea or water?'},
      {cat:'Example',f:'Khaaste-am pas miram khaane.',p:'KHAAS-te-am pas mi-RAM KHAA-ne',e:"I'm tired so I'm going home."},
      {cat:'Example',f:'Age vaght daari, biaay.',p:'a-GE vaght DAA-ri, bi-AAY',e:'If you have time, come.'},
      {cat:'Example',f:'Mikhaaham beram vali pul nadaaram.',p:'mi-KHAA-ham be-RAM va-LI pool na-DAA-ram',e:"I want to go but I don't have money."},

  27:{
    grammar:[
      {title:'Formal register — key differences from informal',body:'Formal Farsi uses "Shoma" instead of "To", verb endings "-id" instead of "-i", and richer vocabulary. Titles like "Agha" (Mr.) and "Khanoom" (Ms.) go before names.',ex:{f:'Agha-ye Ahmadi chetoorid? · Khanoom-e Karimi lotfan.',p:'aa-GHAA-ye ah-MA-di che-TOO-rid? · kha-NOOM-e ka-ri-MI LOT-fan',e:'Mr. Ahmadi how are you? · Ms. Karimi please.'}},
      {title:'"Baa ejaze" — the polite exit phrase',body:'"Baa ejaze" literally means "with your permission." It is used when leaving a room, ending a conversation, or needing to pass someone. Essential in formal settings.',ex:{f:'Baa ejaze, miram. · Baa ejaze, bebakhshid.',p:'baa e-JA-ze, mi-RAM · baa e-JA-ze, be-BAKH-shid',e:'With your permission, I am leaving. · With your permission, excuse me.'}},
      {title:'"Moteshakeram" vs "Mamnoon"',body:'"Moteshakeram" is the formal, elevated way to say thank you. Use it with elders, officials, and in professional settings. "Mamnoon" is standard. "Mersi" is the most casual.',ex:{f:'Moteshakeram · Mamnoon · Mersi',p:'mo-te-SHA-ke-ram · mam-NOON · mer-SEE',e:'Thank you (formal) · Thank you (standard) · Thanks (casual)'}},
    ],
    phrases:[
      {cat:'Formal title',f:'Agha-ye ___',p:'aa-GHAA-ye ___',e:'Mr. ___'},
      {cat:'Formal title',f:'Khanoom-e ___',p:'kha-NOOM-e ___',e:'Ms./Mrs. ___'},
      {cat:'Formal greeting',f:'Chetoorid?',p:'che-TOO-rid?',e:'How are you? (formal)'},
      {cat:'Formal thanks',f:'Moteshakeram.',p:'mo-te-SHA-ke-ram',e:'Thank you (formal).'},
      {cat:'Formal request',f:'Khahesh mikonam.',p:'KHAA-hesh mi-KO-nam',e:'Please / You are welcome (formal)'},
      {cat:'Polite exit',f:'Baa ejaze.',p:'baa e-JA-ze',e:'With your permission. (polite exit)'},
      {cat:'Polite exit',f:'Baa ejaze, miram.',p:'baa e-JA-ze, mi-RAM',e:'With your permission, I am going.'},
      {cat:'Formal yes',f:'Bale, chashm.',p:'BA-le, chashm',e:'Yes, of course.',note:'"Chashm" = eye = of course (very respectful)'},
      {cat:'Apology',f:'Bebakhshid, mozaahem shodam.',p:'be-BAKH-shid, mo-ZA-hem sho-DAM',e:'I am sorry for disturbing you.',note:'"Mozaahem shodam" = I became a bother'},
    ],
    convos:[{
      title:'A formal meeting',scene:'Meeting an elder professor at a university',
      exchanges:[
        {spk:'You',f:'Salam. Bebakhshid, Ostad-e Ahmadi shoma hastid?',p:'sa-LAM. be-BAKH-shid, os-TAD-e ah-MA-di sho-MA HAS-tid?',e:'Hello. Excuse me, are you Professor Ahmadi?',note:'"Ostad" = professor/master'},
        {spk:'Prof',f:'Bale, man hastam. Shoma?',p:'BA-le, man HAS-tam. sho-MA?',e:'Yes I am. And you?'},
        {spk:'You',f:'Esm-e man Trent-e. Moteshakeram ke vaght darid.',p:'es-ME man trent-e. mo-te-SHA-ke-ram ke vaght da-RID',e:'My name is Trent. Thank you for having time.'},
        {spk:'Prof',f:'Khahesh mikonam. Befarmaid beneshinin.',p:'KHAA-hesh mi-KO-nam. be-far-MAID be-ne-SHI-nin',e:"You're welcome. Please sit down.",note:'"Beneshinin" = sit down (formal command)'},
        {spk:'You',f:'Mamnoon. Baa ejaze, yek sooaal daaram.',p:'mam-NOON. baa e-JA-ze, yek soo-AAL DAA-ram',e:'Thank you. With your permission, I have one question.',note:'"Sooaal" = question'},
        {spk:'Prof',f:'Bale, bafarmaid.',p:'BA-le, ba-far-MAID',e:'Yes, go ahead. (lit: please proceed)'},
      ]
    }],
    verbs:[],

  28:{
    grammar:[
      {title:'"Che khabar?" — casual conversation openers',body:'"Che khabar?" (what news? / what\'s up?) is the most common casual follow-up after "Halet chetoor-e?" It invites the other person to share what is new.',ex:{f:'Salam! Chetori? Che khabar?',p:'sa-LAM! che-TO-ri? che kha-BAR?',e:"Hi! How are you? What's new?"}},
      {title:'Responding to "Che khabar?" — common replies',body:'The standard reply is "Hich, mamnoon" (nothing, thanks) or "Khoob-e, mamnoon" (good, thanks). You can then flip the question back.',ex:{f:'Hich, mamnoon. To chetori? · Khoob-e. Che khabar az to?',p:'hich, mam-NOON. to che-TO-ri? · KHOOB-e. che kha-BAR az to?',e:"Nothing, thanks. How are you? · Good. What's new with you?"}},
      {title:'"Boro be salamat" — the parting blessing',body:'"Boro be salamat" (go in peace/safety) is a warm farewell, especially when someone is setting off on a journey or leaving after a visit.',ex:{f:'Boro be salamat! · Khodahafez. Boro be salamat.',p:'bo-RO be sa-LA-mat · kho-da-HA-fez. bo-RO be sa-LA-mat',e:'Go in peace! · Goodbye. Go safely.'}},
    ],
    phrases:[
      {cat:'Opening',f:'Che khabar?',p:'che kha-BAR?',e:"What's up? / What's new?"},
      {cat:'Opening',f:'Chetori? Khooshi?',p:'che-TO-ri? KHOO-shi?',e:'How are you? Are you well?'},
      {cat:'Reply',f:'Hich, mamnoon.',p:'hich, mam-NOON',e:'Nothing much, thanks.'},
      {cat:'Reply',f:'Khoob-am, mamnoon. To chi?',p:'KHOO-bam, mam-NOON. to chi?',e:"I'm good, thanks. And you?"},
      {cat:'Farewell',f:'Boro be salamat!',p:'bo-RO be sa-LA-mat!',e:'Go in peace / Go safely!'},
      {cat:'Farewell',f:'Movafagh baashi!',p:'mo-VAF-fagh baa-SHI!',e:'Good luck! / May you succeed!'},
      {cat:'Farewell',f:'Khodahafez. Moraaqeb khoodet baash.',p:'kho-da-HA-fez. mo-RAA-gheb KHOO-det baash',e:'Goodbye. Take care of yourself.'},
      {cat:'Surprise',f:'Vaay! Dorost-e?',p:'vaay! do-ROST-e?',e:'Wow! Really? / Is that right?'},
      {cat:'Agreement',f:'Aareh, dorost-e.',p:'AA-re, do-ROST-e',e:'Yes, that\'s right.'},
      {cat:'Disagreement',f:'Na, dorost nist.',p:'na, do-ROST nist',e:"No, that's not right."},
    ],
    convos:[{
      title:'Bumping into a friend unexpectedly',scene:'Running into someone you know at a coffee shop',
      exchanges:[
        {spk:'Friend',f:'Vaay! Trent! Chetori? Injaa chi mikooni?',p:'vaay! trent! che-TO-ri? in-JAA chi mi-KO-ni?',e:'Wow! Trent! How are you? What are you doing here?'},
        {spk:'You',f:'Salam! Khoobam, mamnoon. Chai mikhooram. To chetori?',p:'sa-LAM! KHOO-bam, mam-NOON. chay mi-KHOO-ram. to che-TO-ri?',e:"Hi! I'm good, thanks. I'm drinking tea. How about you?"},
        {spk:'Friend',f:'Khoobam. Che khabar? Hanooz Farsi yad migiiri?',p:'KHOO-bam. che kha-BAR? ha-NOOZ far-SI yad mi-GI-ri?',e:"I'm good. What's new? Are you still learning Farsi?"},
        {spk:'You',f:'Aareh! Har rooz yad migiram. Kheyli khoob-e.',p:'AA-re! har rooz yad mi-GI-ram. KHEY-li KHOOB-e',e:"Yes! I learn every day. It's really good.",note:'"Har rooz" = every day'},
        {spk:'Friend',f:'Afarin! Farsi-et kheyli khoob shode!',p:'a-fa-RIN! far-SI-et KHEY-li KHOOB sho-DE!',e:'Bravo! Your Farsi has gotten really good!'},
        {spk:'You',f:'Mamnoon! Baa ejaze, miram. Movafagh baashi!',p:'mam-NOON! baa e-JA-ze, mi-RAM. mo-VAF-fagh baa-SHI!',e:'Thank you! With your permission, I am going. Good luck!'},
        {spk:'Friend',f:'Boro be salamat! Khodahafez Trent.',p:'bo-RO be sa-LA-mat! kho-da-HA-fez trent',e:'Go in peace! Goodbye Trent.'},
      ]
    }],
    verbs:[],
  },
  29:{
    grammar:[
      {title:'Idioms — meaning beyond the words',body:'Persian idioms often cannot be translated literally. "Dast-et dard nakone" literally means "may your hand not hurt" but means "thank you for your effort." Understanding the literal meaning helps you remember the idiom.',ex:{f:'Dast-et dard nakone · Del-am tang shodeh · Bezan be chak',p:'das-TET dard na-KO-ne · de-LAM tang sho-DE · be-ZAN be chak',e:"Thank you for your effort · I'm homesick/I miss you · Let's go / Hit the road"}},
      {title:'"Ghorboonet beram" — intense affection',body:'Literally "I would sacrifice myself for you" — this is one of the most intense expressions of love and affection in Persian. Used freely with children, close family, and dear friends. Do not use with strangers.',ex:{f:'Ghorboonet beram, pesaram!',p:'ghor-BOO-nat be-RAM, pe-SAR-am!',e:'I love you so much, my son! (lit: I would sacrifice myself for you)'}},
      {title:'"Chashm" — the ultimate yes',body:'"Chashm" literally means "eye." Used as a response to a request it means "of course / your wish is my command." It conveys deep respect and willingness.',ex:{f:'Chai miaarid? — Chashm.',p:'chay mi-AA-rid? — chashm',e:'Will you bring tea? — Of course. (lit: eye)'}},
    ],
    phrases:[
      {cat:'Gratitude',f:'Dast-et dard nakone.',p:'das-TET dard na-KO-ne',e:'Thank you for your help/effort.',note:'Lit: "May your hand not hurt" — said to anyone who helped'},
      {cat:'Affection',f:'Ghorboonet beram.',p:'ghor-BOO-nat be-RAM',e:'I love you so much.',note:'Lit: "I would sacrifice myself for you" — very intense'},
      {cat:'Agreement',f:'Chashm.',p:'chashm',e:'Of course / Your wish is my command.',note:'Lit: "eye" — deeply respectful'},
      {cat:'Longing',f:'Del-am tang shodeh.',p:'de-LAM tang sho-DE',e:'I miss (you/home). My heart aches.',note:'Lit: "My heart has tightened"'},
      {cat:'Let\'s go',f:'Bezan be chak!',p:'be-ZAN be chak!',e:"Let's go! / Hit the road!",note:'Colourful slang for "let\'s get moving"'},
      {cat:'Surprise',f:'Mashallah!',p:'ma-sha-LAAH!',e:'How wonderful! / God has willed it.',note:'Said in admiration — protects from evil eye'},
      {cat:'Encouragement',f:'Afarin!',p:'a-fa-RIN!',e:'Bravo! / Well done!'},
      {cat:'Blessing',f:'Elahi shokr.',p:'e-LA-hi shokr',e:'Thank God. / I am grateful to God.',note:'Said after good news or a meal'},
    ],
    convos:[{
      title:'Using idioms naturally',scene:'Saying a heartfelt goodbye to your host family',
      exchanges:[
        {spk:'Host Mum',f:'Ghorboonet beram Trent! Kheyli del-tamoon tang mishe.',p:'ghor-BOO-nat be-RAM trent! KHEY-li del-ta-MOON tang mi-SHE',e:'We love you so much Trent! We will miss you so much.'},
        {spk:'You',f:'Mano ham! Del-am tang mishe. Kheyli khoob boodid.',p:'ma-NO ham! de-LAM tang mi-SHE. KHEY-li KHOOB boo-DID',e:'Me too! I will miss you. You were very kind.'},
        {spk:'Host Dad',f:'Dast-et dard nakone. Farsi-et aalee shode.',p:'das-TET dard na-KO-ne. far-SI-et aa-LEE sho-DE',e:'Well done. Your Farsi has become excellent.',note:'"Aalee" = excellent/great'},
        {spk:'You',f:'Mamnoon. Chashm, Inshallah dobareh miaaym.',p:'mam-NOON. chashm, in-sha-LAAH do-BA-re mi-AA-yam',e:'Thank you. Of course, God willing I will come again.'},
        {spk:'Host Mum',f:'Mashallah! Boro be salamat azizam.',p:'ma-sha-LAAH! bo-RO be sa-LA-mat a-ZI-zam',e:'Wonderful! Go in peace my dear.',note:'"Azizam" = my dear'},
        {spk:'You',f:'Elahi shokr. Khodahafez. Doostetoon daaram.',p:'e-LA-hi shokr. kho-da-HA-fez. doos-te-TOON DAA-ram',e:'Thank God. Goodbye. I love you all.'},
      ]
    }],
    verbs:[],
  },
  30:{
    grammar:[
      {title:'30-Day recap — you now have a complete foundation',body:'You can greet, introduce yourself, express needs and emotions, describe things, navigate, shop, eat, talk about time (past/present/future), use connectors, and hold real conversations. This is more than most people achieve in months.',ex:{f:'Man Farsi yad gereftam va kheyli khoshhaal hastam!',p:'man far-SI yad ge-ref-TAM va KHEY-li khosh-HAAL HAS-tam!',e:'I have learned Farsi and I am very happy!'}},
      {title:'What comes next — continuing beyond 30 days',body:'The next step is spaced repetition of everything you have learned, plus expanding vocabulary in areas that matter to you (travel, food, culture, work). The structures you know can carry thousands of words.',ex:{f:'Har rooz kam-kam pishraft mikonam.',p:'har rooz kam-KAM pish-RAFT mi-KO-nam',e:'Every day I make gradual progress.',note:'"Pishraft" = progress'}},
    ],
    phrases:[
      {cat:'Achievement',f:'Mobarak baad!',p:'mo-BA-rak baad!',e:'Congratulations!'},
      {cat:'Achievement',f:'Afarin! Aalee-e!',p:'a-fa-RIN! aa-LEE-e!',e:'Bravo! Excellent!'},
      {cat:'Gratitude',f:'Az in ke oomadi mamnoon.',p:'az in ke oo-MA-di mam-NOON',e:'Thank you for coming.'},
      {cat:'Love',f:'Dooset daaram.',p:'DOOS-et DAA-ram',e:'I love you / I like you.'},
      {cat:'Goodbye',f:'Movafagh baashi!',p:'mo-VAF-fagh baa-SHI!',e:'Good luck! May you succeed!'},
      {cat:'Blessing',f:'Elahi shokr.',p:'e-LA-hi shokr',e:'Thank God. I am grateful.'},
      {cat:'Progress',f:'Har rooz behtar misham.',p:'har rooz beh-TAR mi-SHAM',e:'Every day I get better.'},
      {cat:'Commitment',f:'Farsi yad migiram.',p:'far-SI yad mi-GI-ram',e:'I am learning Farsi.',note:'Say this with confidence — you are doing it!'},
    ],
    convos:[{
      title:'A conversation using everything you know',scene:'Talking to a new Iranian friend who does not speak English',

        {spk:'You',f:'Si rooz. Har rooz yad migiram. Kheyli doost daaram.',p:'si rooz. har rooz yad mi-GI-ram. KHEY-li doost DAA-ram',e:'Thirty days. I learn every day. I love it very much.'},
        {spk:'Stranger',f:'Mashallah! Farsi-et kheyli khoob-e. Movafagh baashi!',p:'ma-sha-LAAH! far-SI-et KHEY-li KHOOB-e. mo-VAF-fagh baa-SHI!',e:'Wonderful! Your Farsi is very good. Good luck!'},
        {spk:'You',f:'Kheyli mamnoon! Dast-et dard nakone. Boro be salamat!',p:'KHEY-li mam-NOON! das-TET dard na-KO-ne. bo-RO be sa-LA-mat!',e:'Thank you so much! Thank you for your kindness. Go in peace!'},

  31:{
    grammar:[
      {title:'Medical complaints — "dard daaram" vs "tab daaram"',body:'"Dard daaram" = I have pain (body part first). "Tab daaram" = I have a fever. These two patterns cover most doctor visits.',ex:{f:'Sar dard daaram. Tab daaram.',p:'sar dard DAA-ram. tab DAA-ram',e:'I have a headache. I have a fever.'}},
      {title:'"Behtar" and "Badtar" — comparatives with shodan',body:'Combine "behtar/badtar" with "shodan" (to become) to describe change of state.',ex:{f:'Behtar shodam. Badtar shodam.',p:'beh-TAR sho-DAM. bad-TAR sho-DAM',e:'I got better. I got worse.'}},
    ],
    phrases:[
      {cat:'Symptoms',f:'Tab daaram.',p:'tab DAA-ram',e:'I have a fever.'},
      {cat:'Symptoms',f:'Sar dard daaram.',p:'sar dard DAA-ram',e:'I have a headache.'},
      {cat:'Symptoms',f:'Haal-am khoob nist.',p:'haa-LAM KHOOB nist',e:'I am not feeling well.'},
      {cat:'Need',f:'Dava lazem daaram.',p:'da-VA LA-zem DAA-ram',e:'I need medicine.'},
      {cat:'Need',f:'Doktor lazem daaram.',p:'dok-TOR LA-zem DAA-ram',e:'I need a doctor.'},
      {cat:'Location',f:'Bimarestan kojast?',p:'bi-mar-ES-tan ko-JAST?',e:'Where is the hospital?'},
      {cat:'Progress',f:'Behtar shodam.',p:'beh-TAR sho-DAM',e:'I got better.'},
      {cat:'Progress',f:'Kheyli behtar-am.',p:'KHEY-li beh-TAR-am',e:'I am much better.'},
      {cat:'Asking',f:'Koja dard daari?',p:'ko-JA dard DAA-ri?',e:'Where does it hurt?'},
      {cat:'Asking',f:'Halet chetoor-e?',p:'HA-let che-TOOR-e?',e:'How are you feeling?'},
    ],
    convos:[{
      title:'Visiting a doctor',scene:'At a clinic in Tehran feeling unwell',
      exchanges:[
        {spk:'You',f:'Salam. Haal-am khoob nist.',p:'sa-LAM. haa-LAM KHOOB nist',e:'Hello. I am not feeling well.'},
        {spk:'Doctor',f:'Bebakhshid. Che dardi darid?',p:'be-BAKH-shid. che dar-DI da-RID?',e:'I am sorry. What pain do you have?'},
        {spk:'You',f:'Tab daaram va sar dard daaram.',p:'tab DAA-ram va sar dard DAA-ram',e:'I have a fever and a headache.'},

      ]
    }],
    verbs:[],
  },
  32:{
    grammar:[
      {title:'Telling time — the structure',body:'"Saat-e [number]" = it is [number] o\'clock. Add "o nim" for half past. Add "o rob" for quarter past. "Rob be [number]" = quarter to.',ex:{f:'Saat-e se. Saat-e se o nim. Rob be chahar.',p:'saa-AT-e se · saa-AT-e se o nim · rob be cha-HAR',e:'It is 3:00. It is 3:30. It is quarter to 4.'}},
      {title:'Asking and answering time questions',body:'"Saat chand-e?" = what time is it? Answer with "Saat-e [number]-e." The final "-e" confirms the statement.',ex:{f:'Saat chand-e? — Saat-e hasht-e.',p:'saa-AT CHAN-de? — saa-AT-e hasht-e',e:'What time is it? — It is 8 o\'clock.'}},
    ],
    phrases:[
      {cat:'Asking',f:'Saat chand-e?',p:'saa-AT CHAN-de?',e:'What time is it?'},
      {cat:'Telling',f:'Saat-e [number]-e.',p:'saa-AT-e ___ -e',e:'It is [number] o\'clock.'},
      {cat:'Half past',f:'Saat-e do o nim.',p:'saa-AT-e do o nim',e:'It is 2:30.'},
      {cat:'Quarter past',f:'Saat-e se o rob.',p:'saa-AT-e se o rob',e:'It is 3:15.'},
      {cat:'Quarter to',f:'Rob be panj.',p:'rob be panj',e:'It is quarter to 5 (4:45).'},
      {cat:'Morning',f:'Saat-e haft-e sobh.',p:'saa-AT-e haft-e sobh',e:'It is 7 in the morning.'},
      {cat:'Afternoon',f:'Saat-e do-ye baad az zohr.',p:'saa-AT-e do-ye baad az zohr',e:'It is 2 in the afternoon.'},
      {cat:'Asking',f:'Saat chand miaayi?',p:'saa-AT chand mi-AY-i?',e:'What time are you coming?'},
      {cat:'Arriving',f:'Saat-e noh miaaym.',p:'saa-AT-e noh mi-AA-yam',e:'I am coming at 9 o\'clock.'},
      {cat:'Duration',f:'Yek saat.',p:'yek saa-AT',e:'One hour.',note:'"Yek saat taul keshid" = it took one hour.'},
    ],
    convos:[{
      title:'Making a plan with a time',scene:'Arranging to meet a friend',
      exchanges:[
        {spk:'Friend',f:'Farda miaayi? Saat chand?',p:'far-DA mi-AY-i? saa-AT chand?',e:'Are you coming tomorrow? What time?'},
        {spk:'You',f:'Bale, saat-e do baad az zohr.',p:'BA-le, saa-AT-e do baad az zohr',e:'Yes, at 2 in the afternoon.'},
        {spk:'Friend',f:'Khoob-e. Man saat-e yek o nim hast-am inja.',p:'KHOOB-e. man saa-AT-e yek o nim HAS-tam in-JA',e:'Good. I will be here at 1:30.'},

  41:{
    grammar:[
      {title:'Ta\'arof — the linguistics of Persian politeness',body:'Ta\'arof involves ritual offers and declines. When offered something, declining once or twice is expected. The host insists — you accept on the third offer. Understanding this prevents cultural misunderstanding.',ex:{f:'Chai mikhahed? — Na mamnoon. — Lotfan befarmaid. — Chashm, mamnoon.',p:'chay mi-KHA-hed? — na mam-NOON. — LOT-fan be-far-MAID. — chashm, mam-NOON',e:'Would you like tea? — No thank you. — Please do. — Of course, thank you.'}},
      {title:'"Norooz mobarak" — New Year greetings',body:'"Norooz mobarak" = Happy New Year. "Eid-e shoma mobarak" is the formal version. Said during the 13-day Norooz celebration period.',ex:{f:'Norooz mobarak! Saal-e no mobarak!',p:'no-ROOZ mo-BAA-rak! saa-LE no mo-BAA-rak!',e:'Happy New Year! Happy New Year!'}},

  44:{

  49:{
    grammar:[
      {title:'Talking about language learning progress',body:'Use past tense + "pishraft" to describe progress. Use "hanooz" (still/yet) for ongoing processes.',ex:{f:'Kheyli pishraft kardam. Hanooz yad migiram.',p:'KHEY-li pish-RAFT kar-DAM. ha-NOOZ yad mi-GI-ram',e:'I have made a lot of progress. I am still learning.'}},
      {title:'"Vaqti ke" + past = when I...',body:'Use "vaqti ke" + past tense to describe learning experiences.',ex:{f:'Vaqti ke avval oomad-am, hich nemidoonestam.',p:'vaght-I ke av-VAL oo-MA-dam, hich ne-mi-DOO-nes-tam',e:'When I first came, I knew nothing.'}},
    ],
    phrases:[
      {cat:'Progress',f:'Kheyli pishraft kardam.',p:'KHEY-li pish-RAFT kar-DAM',e:'I have made a lot of progress.'},
      {cat:'Progress',f:'Har rooz behtar misham.',p:'har rooz beh-TAR mi-SHAM',e:'I get better every day.'},
      {cat:'Difficulty',f:'In baram moshkele.',p:'in ba-RAM mosh-KE-le',e:'This is difficult for me.'},
      {cat:'Ease',f:'In baram aasaan-e.',p:'in ba-RAM aa-SAAN-e',e:'This is easy for me.'},
      {cat:'Practice',f:'Har rooz tamrin mikonam.',p:'har rooz tam-RIN mi-KO-nam',e:'I practise every day.'},
      {cat:'Forgetting',f:'Faramoosh kardam.',p:'fa-ra-MOOSH kar-DAM',e:'I forgot.'},
      {cat:'Remembering',f:'Yaadam oomad.',p:'yaa-DAM oo-MAD',e:'I remembered. (lit: it came to my memory)'},
      {cat:'Understanding',f:'Haalaa mifahmam.',p:'haa-LAA mi-FAH-mam',e:'Now I understand.'},
      {cat:'Asking',f:'Inja Farsi ziad sohbat mishe?',p:'in-JA far-SI zi-YAD soh-BAT mi-SHE?',e:'Is Farsi spoken a lot here?'},
      {cat:'Motivation',f:'Doost daaram rooz-i raavan sohbat konam.',p:'doost DAA-ram rooz-I ra-VAAN soh-BAT ko-NAM',e:'I want to one day speak fluently.',note:'"Raavan" = fluent/flowing'},
    ],
    convos:[{
      title:'Reflecting on 60 days of learning',scene:'Talking to an Iranian friend about your Farsi journey',
      exchanges:[
        {spk:'Friend',f:'Chand vaghte ke Farsi yad migiri?',p:'chand vaght-E ke far-SI yad mi-GI-ri?',e:'How long have you been learning Farsi?'},
        {spk:'You',f:'Shast rooz. Kheyli pishraft kardam vali hanooz yad migiram.',p:'shast rooz. KHEY-li pish-RAFT kar-DAM va-LI ha-NOOZ yad mi-GI-ram',e:'Sixty days. I have made a lot of progress but I am still learning.'},
        {spk:'Friend',f:'Che chizi barat moshkele?',p:'che chi-ZI ba-RAT mosh-KE-le?',e:'What is difficult for you?'},
        {spk:'You',f:'Fe\'l-haa moshkele. Vaqti ke tond sohbat mikonid nemifahmam.',p:'fe\'L-haa mosh-KE-le. vaght-I ke tond soh-BAT mi-KO-nid ne-mi-FAH-mam',e:'Verbs are difficult. When you speak fast I don\'t understand.',note:'"Tond" = fast'},
        {spk:'Friend',f:'Normal-e! Tamrin kon. Har rooz behtar mishe.',p:'nor-MAL-e! tam-RIN kon. har rooz beh-TAR mi-SHE',e:'That is normal! Practise. It gets better every day.'},
        {spk:'You',f:'Mamnoon. Omidvaaram roozi raavan sohbat konam.',p:'mam-NOON. o-mid-VAA-ram roo-ZI ra-VAAN soh-BAT ko-NAM',e:'Thank you. I hope one day I speak fluently.'},
      ]
    }],
    verbs:[],
  },
  51:{
    grammar:[
      {title:'Compound verbs — verb + kardan/shodan/dadan',body:'Many Persian verbs are compound: base word + "kardan" (to do), "shodan" (to become), or "dadan" (to give). Once you know these three, you can make hundreds of verbs.',ex:{f:'Komak kardan · Khosh shodan · Yad dadan',p:'ko-MAK kar-DAN · khosh sho-DAN · yad da-DAN',e:'To help (help-doing) · To be pleased (pleased-becoming) · To teach (memory-giving)'}},
      {title:'Present tense of compound verbs',body:'For "kardan" compounds: mi + base + konam. For "shodan" compounds: mi + base + sham.',ex:{f:'Komak mikonam. Khosh misham.',p:'ko-MAK mi-KO-nam. khosh mi-SHAM',e:'I help. / I become pleased.'}},
    ],
    phrases:[
      {cat:'Saying',f:'Migam.',p:'mi-GAM',e:'I say. (informal present of goftan)',note:'"Migam" is the extremely common spoken form'},
      {cat:'Saying',f:'Chi gofti?',p:'chi gof-TI?',e:'What did you say?'},
      {cat:'Listening',f:'Goosh midam.',p:'goosh mi-DAM',e:'I am listening.',note:'"Goosh dadan" = to listen'},
      {cat:'Reading',f:'Daram mikhonam.',p:'daa-RAM mi-KHOO-nam',e:'I am reading.'},
      {cat:'Writing',f:'Daram minevisam.',p:'daa-RAM mi-ne-VI-sam',e:'I am writing.'},
      {cat:'Helping',f:'Mitoonam komak konam?',p:'mi-TOO-nam ko-MAK ko-NAM?',e:'Can I help?'},
      {cat:'Waiting',f:'Montazer hastam.',p:'mon-TA-zer HAS-tam',e:'I am waiting.',note:'"Montazer" = waiting/expecting'},
      {cat:'Asking',f:'Yek chizi mipoorsam.',p:'yek chi-ZI mi-POOR-sam',e:'I am asking one thing.'},
      {cat:'Seeing',f:'Mitoonam bebinam?',p:'mi-TOO-nam be-BI-nam?',e:'Can I see?'},
      {cat:'Hearing',f:'Nemishenavam.',p:'ne-mi-SHE-na-vam',e:'I cannot hear.',note:'"Shenidan" = to hear'},
    ],
    convos:[{
      title:'A phone call in Farsi',scene:'Calling a friend to make plans',
      exchanges:[
        {spk:'Friend',f:'Allo?',p:'al-LO?',e:'Hello? (phone greeting)'},
        {spk:'You',f:'Salam! Trent hastam. Mitooni sohbat koni?',p:'sa-LAM! trent HAS-tam. mi-TOO-ni soh-BAT ko-NI?',e:'Hello! It\'s Trent. Can you talk?',note:'"Sohbat kardan" = to talk/speak'},
        {spk:'Friend',f:'Aare mitonam. Che khabar?',p:'AA-re mi-TOO-nam. che kha-BAR?',e:'Yes I can. What\'s up?'},
        {spk:'You',f:'Mikhaam beporsam, farda vaght daari?',p:'mi-KHAAM be-POR-sam, far-DA vaght daa-RI?',e:'I want to ask, do you have time tomorrow?'},
        {spk:'Friend',f:'Saat-e chand? Sobh kaar mikonam.',p:'saa-AT-e chand? sobh kaar mi-KO-nam',e:'What time? I work in the morning.'},
        {spk:'You',f:'Baad az zohr. Saat-e do ya se.',p:'baad az zohr. saa-AT-e do ya se',e:'After noon. Two or three o\'clock.'},
        {spk:'Friend',f:'Khoob-e. Montazer-et hastam.',p:'KHOOB-e. mon-TA-zer-ET HAS-tam',e:'Good. I will be waiting for you.',note:'"Montazer-et hastam" = I am waiting for you'},
      ]
    }],
    verbs:[{
      name:'Key Advanced Verbs — Present', root:'various', tense:'present',
      rows:[
        {person:'Goftan (to say)',form:'migam / migooii / migeh',phon:'mi-GAM / mi-GOO-i / mi-GE',eng:'I say / you say / he-she says (spoken forms)'},
        {person:'Shenidan (to hear)',form:'mishenavam / mishenavi / mishenavad',phon:'mi-SHE-na-vam / mi-SHE-na-vi / mi-SHE-na-vad',eng:'I hear / you hear / he-she hears'},
        {person:'Komak kardan (to help)',form:'komak mikonam / mikoni / mikone',phon:'ko-MAK mi-KO-nam / mi-KO-ni / mi-KO-ne',eng:'I help / you help / he-she helps'},
        {person:'Porsidan (to ask)',form:'mipoorsam / mipoori / mipoore',phon:'mi-POOR-sam / mi-POO-ri / mi-POO-re',eng:'I ask / you ask / he-she asks'},
      ]
    }],
  },
  52:{
    grammar:[
      {title:'"Baayad" + subjunctive — obligation and advice',body:'"Baayad" requires the subjunctive form of the verb (starts with "be-" for most verbs). "Baayad beram" = I must go. "Baayad beri" = you must go.',ex:{f:'Man baayad beram. To baayad beri. Oo baayad bere.',p:'man baa-YAD be-RAM. to baa-YAD be-RI. oo baa-YAD be-RE',e:'I must go. You must go. He/She must go.'}},
      {title:'"Mitoonam" + subjunctive — ability',body:'"Mitoonam" = I can. Followed by subjunctive: "Mitoonam beram" = I can go.',ex:{f:'Mitoonam komak konam? Nemitonam biaaym.',p:'mi-TOO-nam ko-MAK ko-NAM? ne-mi-TOO-nam bi-AA-yam',e:'Can I help? I cannot come.'}},
    ],
    phrases:[
      {cat:'Obligation',f:'Baayad beram.',p:'baa-YAD be-RAM',e:'I must go.'},
      {cat:'Obligation',f:'Baayad tamrin koni.',p:'baa-YAD tam-RIN ko-NI',e:'You must practise.'},
      {cat:'Prohibition',f:'Nabaayad inja biaai.',p:'na-baa-YAD in-JA bi-AA-i',e:'You must not come here.'},
      {cat:'Ability',f:'Mitoonam komak konam.',p:'mi-TOO-nam ko-MAK ko-NAM',e:'I can help.'},
      {cat:'Inability',f:'Nemitonam biaaym.',p:'ne-mi-TOO-nam bi-AA-yam',e:'I cannot come.'},
      {cat:'Permission',f:'Mitoonam biyam?',p:'mi-TOO-nam bi-YAM?',e:'May I come?'},
      {cat:'Advice',f:'Baayad bekhabi.',p:'baa-YAD be-KHA-bi',e:'You should sleep.',note:'"Khaabidan" = to sleep'},
      {cat:'Advice',f:'Nabaayad kheyli kaar koni.',p:'na-baa-YAD KHEY-li kaar ko-NI',e:'You should not work too much.'},
      {cat:'Necessity',f:'Lazem-e beri.',p:'LA-zem-e be-RI',e:'It is necessary for you to go.'},
      {cat:'Asking',f:'Baayad chi konam?',p:'baa-YAD chi ko-NAM?',e:'What must I do?'},
    ],
    convos:[{
      title:'Getting advice',scene:'Asking a friend for advice about learning Farsi better',
      exchanges:[
        {spk:'You',f:'Mikhaam beporsam. Baayad chi konam ta Farsi-am behtar beshe?',p:'mi-KHAAM be-POR-sam. baa-YAD chi ko-NAM ta far-SI-am beh-TAR be-SHE',e:'I want to ask. What should I do to make my Farsi better?'},
        {spk:'Friend',f:'Baayad har rooz tamrin koni. Nabaayad faqat ba englisi sohbat koni.',p:'baa-YAD har rooz tam-RIN ko-NI. na-baa-YAD faq-HAT ba eng-LI-si soh-BAT ko-NI',e:'You must practise every day. You must not only speak in English.'},
        {spk:'You',f:'Mitoonam film-e Irani negah konam?',p:'mi-TOO-nam film-E i-RA-ni ne-GAH ko-NAM?',e:'Can I watch Iranian films?'},
        {spk:'Friend',f:'Aare! Kheyli khoob-e. Baayad zir-nevis Farsi dashte baashi.',p:'AA-re! KHEY-li KHOOB-e. baa-YAD zir-ne-VIS far-SI dash-TE baa-SHI',e:'Yes! It is very good. You should have Farsi subtitles.',note:'"Zir-nevis" = subtitles'},
        {spk:'You',f:'Mitoonam ba irani-haa sohbat konam?',p:'mi-TOO-nam ba i-RA-ni-haa soh-BAT ko-NAM?',e:'Can I speak with Iranians?'},
        {spk:'Friend',f:'Albate! Mano hamevar mitoonam ba ham sohbat konim.',p:'al-bat-TE! ma-NO ha-me-VAR mi-TOO-nam ba ham soh-BAT ko-NIM',e:'Of course! You and I can always talk together.',note:'"Albate" = of course/certainly'},
      ]
    }],
    verbs:[],
  },
  53:{
    grammar:[
      {title:'Giving directions with landmarks',body:'Iranians give directions using landmarks ("rooberoo-ye bank" = opposite the bank) rather than street names. Learn to use and understand landmark-based navigation.',ex:{f:'Rooberoo-ye masjed berid chap. Kenar-e supermarket-e.',p:'roo-be-ROO-ye mas-JED be-RID chap. ke-NAR-e su-per-MAR-ket-e',e:'Go left opposite the mosque. It is next to the supermarket.'}},
      {title:'Distance expressions',body:'Persian uses "chand daghighe piyadeh" (a few minutes on foot) or "chand daghighe ba mashine" (a few minutes by car) for distances.',ex:{f:'Panj daghighe piyadeh-e. Bist daghighe ba otoboos-e.',p:'panj da-GHIGH-e pi-YAA-de-e. bist da-GHIGH-e ba o-to-BOOS-e',e:'It is five minutes on foot. It is twenty minutes by bus.'}},
    ],
    phrases:[
      {cat:'Directions',f:'Rooberoo-ye ___',p:'roo-be-ROO-ye ___',e:'Opposite ___'},
      {cat:'Directions',f:'Kenar-e ___',p:'ke-NAR-e ___',e:'Next to ___'},
      {cat:'Directions',f:'Jolo-ye ___',p:'jo-LO-ye ___',e:'In front of ___'},
      {cat:'Directions',f:'Aghab-e ___',p:'a-GHAB-e ___',e:'Behind ___'},
      {cat:'Directions',f:'Sar-e kooche chap berid.',p:'sar-E koo-CHE chap be-RID',e:'Turn left at the end of the alley.'},
      {cat:'Distance',f:'Panj daghighe piyadeh-e.',p:'panj da-GHIGH-e pi-YAA-de-e',e:'It is five minutes on foot.'},
      {cat:'Distance',f:'Nazdik-e, door nist.',p:'naz-DIK-e, door nist',e:'It is close, not far.'},
      {cat:'Landmarks',f:'Rooberoo-ye bank-e.',p:'roo-be-ROO-ye bank-e',e:'It is opposite the bank.'},
      {cat:'Confirming',f:'Darst miram?',p:'do-ROST mi-RAM?',e:'Am I going the right way?'},
      {cat:'Asking',f:'Ma\'zerat mikhaam, goum shodam.',p:'ma-ze-RAT mi-KHAAM, goom sho-DAM',e:'I am sorry, I got lost.',note:'"Goum shodan" = to get lost'},
    ],
    convos:[{
      title:'Getting lost and finding the way',scene:'Lost in the old city, needing to find the hotel',
      exchanges:[
        {spk:'You',f:'Bebakhshid, goum shodam. Hotel-e Parsian koja-st?',p:'be-BAKH-shid, goom sho-DAM. ho-TEL-e par-SI-an ko-JA-st?',e:'Excuse me, I got lost. Where is Parsian Hotel?'},
        {spk:'Local',f:'Narahat nabash. Rooberoo-ye in masjed berid rast.',p:'na-ra-HAT na-BASH. roo-be-ROO-ye in mas-JED be-RID rast',e:'Don\'t worry. Go right opposite this mosque.'},
        {spk:'You',f:'Baad az oon?',p:'baad az oon?',e:'After that?'},
        {spk:'Local',f:'Baad ghosha chap berid. Hotel rooberoo-ye baank-e.',p:'baad gho-SHE chap be-RID. ho-TEL roo-be-ROO-ye baank-e',e:'Then turn left at the corner. The hotel is opposite the bank.'},
        {spk:'You',f:'Chand daghighe piyadeh-e?',p:'chand da-GHIGH-e pi-YAA-de-e?',e:'How many minutes on foot?'},
        {spk:'Local',f:'Haft ta dah daghighe. Nazdik-e.',p:'haft ta dah da-GHIGH-e. naz-DIK-e',e:'Seven to ten minutes. It\'s close.'},
        {spk:'You',f:'Kheyli mamnoon! Dast-et dard nakone.',p:'KHEY-li mam-NOON! das-TET dard na-KO-ne',e:'Thank you so much! May your hand not hurt.'},
      ]
    }],
    verbs:[],
  },
  54:{
    grammar:[
      {title:'Poetry vocabulary — emotional and spiritual language',body:'Persian poetry uses a specialised emotional vocabulary. "Eshgh" = deep/divine love. "Del" = heart/soul. "Jaavid" = eternal. "Rooh" = spirit.',ex:{f:'Del-am az eshgh por-e. Jaavid dar khaatera mimaane.',p:'de-LAM az eshgh por-e. jaa-VID dar khaa-TE-ra mi-MAN-e',e:'My heart is full of love. It remains eternally in memory.'}},
      {title:'Quoting poetry — "Hafez migeh ke..."',body:'To quote a poet, use "Hafez/Rumi migeh ke..." (Hafez/Rumi says that...) as a framing phrase.',ex:{f:'Hafez migeh ke del-e aadam por az eshgh-e.',p:'haa-FEZ mi-GE ke del-E aa-DAM por az eshgh-e',e:'Hafez says that the human heart is full of love.'}},
    ],
    phrases:[
      {cat:'Poetry',f:'She\'r doost daaram.',p:'she\'r doost DAA-ram',e:'I love poetry.'},
      {cat:'Poetry',f:'Hafez shaaer-e bozorgi-e.',p:'haa-FEZ shaa-ER-e bo-ZOR-gi-e',e:'Hafez is a great poet.'},
      {cat:'Poetry',f:'In she\'r ziba-st.',p:'in she\'r zi-BA-st',e:'This poem is beautiful.'},
      {cat:'Love',f:'Eshgh-e waaqei',p:'eshgh-E vaa-GHE-i',e:'True love',note:'"Waaqei" = real/true'},
      {cat:'Heart',f:'Del-am por-e.',p:'de-LAM por-e',e:'My heart is full.'},
      {cat:'Soul',f:'Rooh-am aaraam-e.',p:'rooh-AM aa-RAAM-e',e:'My soul is at peace.'},
      {cat:'Eternal',f:'Jaavid dar yaadam mimaane.',p:'jaa-VID dar yaa-DAM mi-MAN-e',e:'It remains eternally in my memory.'},
      {cat:'Rumi',f:'Rumi migeh: del-o aadam baham-and.',p:'roo-MI mi-GE: del-O aa-DAM ba-HAM-and',e:'Rumi says: heart and human are together.',note:'Paraphrase of Rumi\'s philosophy'},
      {cat:'Nature of love',f:'Eshgh zabanee nadare.',p:'eshgh za-BAA-ni na-daa-re',e:'Love has no language.',note:'A classic Persian proverb'},
      {cat:'Asking',f:'She\'r-e Farsi mikhooni?',p:'she\'r-E far-SI mi-KHOO-ni?',e:'Do you read Persian poetry?'},
    ],
    convos:[{
      title:'Discussing Persian poetry',scene:'Visiting the tomb of Hafez in Shiraz',
      exchanges:[
        {spk:'Guide',f:'Khosh omadid be aaramaghh-e Hafez. Hafez-ro mishnasid?',p:'khoosh o-MA-did be aar-aam-GAH-e haa-FEZ. haa-FEZ-ro mi-shnaa-SID?',e:'Welcome to the tomb of Hafez. Do you know Hafez?',note:'"Aaramagah" = resting place/tomb'},
        {spk:'You',f:'Kami. Shaaer-e bozorgi-e. She\'r-ash ziba-st.',p:'ka-MI. shaa-ER-e bo-ZOR-gi-e. she\'r-ASH zi-BA-st',e:'A little. He is a great poet. His poetry is beautiful.'},
        {spk:'Guide',f:'Bale. Hafez migeh ke eshgh tanhaa haqiqhat-e.',p:'BA-le. haa-FEZ mi-GE ke eshgh tan-HAA ha-GHI-ghat-e',e:'Yes. Hafez says that love is the only truth.',note:'"Haqiqhat" = truth'},
        {spk:'You',f:'Che ziba! Del-am por mishe vaghti in she\'r-haa ro mishnavam.',p:'che zi-BA! de-LAM por mi-SHE vaght-I in she\'r-HAA ro mi-SHE-na-vam',e:'How beautiful! My heart fills when I hear these poems.'},
        {spk:'Guide',f:'Irani-haa Hafez ro az bar midoonam. Yani az gheib mikhonan.',p:'i-RA-ni-haa haa-FEZ ro az bar mi-DOO-nam. ya-NI az gheib mi-KHOO-nan',e:'Iranians know Hafez by heart. That is, they recite from memory.',note:'"Az bar" = by heart, "az gheib" = from memory (lit: from the unseen)'},
      ]
    }],
    verbs:[],
  },
  56:{
    grammar:[

      {title:'Expressing food preferences formally',body:'Use "Bishtar doost daaram" (I prefer/like more) for food preferences.',ex:{f:'Ghormeh sabzi ro bishtar az kebab doost daaram.',p:'ghor-ME sab-ZI ro bish-TAR az ke-BAB doost DAA-ram',e:'I prefer ghormeh sabzi over kebab.'}},
    ],
    phrases:[
      {cat:'Dishes',f:'Ghormeh sabzi kheyli doost daaram.',p:'ghor-ME sab-ZI KHEY-li doost DAA-ram',e:'I love ghormeh sabzi.'},
      {cat:'Dishes',f:'Chelo kebab-e national food-e Iran-e.',p:'che-LO ke-BAB-e na-shio-NAL food-E i-RAN-e',e:'Chelo kebab is the national food of Iran.'},
      {cat:'Dishes',f:'Tah-dig-e yek nafsani-e.',p:'tah-DIG-e yek naf-SA-ni-e',e:'Tah-dig is a temptation.',note:'"Nafsaani" = temptation/weakness'},

  57:{
    grammar:[
      {title:'"Yani" — the most useful filler word',body:'"Yani" = that is / meaning / in other words. Used constantly to clarify, explain, or buy time in conversation. Also used as "you mean...?" to confirm understanding.',ex:{f:'Yani chi? · Yani miaayi? · Yani, man nemidoonam.',p:'ya-NI chi? · ya-NI mi-AY-i? · ya-NI, man ne-mi-DOO-nam',e:'What do you mean? · Meaning you are coming? · I mean, I don\'t know.'}},
      {title:'"Dar asl" and "Ba in haal" — discourse connectors',body:'These sophisticated connectors elevate your speech. "Dar asl" = actually/in fact. "Ba in haal" = nevertheless/even so.',ex:{f:'Dar asl, fekr mikonam dorost-e. Ba in haal, shayad eshtebah konam.',p:'dar asl, fekr mi-KO-nam do-ROST-e. ba in haal, sha-YAD esh-te-BAAH ko-NAM',e:'Actually, I think it\'s correct. Nevertheless, maybe I am making a mistake.'}},
    ],
    phrases:[
      {cat:'Clarifying',f:'Yani chi?',p:'ya-NI chi?',e:'What do you mean?'},
      {cat:'Clarifying',f:'Yani miaayi?',p:'ya-NI mi-AY-i?',e:'Meaning you are coming?'},
      {cat:'Actually',f:'Dar asl...',p:'dar asl...',e:'Actually... / In fact...'},
      {cat:'Nevertheless',f:'Ba in haal...',p:'ba in haal...',e:'Nevertheless... / Even so...'},
      {cat:'Therefore',f:'Vase hamin...',p:'va-SE ha-MIN...',e:'That is why... / Therefore...'},
      {cat:'Regarding',f:'Dar morede-ash...',p:'dar mo-RE-de-ash...',e:'Regarding it / About that...'},
      {cat:'Transition',f:'Az taraf-e digar...',p:'az ta-RAF-e di-GAR...',e:'On the other hand...',note:'"Taraf" = side/direction'},
      {cat:'Emphasising',f:'Motmaen-am ke...',p:'mot-ma-EN-am ke...',e:'I am sure that...'},
      {cat:'Admitting',f:'Raast-e ke...',p:'raast-E ke...',e:'It is true that...'},
      {cat:'Concluding',f:'Kholaase in ke...',p:'kho-LAA-se in ke...',e:'In summary... / The point is...',note:'"Kholaase" = summary'},
    ],
    convos:[{
      title:'A deeper conversation',scene:'Discussing travel plans in more complex Farsi',
      exchanges:[
        {spk:'Friend',f:'Mikhaam berem esfahan. Nazaret chi-e?',p:'mi-KHAAM be-REM es-fa-HAN. na-ZA-ret chi-E?',e:'I want to go to Isfahan. What is your opinion?'},
        {spk:'You',f:'Dar asl, fekr mikonam aali-e. Vali kai?',p:'dar asl, fekr mi-KO-nam aa-LEE-e. va-LI kai?',e:'Actually, I think it is excellent. But when?'},
        {spk:'Friend',f:'Maahe digar shayad. Vaght daari?',p:'maa-HE di-GAR sha-YAD. vaght daa-RI?',e:'Maybe next month. Do you have time?',note:'"Maahe digar" = next month'},
        {spk:'You',f:'Dar morede-ash baayad fekr konam. Yani, kaar daaram oon vaght.',p:'dar mo-RE-de-ash baa-YAD fekr ko-NAM. ya-NI, kaar daa-RAM oon vaght',e:'I need to think about it. I mean, I have work at that time.'},
        {spk:'Friend',f:'Ba in haal, shayad beshe? Dar asl esfahan kheyli ghashang-e.',p:'ba in haal, sha-YAD be-SHE. dar asl es-fa-HAN KHEY-li gha-SHANG-e',e:'Nevertheless, maybe it can work? Actually Isfahan is very beautiful.'},
        {spk:'You',f:'Dorost migi. Vase hamin mikhaam biaam. Beriizim barname.',p:'do-ROST mi-GI. va-SE ha-MIN mi-KHAAM bi-AAM. be-RI-zim bar-NA-me',e:'You are right. That is why I want to come. Let\'s make a plan.'},
      ]
    }],
    verbs:[],
  },
  58:{
    grammar:[
      {title:'Exclamations — "Vaay" and its many meanings',body:'"Vaay!" changes meaning entirely with tone. Rising tone = positive surprise. Falling tone = dismay or sympathy. It is the most versatile single-word reaction in Farsi.',ex:{f:'Vaay, cheghadr ghashang-e! · Vaay, che bad!',p:'vaay, che-GHADR gha-SHANG-e! · vaay, che bad!',e:'Wow, how beautiful! · Oh no, how bad!'}},
      {title:'"Mage?" — expressing disbelief',body:'"Mage?" challenges the truth of what was just said. It is placed at the start and carries a strong "really?" or "no way!" implication.',ex:{f:'Rafti Iran? Mage? · Mage nemidonesti?',p:'raf-TI i-RAN? ma-GE? · ma-GE ne-mi-do-NES-ti?',e:'You went to Iran? Really? · No way, didn\'t you know?'}},
    ],
    phrases:[
      {cat:'Surprise',f:'Vaay! Baavar nemikonam!',p:'vaay! baa-VAR ne-mi-KO-nam!',e:'Wow! I can\'t believe it!',note:'"Baavar kardan" = to believe'},
      {cat:'Surprise',f:'Mage? Raast migi?',p:'ma-GE? raast mi-GI?',e:'Really? Are you serious?'},
      {cat:'Joy',f:'Vaay, che khoob!',p:'vaay, che KHOOB!',e:'Oh, how wonderful!'},
      {cat:'Sympathy',f:'Vaay, che bad. Narahat shodam.',p:'vaay, che bad. na-ra-HAT sho-DAM',e:'Oh no, how bad. I am upset for you.'},
      {cat:'Awe',f:'Subhaan-allah! Zibaa-st!',p:'sub-HAAN-al-LAH! zi-BAA-st!',e:'Subhanallah! It is beautiful!'},
      {cat:'Gratitude',f:'Elahi shokr! Khoob shod.',p:'e-LA-hi shokr! KHOOB shod',e:'Thank God! It got better.'},
      {cat:'Interest',f:'Che joaluub! Bish-tar bekhaan.',p:'che ja-LOOB! bish-TAR be-KHAAN',e:'How interesting! Tell me more.',note:'"Bish-tar bekhaan" = read/tell more'},
      {cat:'Shock',f:'Khak bar saram! Faramoosh kardam.',p:'khak bar sa-RAM! fa-ra-MOOSH kar-DAM',e:'Oh no! I forgot.',note:'"Khak bar saram" = expression of self-reproach'},
      {cat:'Hope',f:'Inshallah khoob mishe.',p:'in-sha-LAAH KHOOB mi-SHE',e:'Hopefully it will get better.'},
      {cat:'Relief',f:'Elahi shokr, aamad.',p:'e-LA-hi shokr, oo-MAD',e:'Thank God, he/she came.'},
    ],
    convos:[{
      title:'Reacting to exciting news',scene:'A friend tells you some surprising news',
      exchanges:[
        {spk:'Friend',f:'Trent! Kaar-e jadid peyda kardam!',p:'trent! kaar-E ja-DID pey-DA kar-DAM',e:'Trent! I found a new job!'},
        {spk:'You',f:'Vaay! Baavar nemikonam! Mage? Koja?',p:'vaay! baa-VAR ne-mi-KO-nam! ma-GE? ko-JA?',e:'Wow! I can\'t believe it! Really? Where?'},
        {spk:'Friend',f:'Dar yek sherekat-e bozorg. Kheyli khoshhaal hastam.',p:'dar yek she-re-KAT-e bo-ZORG. KHEY-li khosh-HAAL HAS-tam',e:'At a big company. I am very happy.'},
        {spk:'You',f:'Che khoob! Mobaarak baad! Elahi shokr!',p:'che KHOOB! mo-BAA-rak baad! e-LA-hi shokr!',e:'How wonderful! Congratulations! Thank God!'},
        {spk:'Friend',f:'Mamnoon. Dar asl mikhaastam behet bedam khabar.',p:'mam-NOON. dar asl mi-KHAAS-tam be-HET be-DAM kha-BAR',e:'Thank you. Actually I wanted to give you the news.',note:'"Khabar dadan" = to give news'},
        {spk:'You',f:'Kheyli khoshhaal shodam baraat. Jashan migirim?',p:'KHEY-li khosh-HAAL sho-DAM ba-RAAT. jas-HAN mi-GI-rim?',e:'I am so happy for you. Shall we celebrate?',note:'"Baraat" = for you'},
      ]
    }],
    verbs:[],
  },
  59:{
    grammar:[
      {title:'Sequencing a story with Persian connectors',body:'Persian storytelling uses: "Avval" (first), "Baad az oon" (after that), "Baadash" (then), "Dar nahayat" (finally), "Naagahan" (suddenly).',ex:{f:'Avval raftam bazar. Baad az oon ghaza khordam. Naagahan baroon oomad. Dar nahayat khaane raftam.',p:'av-VAL raf-TAM ba-ZAR. baad az oon gha-ZAA khor-DAM. naa-ga-HAN ba-ROON oo-MAD. dar na-HA-yat KHAA-ne raf-TAM',e:'First I went to the market. After that I ate food. Suddenly it rained. Finally I went home.'}},
      {title:'"Yek dafe ye" — once upon a time',body:'"Yek dafe ye" = once / one time. "Yek vaght" = at one point. Both open personal stories naturally.',ex:{f:'Yek dafe ye be esfahan raftam. Yek vaght Farsi nemidoonestam.',p:'yek da-FE-e be es-fa-HAN raf-TAM. yek vaght far-SI ne-mi-DOO-nes-tam',e:'Once I went to Isfahan. At one point I didn\'t know Farsi.'}},
    ],
    phrases:[
      {cat:'Opening',f:'Yek dafe ye...',p:'yek da-FE-e...',e:'Once / One time...'},
      {cat:'Opening',f:'Vaghti ke dar Iran boodam...',p:'vaght-I ke dar i-RAN boo-DAM...',e:'When I was in Iran...'},
      {cat:'Sequence',f:'Avval...',p:'av-VAL...',e:'First...'},
      {cat:'Sequence',f:'Baad az oon...',p:'baad az oon...',e:'After that...'},
      {cat:'Sequence',f:'Baadash...',p:'baa-DASH...',e:'Then...'},
      {cat:'Sudden',f:'Naagahan...',p:'naa-ga-HAN...',e:'Suddenly...'},
      {cat:'Meanwhile',f:'Hamoon vaght...',p:'ha-MOON vaght...',e:'At that moment / Meanwhile...'},
      {cat:'Conclusion',f:'Dar nahayat...',p:'dar na-HA-yat...',e:'Finally / In the end...'},
      {cat:'Result',f:'Vase hamin shod ke...',p:'va-SE ha-MIN shod ke...',e:'That is why it happened that...'},
      {cat:'Reflection',f:'Oon ruz yaadam nemire.',p:'oon rooz yaa-DAM ne-mi-RE',e:'That day I will never forget.',note:'"Yaadam nemire" = I will not forget it'},
    ],
    convos:[{
      title:'Telling the story of your 60-day journey',scene:'Sharing your language learning story with an Iranian friend',
      exchanges:[
        {spk:'Friend',f:'Az chetori Farsi yad gereftit baraam begoo.',p:'az che-TO-ri far-SI yad ge-ref-TIT ba-RAAM be-GOO',e:'Tell me how you learned Farsi.'},
        {spk:'You',f:'Khoob. Yek dafe ye tasmim gereftam Farsi yad begiram.',p:'KHOOB. yek da-FE-e tas-MIM ge-ref-TAM far-SI yad be-GI-ram',e:'OK. Once I decided to learn Farsi.',note:'"Tasmim gereftan" = to make a decision'},
        {spk:'Friend',f:'Chera?',p:'che-RA?',e:'Why?'},
        {spk:'You',f:'Avval faqat khaastam salam goftan yad begiram. Baad az oon kheyli jaleb shod.',p:'av-VAL faq-HAT khaas-TAM sa-LAM gof-TAN yad be-GI-ram. baad az oon KHEY-li ja-LEB shod',e:'First I just wanted to learn to say hello. After that it became very interesting.'},
        {spk:'Friend',f:'Naagahan che shod?',p:'naa-ga-HAN che shod?',e:'What suddenly happened?'},
        {spk:'You',f:'Naagahan fahmidam mitonam sohbat konam! Dar nahayat shast ruz tamrin kardam.',p:'naa-ga-HAN fah-MI-dam mi-TOO-nam soh-BAT ko-NAM! dar na-HA-yat shast rooz tam-RIN kar-DAM',e:'Suddenly I realised I can speak! Finally I practised sixty days.'},
        {spk:'Friend',f:'Afarin Trent! In dastan-e khobi-e.',p:'a-fa-RIN trent! in daas-TAN-e KHOO-bi-e',e:'Bravo Trent! This is a good story.',note:'"Dastan" = story'},
      ]
    }],
    verbs:[],
  },
  60:{
    grammar:[
      {title:'60-day review — you have come full circle',body:'In 60 days you have covered: all tenses, modals, question words, numbers, family, health, work, culture, poetry, food, transport, emotions, and real conversation. The structure is yours — vocabulary is infinite.',ex:{f:'Man Farsi yad gereftam. Hanooz yad migiram. Har rooz behtar misham.',p:'man far-SI yad ge-ref-TAM. ha-NOOZ yad mi-GI-ram. har rooz beh-TAR mi-SHAM',e:'I learned Farsi. I am still learning. Every day I get better.'}},
      {title:'The road ahead',body:'After 60 days you have a strong foundation. Next steps: Iranian films with Farsi subtitles, reading simple Persian texts phonetically, and most importantly — conversation with native speakers.',ex:{f:'Omidvaaram roozi raavan Farsi sohbat konam.',p:'o-mid-VAA-ram roo-ZI ra-VAAN far-SI soh-BAT ko-NAM',e:'I hope one day to speak Farsi fluently.'}},
    ],
    phrases:[
      {cat:'Achievement',f:'Shast rooz Farsi yad gereftam!',p:'shast rooz far-SI yad ge-ref-TAM!',e:'I learned Farsi for sixty days!'},
      {cat:'Achievement',f:'Kheyli pishraft kardam.',p:'KHEY-li pish-RAFT kar-DAM',e:'I have made a lot of progress.'},
      {cat:'Pride',f:'Be khodam eftekhar mikonam.',p:'be kho-DAM ef-te-KHAAR mi-KO-nam',e:'I am proud of myself.',note:'"Eftekhar kardan" = to be proud'},
      {cat:'Hope',f:'Omidvaaram roozi raavan sohbat konam.',p:'o-mid-VAA-ram roo-ZI ra-VAAN soh-BAT ko-NAM',e:'I hope one day to speak fluently.'},
      {cat:'Gratitude',f:'Az hame kasi ke komak kard mamnoon-am.',p:'az ha-ME ka-SI ke ko-MAK kard mam-NOON-am',e:'I am grateful to everyone who helped.',note:'"Hameh kasi" = everyone'},
      {cat:'Continuation',f:'Hanooz yad migiram.',p:'ha-NOOZ yad mi-GI-ram',e:'I am still learning.'},
      {cat:'Daily habit',f:'Har rooz Farsi tamrin mikonam.',p:'har rooz far-SI tam-RIN mi-KO-nam',e:'I practise Farsi every day.'},
      {cat:'Blessing',f:'Movafagh baashi dar in safar.',p:'mo-VAF-fagh baa-SHI dar in sa-FAR',e:'Good luck on this journey.',note:'"Safar" = journey/trip — language learning is a journey'},
    ],
    convos:[{
      title:'The final conversation — 60 days later',scene:'A full natural conversation with an Iranian who is impressed by your Farsi',
      exchanges:[
        {spk:'Iranian',f:'Salam! Farsi baladi? Kheyli khoob sohbat mikoni!',p:'sa-LAM! far-SI ba-LA-di? KHEY-li KHOOB soh-BAT mi-KO-ni!',e:'Hello! Do you know Farsi? You speak very well!'},
        {spk:'You',f:'Salam! Mamnoon. Shast rooz yad gereftam. Hanooz daram yad migiram.',p:'sa-LAM! mam-NOON. shast rooz yad ge-ref-TAM. ha-NOOZ daa-RAM yad mi-GI-ram',e:'Hello! Thank you. I have been learning for sixty days. I am still learning.'},
        {spk:'Iranian',f:'Mashallah! Shast rooz faqat? Farsi-et aali-e!',p:'ma-sha-LAAH! shast rooz faq-HAT? far-SI-et aa-LEE-e!',e:'Wonderful! Only sixty days? Your Farsi is excellent!'},
        {spk:'You',f:'Lotf dari. Dar asl kheyli tamrin kardam. Har rooz.',p:'lotf daa-RI. dar asl KHEY-li tam-RIN kar-DAM. har rooz',e:'You are kind. Actually I practised a lot. Every day.'},
        {spk:'Iranian',f:'Az koja Farsi yad gereftit?',p:'az ko-JA far-SI yad ge-ref-TIT?',e:'Where did you learn Farsi?'},
        {spk:'You',f:'Ba yek app yad gereftam. Vali moshkele ke hanooz tond sohbat mikonid!',p:'ba yek app yad ge-ref-TAM. va-LI mosh-KE-le ke ha-NOOZ tond soh-BAT mi-KO-nid!',e:'I learned with an app. But the problem is you still speak too fast!'},
        {spk:'Iranian',f:'Haha! Bebakhshid! Kholaase, Farsi-et aali-e. Movafagh baashi!',p:'ha-HA! be-BAKH-shid! kho-LAA-se, far-SI-et aa-LEE-e. mo-VAF-fagh baa-SHI!',e:'Haha! Sorry! In summary, your Farsi is excellent. Good luck!'},
        {spk:'You',f:'Mamnoon az hamatoon. Omidvaaram Iran biaaym va in harf-haa ro estfaade konam!',p:'mam-NOON az ha-ma-TOON. o-mid-VAA-ram i-RAN bi-AA-yam va in harf-HAA ro es-te-FAA-de ko-NAM!',e:'Thank you to all of you. I hope to come to Iran and use all these words!',note:'"Estfaade kardan" = to use'},
      ]
    }],
    verbs:[],
  },
  35:{
    grammar:[
      {title:'Week 5 consolidation — numbers and everyday vocabulary',body:'Numbers 11-100 follow a logical pattern. Compound numbers use "o" (and). Hotel, home, and clothing vocab all use the same ezafe and adjective-after-noun patterns you learned in Week 1.',ex:{f:'Bist o panj · Otaaq-e bozorg · Pirahan-e aabi',p:'bist o panj · o-TAAG-e bo-ZORG · pi-ra-HAN-e aa-BI',e:'25 · Big room · Blue shirt'}},
    ],
    phrases:[
      {cat:'Review',f:'Chand saal daari?',p:'chand saal DAA-ri?',e:'How old are you?'},
      {cat:'Review',f:'Si saal daaram.',p:'si saal DAA-ram',e:'I am thirty years old.'},
      {cat:'Review',f:'Otaaq-am aamaade-st?',p:'o-TAAG-am aa-MAA-de-st?',e:'Is my room ready?'},
      {cat:'Review',f:'In-o mitonam bepusham?',p:'in-o mi-TOO-nam be-poo-SHAM?',e:'Can I try this on?'},
    ],
    convos:[{
      title:'A week 5 review conversation',scene:'Checking into a hotel and asking about nearby shops',
      exchanges:[
        {spk:'Receptionist',f:'Salam! Chand shab reservation darid?',p:'sa-LAM! chand shab re-zer-VA-shon da-RID?',e:'Hello! How many nights do you have a reservation for?'},
        {spk:'You',f:'Panj shab. Otaaq chand-e?',p:'panj shab. o-TAAG CHAN-de?',e:'Five nights. How much is the room?'},
        {spk:'Receptionist',f:'Hashtad hezaar toman dar shab.',p:'hash-TAD he-ZAAR to-MAN dar shab',e:'Eighty thousand tomans per night.'},
        {spk:'You',f:'Baasheh. Nazdik inja maghaze-ye lebas hast?',p:'baa-SHE. naz-DIK in-JA ma-gha-ZE-ye le-BAAS hast?',e:'OK. Is there a clothing shop near here?',note:'"Maghaze" = shop'},
        {spk:'Receptionist',f:'Bale, khiyaboon-e baagheri nazdik-e.',p:'BA-le, khi-yaa-BOON-e baa-ghe-RI naz-DIK-e',e:'Yes, Bagheri Street is nearby.'},
      ]
    }],
    verbs:[],
  },
  40:{
    grammar:[
      {title:'Week 6 consolidation — verb arsenal',body:'You now control ten core verbs: hastam, daaram, mikhaham, miravam, miyam, mikhoram, mibinam, mishnasam, migam, mishnavam. Each follows mi- + root + personal ending in present tense.',ex:{f:'Miyam, mibinam, mishnasam, migam, mishnavam',p:'mi-YAM · mi-BI-nam · mi-SHNA-sam · mi-GAM · mi-SHE-na-vam',e:'I come · I see · I know (person) · I say · I hear'}},
    ],
    phrases:[
      {cat:'Review',f:'Miyam donbalat.',p:'mi-YAM dom-ba-LAT',e:"I'll come pick you up."},
      {cat:'Review',f:'Goft ke zood miyaad.',p:'goft ke zood mi-YAD',e:'He said he is coming soon.'},
      {cat:'Review',f:'Har rooz bidaar misham.',p:'har rooz bi-DAAR mi-SHAM',e:'I wake up every day.'},
      {cat:'Review',f:'Baad az oon miram.',p:'baad az oon mi-RAM',e:'After that I go.'},
    ],
    convos:[{
      title:'Week 6 full review conversation',scene:'Catching up after a busy week',
      exchanges:[
        {spk:'Friend',f:'Chetori? Chand rooz-e nadidamet.',p:'che-TO-ri? chand rooz-e na-di-DA-met',e:"How are you? I haven't seen you for a few days."},
        {spk:'You',f:'Khoobam! Kheyli mashghool boodam. Har rooz kar kardam.',p:'KHOO-bam! KHEY-li mash-GHOOL boo-DAM. har rooz kar kar-DAM',e:"I'm good! I was very busy. I worked every day."},
        {spk:'Friend',f:'Shenidm ke safar kardi.',p:'she-NI-dam ke sa-FAR kar-DI',e:'I heard you travelled.'},
        {spk:'You',f:'Bale! Isfahan raftam va kheyli ghashang didam.',p:'BA-le! is-fa-HAN raf-TAM va KHEY-li gha-SHANG di-DAM',e:'Yes! I went to Isfahan and saw many beautiful things.'},
      ]
    }],
    verbs:[],
  },
  45:{
    grammar:[

  50:{
    grammar:[
      {title:'Day 50 milestone — half of 60',body:'At Day 50 you have covered: all basic verb conjugations, past/present/future tenses, body and health, work and professions, education, food and cooking, city navigation, nature, sports, and technology. The second half deepens all of this.',ex:{f:'Har rooz pishraft mikonam. Movafagh misham.',p:'har rooz pish-RAFT mi-KO-nam · mo-VAF-fagh mi-SHAM',e:'Every day I make progress. I will succeed.'}},
    ],
    phrases:[
      {cat:'Milestone',f:'Panjah rooz Farsi yad gereftam!',p:'pan-JAH rooz far-SI yad ge-ref-TAM!',e:'I learned Farsi for fifty days!'},
      {cat:'Milestone',f:'Kheyli pishraft kardam.',p:'KHEY-li pish-RAFT kar-DAM',e:'I made a lot of progress.'},
      {cat:'Motivation',f:'Har rooz behtar misham.',p:'har rooz beh-TAR mi-SHAM',e:'Every day I get better.'},
      {cat:'Dream',f:'Royaam ravaan sohbat kardan-e.',p:'ro-YAA-am ra-VAAN soh-BAT kar-dan-e',e:'My dream is to converse fluently.'},

    convos:[{
      title:'Celebrating Day 50',scene:'Sharing your progress with your language partner',
      exchanges:[

  61:{
    grammar:[
      {title:'Warmth markers — softening everything you say',body:'Persian family speech is saturated with warmth particles. "Azizam" (my dear), "jaan" (dear, after a name: "Ali-jaan"), and "golam" (my flower) attach to almost anything and instantly soften a request or greeting. Using them marks you as family, not a stranger.',ex:{f:'Bea inja, azizam. · Ali-jaan, khoobi?',p:'bi-A in-JA, a-ZI-zam · a-LI-jaan, KHOO-bi',e:'Come here, my dear. · Ali dear, are you well?'}},
      {title:'"-etoon" — the formal/plural "your"',body:'When addressing in-laws or elders, use the formal possessive "-etoon" instead of the informal "-et". "Khoone-etoon" = your home (formal). This respect-marking matters enormously with a partner\'s parents.',ex:{f:'Khoone-etoon kheyli ghashang-e.',p:'KHOO-ne-e-TOON KHEY-li gha-SHANG-e',e:'Your home is very beautiful. (formal/respectful)'}},

  62:{
    grammar:[
      {title:'The playful negative — teasing with "na baba"',body:'"Baba" literally means "dad," but in casual speech it\'s an all-purpose particle for emphasis and disbelief, unrelated to fathers. "Na baba!" = no way!, "Ey baba" = oh come on, "Areh baba" = yeah totally. Tone carries the meaning.',ex:{f:'Na baba, jeddi migi?! · Areh baba, raast migam.',p:'na ba-BA, jed-DI mi-GI?! · a-REH ba-BA, raast mi-GAM',e:'No way, are you serious?! · Yeah totally, I\'m telling the truth.'}},
      {title:'Softening a tease with "-a" ending',body:'Adding a drawn-out "-aa" to the end of a statement makes it teasing or a gentle warning rather than harsh. "Divoone-i-aa!" lands as affectionate ribbing, not an insult. Hard to translate — it\'s all in the melody.',ex:{f:'Zeerak-i-aa! · Havaset bashe-aa!',p:'zee-RA-ki-AA · ha-VA-set BA-she-AA',e:'Aren\'t you clever! (teasing) · Watch out now! (playful warning)'}},
    ],
    phrases:[

      {cat:'Checking',f:'Jeddi?',p:'jed-DI',e:'Seriously?',note:'Pairs with "baavar nemikonam"'},
      {cat:'Affection',f:'Divoone!',p:'di-voo-NE',e:'You nut! (fondly)',note:'Said with a smile = warm'},
      {cat:'Tease',f:'Bacheh porru',p:'ba-CHE por-ROO',e:'Cheeky thing',note:'Affectionate for a bold kid'},

  63:{
    grammar:[
      {title:'Kardan — the compound-verb engine',body:'Hundreds of Farsi verbs are just a noun + "kardan" (to do/make). Learn the pattern once and you unlock them all: "kar kardan" (to work), "komak kardan" (to help), "sohbat kardan" (to talk), "bazi kardan" (to play). Conjugate only the "kardan" part.',ex:{f:'Komak mikonam. · Sohbat kardim. · Bazi nakon.',p:'ko-MAK mi-KO-nam · soh-BAT kar-DIM · ba-ZI na-KON',e:'I help. · We talked. · Don\'t play.'}},
      {title:'"Chi kaar" — the everyday "what"',body:'"Chi kaar kardan" literally means "to do what work," but functions as the ordinary way to ask what someone is doing. "Chi kaar mikoni?" is far more common in speech than the textbook "che kar mikoni?"',ex:{f:'Chi kaar mikoni? · Chi kaar kardi?',p:'chi-KAAR mi-KO-ni · chi-KAAR kar-DI',e:'What are you doing? · What did you do?'}},

  64:{

      {title:'Food-pushing grammar — the imperative of hospitality',body:'At a Persian table you\'ll be commanded to eat, constantly and lovingly. "Bokhor" (eat!), "bekesh" (serve yourself), "beriz" (pour). Refusing once is polite (tarof); accept by the second or third offer or the host will worry.',ex:{f:'Bokhor azizam! · Baaz ham bekesh.',p:'bo-KHOR a-ZI-zam · baaz ham be-KESH',e:'Eat, my dear! · Serve yourself more.'}},
      {title:'"Noosh-e jaan" — the meal blessing',body:'Said to someone eating, it means roughly "may it nourish your soul." There\'s no exact English equivalent — closest is "enjoy" or "bon appétit." If someone says it to you, simply reply "mamnoon."',ex:{f:'Noosh-e jaan! · Dast-etoon dard nakone.',p:'noo-SHE jaan · das-te-TOON dard na-KO-ne',e:'Enjoy! · Thank you for the meal. (lit: may your hands not hurt)'}},

  66:{
    grammar:[
      {title:'Interjections carry the conversation',body:'Persian reactions are quick single words that show you\'re engaged: "vaay" (wow/oh no), "eyval" (nice!), "bah bah" (delicious/lovely), "aakh" (ouch/aw). Sprinkling these makes you sound fluent even when your sentences are simple — they signal active listening.',ex:{f:'Vaay, che khoob! · Bah bah, che booyi!',p:'vaay, che KHOOB · bah bah, che BOO-yi',e:'Oh, how nice! · Mmm, what a smell!'}},
      {title:'"Che + adjective" — instant exclamations',body:'"Che" + an adjective makes an exclamation: "che ghashang!" (how pretty!), "che jaaleb!" (how interesting!), "che bad!" (how awful!). Simple, high-impact, and used constantly.',ex:{f:'Che ghashang! · Che jaaleb! · Che haal daad!',p:'che gha-SHANG · che jaa-LEB · che haal daad',e:'How pretty! · How interesting! · How fun that was!'}},
    ],
    phrases:[
      {cat:'Wow',f:'Vaay!',p:'vaay',e:'Wow! / Oh no!',note:'Positive or negative by tone'},
      {cat:'Nice',f:'Eyval!',p:'ey-VAL',e:'Nice! Well done!',note:'Slang, very common'},
      {cat:'Delicious',f:'Bah bah!',p:'bah bah',e:'Mmm! Wonderful!',note:'Food, beauty, music'},
      {cat:'Sympathy',f:'Aakh!',p:'aakh',e:'Ouch / Aw',note:'Pain or sympathy'},

  67:{
    grammar:[
      {title:'The informal command — dropping to "-o"',body:'Informal commands to one person often drop endings and use "-o" for the object: "namak-o bede" (pass the salt), "dar-o beband" (close the door). The verb takes a "be-" prefix: bebin (look), begoo (say), boro (go), bea (come).',ex:{f:'Boro, bea, begoo, bebin, beshin',p:'bo-RO, bi-A, be-GOO, be-BIN, be-SHIN',e:'go, come, say, look, sit'}},
      {title:'Negative commands with "na-"',body:'To say "don\'t," replace "be-" with "na-": "naro" (don\'t go), "nakon" (don\'t do it), "nagoo" (don\'t say). You\'ll hear these constantly, especially with kids and in playful protest.',ex:{f:'Naro! · Nakon! · Nagoo!',p:'na-RO · na-KON · na-GOO',e:'Don\'t go! · Don\'t! · Don\'t say (that)!'}},

  68:{
    grammar:[
      {title:'Endearments as everyday address',body:'Persian overflows with terms of affection used casually: "jaanam" (my soul — also how you answer when called), "azizam" (my dear), "golam" (my flower), "nafas" (my breath), "delam" (my heart). Families use them freely; they\'re warm, not romantic (except a few like "eshgham").',ex:{f:'Jaanam? · Ghorboonet beram · Fadaat besham',p:'jaa-NAM · ghor-BOO-net be-RAM · fa-DAAT be-SHAM',e:'Yes dear? · I adore you · I\'d do anything for you'}},
      {title:'"Ghorboonet beram" — sacrifice-love idioms',body:'Persian love-expression often uses hyperbolic "sacrifice" language: "ghorboonet beram" (may I be sacrificed for you), "fadaat besham" (may I be your sacrifice), "dooret begardam" (may I circle around you). They sound intense but are everyday warmth, especially from elders.',ex:{f:'Ghorboonet beram, che khoob shodi!',p:'ghor-BOO-net be-RAM, che KHOOB sho-DI',e:'Bless you, how well you\'ve done!'}},

  69:{
    grammar:[
      {title:'Tarof — the ritual of insincere offers',body:'Tarof is a system of ritual politeness where you offer, refuse, and insist multiple times. A host offers three times; a guest refuses twice, accepts on the third. A shopkeeper may say "ghaabel nadaare" (it\'s worthless / on the house) — always insist on paying. Reading tarof is essential to not offend.',ex:{f:'Ghaabel nadaare. — Na khahesh mikonam, chand-e?',p:'ghaa-BEL na-DAA-re — na KHAA-hesh mi-KO-nam, CHAN-de',e:'It\'s nothing. — No please, how much is it?'}},
      {title:'"Rodarbaayesti" — the thing tarof creates',body:'"Rodarbaayesti" is the awkward reluctance to impose or speak plainly out of politeness. "Rodarbaayesti nakon" (don\'t stand on ceremony) is what a host says to signal you\'re close enough to relax — a real marker of acceptance into the family.',ex:{f:'Ba man rodarbaayesti nakon.',p:'ba man ro-dar-baa-YES-ti na-KON',e:'Don\'t be formal with me. (we\'re close)'}},
    ],
    phrases:[
      {cat:'Tarof',f:'Ghaabel nadaare',p:'ghaa-BEL na-DAA-re',e:'It\'s nothing (on the house)',note:'Always insist on paying'},
      {cat:'Invite',f:'Befarmaid tu',p:'be-far-MAID tu',e:'Please come in',note:'Offered several times'},
      {cat:'Visit',f:'Sar behem bezan',p:'sar be-HEM be-ZAN',e:'Drop by',note:'Warm standing invite'},

      {title:'Week 14 — reading the room',body:'Reactions (vaay, eyval), commands (bea, bede, naro), endearments (jaanam, ghorboonet beram), and tarof together make up the texture of real family speech. The skill now is less about vocabulary and more about timing — knowing when to insist, when to accept, when to tease.',ex:{f:'Jaanam? Bea beshin, rodarbaayesti nakon.',p:'jaa-NAM? bi-A be-SHIN, ro-dar-baa-YES-ti na-KON',e:'Yes dear? Come sit, don\'t be formal.'}},

  71:{
    grammar:[
      {title:'Story-openers signal "listen up"',body:'Persian storytelling has ritual openers that grab attention: "midooni chi shod?" (you know what happened?), "yaadete...?" (remember when...?), "hala goosh kon" (now listen). When you hear these, a narrative is coming — lean in and react.',ex:{f:'Midooni chi shod? · Yaadete oon safar?',p:'mi-DOO-ni chi shod · yaa-DE-te oon sa-FAR',e:'You know what happened? · Remember that trip?'}},
      {title:'"Kholaase" and sequencing a tale',body:'Structure a story with "aval" (first), "baad" (then), "yekdafe/yeho" (suddenly), and "kholaase" (long story short) to wrap up. Persian stories run long and animated; "kholaase" is your polite fast-forward.',ex:{f:'Aval raftim, baad yeho baroon oomad, kholaase khis shodim.',p:'a-VAL raf-TIM, baad ye-HO ba-ROON oo-MAD, kho-LAA-se khis sho-DIM',e:'First we went, then suddenly it rained, long story short we got soaked.'}},
    ],
    phrases:[

  72:{
    grammar:[
      {title:'Khordan — "to eat," and its many idioms',body:'"Khordan" covers eating AND drinking (chai mikhoram = I drink tea). It also anchors idioms: "sarmaa khordan" (catch a cold, lit. eat cold), "ghose khordan" (worry, lit. eat sorrow), "zamin khordan" (fall down, lit. eat the ground), "takoon khordan" (to move).',ex:{f:'Ghose nakhor. · Sarmaa khordam. · Zamin khordam.',p:'ghos-SE na-KHOR · sar-MAA khor-DAM · za-MIN khor-DAM',e:'Don\'t worry. · I caught a cold. · I fell down.'}},
      {title:'Dadan — "to give," and permission',body:'"Dadan" (to give) also forms causatives and permissions: "ejaaze dadan" (to allow), "ghol dadan" (to promise), "gush dadan" (to listen). "Bede" (give!) is one of the most-heard commands at any table.',ex:{f:'Ghol midam. · Gush bede. · Ejaaze bede.',p:'ghol mi-DAM · gush be-DE · e-jaa-ZE be-DE',e:'I promise. · Listen. · Allow (me).'}},
    ],

  73:{
    grammar:[
      {title:'Softened disagreement — agree, then pivot',body:'Persian rarely disagrees head-on. The move is to validate first: "raast migi vali..." (you\'re right, but...), "dorost-e ama..." (that\'s true, however...). This preserves harmony while still making your point. Blunt "na, eshtebaah-e" (no, that\'s wrong) can feel harsh in family settings.',ex:{f:'Raast migi, vali be nazaram...',p:'raast mi-GI, va-LI be na-ZA-ram',e:'You\'re right, but in my opinion...'}},
      {title:'"Hala har chi" — the friendly truce',body:'When a small disagreement isn\'t worth continuing, "hala har chi" (anyway, whatever) closes it warmly, like a verbal shrug. It signals you\'re dropping it without conceding — keeps debates from escalating.',ex:{f:'Hala har chi, bikhial. · Bezaar fekr konam.',p:'ha-LA har chi, bi-khi-YAL · be-ZAAR fekr ko-NAM',e:'Anyway, never mind. · Let me think.'}},
    ],
    phrases:[
      {cat:'Concede',f:'Raast migi vali...',p:'raast mi-GI va-LI',e:'You\'re right, but...'},
      {cat:'Opinion',f:'Be nazaram',p:'be na-ZA-ram',e:'In my opinion'},
      {cat:'Doubt',f:'Motmaeni?',p:'mot-ma-E-ni',e:'Are you sure?'},
      {cat:'Disagree',f:'Fekr nakonam',p:'fekr na-KO-nam',e:'I don\'t think so',note:'Softer than "na"'},
      {cat:'Truce',f:'Hala har chi',p:'ha-LA har chi',e:'Anyway, whatever'},
      {cat:'Pause',f:'Bezaar fekr konam',p:'be-ZAAR fekr ko-NAM',e:'Let me think'},
    ],
    convos:[{
      title:'A gentle debate',scene:'Disagreeing about weekend plans',

        {spk:'Melinda',f:'Be nazaram shanbe berim shomaal.',p:'be na-ZA-ram sham-BE be-RIM sho-MAAL',e:'I think we should go north on Saturday.'},
        {spk:'You',f:'Raast migi, vali havaa saard-e.',p:'raast mi-GI, va-LI ha-VAA saar-DE',e:'You\'re right, but the weather\'s cold.'},
        {spk:'Melinda',f:'Motmaeni? Fekr konam khoob mishe.',p:'mot-ma-E-ni? fekr ko-NAM KHOOB mi-SHE',e:'Are you sure? I think it\'ll be nice.'},

  74:{
    grammar:[
      {title:'Casual invitations — "paye-i?"',body:'Informal plan-making uses slangy shortcuts: "paye-i?" (you in?/down?), answered "paye-am!" (I\'m in!). "Bezan berim" (let\'s roll) energizes a group into moving. Far more natural among family and friends than formal "davat mikonam."',ex:{f:'Kabob, paye-i? — Paye-am! Bezan berim.',p:'ka-BOB, paa-YE-i? — paa-YE-am! be-ZAN be-RIM',e:'Kebab, you in? — I\'m in! Let\'s go.'}},
      {title:'"Gharaare" — the planned future',body:'"Gharaare" + subjunctive verb = "it\'s arranged/supposed to." It\'s the most natural way to state plans: "gharaare biyan" (they\'re coming), "gharaare berim" (we\'re going). More idiomatic than a plain future.',ex:{f:'Gharaare hame dour ham jam beshan.',p:'gha-RAA-re ha-ME dour ham jam be-SHAN',e:'Everyone\'s supposed to gather together.'}},
    ],
    phrases:[
      {cat:'When?',f:'Kei khoobe baraat?',p:'kei KHOO-be ba-RAAT',e:'When works for you?'},

      {title:'Week 15 — narrating and negotiating life',body:'You can now tell stories (midooni chi shod, kholaase), use khordan/dadan idioms (ghose nakhor), disagree gently (raast migi vali), and make casual plans (paye-i, gharaare). This is the connective tissue of everyday family conversation — reacting, recounting, and coordinating.',ex:{f:'Midooni chi shod? Kholaase, gharaare hame biyan!',p:'mi-DOO-ni chi shod? kho-LAA-se, gha-RAA-re ha-ME bi-YAN',e:'You know what happened? Long story short, everyone\'s coming!'}},

  76:{
    grammar:[
      {title:'Persian humor — salt, not sugar',body:'In Persian, funny/charming = "ba namak" (with salt); dull/unfunny = "bi namak" (without salt). Humor idioms lean on exaggeration: "mordim az khande" (we died laughing), "rud-e bar-am pare shod" (I split my sides). Wit is prized — landing a joke earns real affection.',ex:{f:'Kheyli ba namak-i! · Mordim az khande.',p:'KHEY-li ba na-MAK-i · mor-DIM az khan-DE',e:'You\'re so funny! · We died laughing.'}},
      {title:'Warding off the jinx — "zabaanet-o gaaz begir"',body:'When someone voices something ominous, the reflex is "zabaanet-o gaaz begir!" (bite your tongue!) or "khodaa nakone" (God forbid). Persian culture is wary of jinxing good fortune by naming bad outcomes aloud.',ex:{f:'Zabaanet-o gaaz begir! · Khodaa nakone.',p:'za-BAA-net-o gaaz be-GIR · kho-DAA na-KO-ne',e:'Bite your tongue! · God forbid.'}},
    ],
    phrases:[

      {cat:'Unfunny',f:'Bi namak',p:'bi na-MAK',e:'Lame/bland',note:'Use carefully!'},

  77:{
    grammar:[
      {title:'Didan (see) & Shenidan (hear) — perception verbs',body:'"Didan" (see) and "shenidan" (hear) are irregular but essential. Past: "didam" (I saw), "shenidam" (I heard). "Shenidam ke..." (I heard that...) launches gossip; "bebin" (look/listen here) opens explanations. "Mibinamet" is a casual "see you."',ex:{f:'Didam. · Shenidam ke... · Mibinamet.',p:'di-DAM · she-ni-DAM ke · mi-BI-na-met',e:'I saw. · I heard that... · See you.'}},
      {title:'"Nemidooni chi didam!" — the hook',body:'Perception verbs power story-hooks: "nemidooni chi didam!" (you won\'t believe what I saw!), "baavaret nemishe chi shenidam" (you won\'t believe what I heard). These promise a payoff and instantly command attention.',ex:{f:'Nemidooni emrooz chi didam!',p:'ne-mi-DOO-ni em-ROOZ chi di-DAM',e:'You won\'t believe what I saw today!'}},

  78:{
    grammar:[
      {title:'Offering help — the guest\'s dilemma',body:'A good guest offers to help ("komak konam?" = shall I help?), but the host will refuse ("dast nazan, to mehmooni!" = don\'t touch, you\'re a guest!). Offer anyway — the gesture matters. Insisting gently is appreciated; actually being allowed to help means you\'re truly family.',ex:{f:'Komak konam? — Na azizam, dast nazan.',p:'ko-MAK ko-NAM? — na a-ZI-zam, dast na-ZAN',e:'Shall I help? — No dear, don\'t touch.'}},
      {title:'"Roo cheshmam" — the warmest yes',body:'When asked to do something, "roo cheshmam" (lit. "on my eye") means "with pleasure, absolutely." It\'s warmer than "baashe" (okay). "Be roo-ye cheshm" is the fuller version — maximum willingness.',ex:{f:'Roo cheshmam! · Be roo-ye cheshm.',p:'roo chesh-MAM · be roo-ye cheshm',e:'With pleasure! · Gladly, of course.'}},
    ],
    phrases:[

      {cat:'Set table',f:'Miz-o bechinam?',p:'MIZ-o be-CHI-nam',e:'Shall I set the table?'},

      {cat:'Gladly',f:'Roo cheshmam',p:'roo chesh-MAM',e:'With pleasure'},

    ],
    convos:[{

  79:{
    grammar:[
      {title:'The catch-up exchange',body:'Persian greetings go several layers deep. Beyond "chetori?" you\'ll trade "kaar-o baar chetore?" (how\'s work?), "chetor migzare?" (how\'s life?). Answers are modest: "migzare" (getting by), "shokr" (thankful), "bad nist" (not bad). Over-the-top positivity can sound boastful.',ex:{f:'Chetor migzare? — Shokr, migzare.',p:'che-TOR mig-za-RE? — shokr, mig-za-RE',e:'How\'s it going? — Thankful, getting by.'}},
      {title:'"Khaste nabaashi" — the working blessing',body:'Said to anyone working or who just finished a task: "khaste nabaashi" (may you not be tired). There\'s no English equivalent — it acknowledges effort. Reply "salaamat baashi" (may you be healthy) or "mamnoon."',ex:{f:'Khaste nabaashi! — Salaamat baashi.',p:'khas-TE na-BAA-shi — sa-laa-MAT baa-SHI',e:'Well done/take it easy! — Bless you.'}},
    ],
    phrases:[
      {cat:'Work?',f:'Kaar-o baar chetore?',p:'kaar-o baar che-TO-re',e:'How\'s work?'},
      {cat:'Life?',f:'Chetor migzare?',p:'che-TOR mig-za-RE',e:'How\'s it going?'},
      {cat:'Getting by',f:'Migzare',p:'mig-za-RE',e:'Getting by'},
      {cat:'Thankful',f:'Shokr',p:'shokr',e:'Can\'t complain',note:'Short for khodaa-ro shokr'},
      {cat:'Busy',f:'Saram sholooghe',p:'sa-RAM sho-LOO-ghe',e:'I\'m swamped'},
      {cat:'Blessing',f:'Khaste nabaashi',p:'khas-TE na-BAA-shi',e:'Take it easy / well done'},
    ],
    convos:[{
      title:'Catching up with an uncle',scene:'The layered Persian check-in',

        {spk:'You',f:'Shokr, saram sholooghe vali khoobe.',p:'shokr, sa-RAM sho-LOO-ghe va-LI KHOO-be',e:'Thankful, I\'m swamped but good.'},
        {spk:'Uncle',f:'Khaste nabaashi. Hamechi rubarah-e?',p:'khas-TE na-BAA-shi. ha-me-CHI ru-ba-RAH-e',e:'Take it easy. Everything on track?'},
        {spk:'You',f:'Salaamat baashi. Areh, shokr.',p:'sa-laa-MAT baa-SHI. a-REH, shokr',e:'Bless you. Yeah, thankfully.'},
      ]

  81:{
    grammar:[
      {title:'Proverbs — instant cultural fluency',body:'Persian is dense with "zarbolmasal" (proverbs). Dropping one at the right moment signals deep cultural comfort. They\'re often introduced with "yek zarbolmasal daarim ke mige..." (we have a saying that goes...). Learn a handful and deploy sparingly for maximum effect.',ex:{f:'Yek zarbolmasal daarim ke mige...',p:'yek zar-bol-ma-SAL DAA-rim ke mi-GE',e:'We have a saying that goes...'}},
      {title:'Reading proverbs literally vs. meaning',body:'Proverbs rarely mean their literal words. "Divaar mush daare, mush ham gush daare" (walls have mice, mice have ears) = be careful who\'s listening. Understanding the gap between image and meaning is the fun — and the skill.',ex:{f:'Kaar az mohkam-kaari eyb nemikone.',p:'kaar az moh-KAM-kaa-ri eyb ne-mi-KO-ne',e:'Better safe than sorry. (lit: solid work has no fault)'}},
    ],
    phrases:[

      {cat:'Ears',f:'Divaar mush daare',p:'di-VAAR mush DAA-re',e:'Walls have ears',note:'Someone may be listening'},
      {cat:'Safe',f:'Kaar az mohkam-kaari eyb nemikone',p:'kaar az moh-KAM-kaa-ri eyb ne-mi-KO-ne',e:'Better safe than sorry'},

  82:{
    grammar:[
      {title:'Gereftan — "to take/get," a workhorse',body:'"Gereftan" means take, get, receive, catch, hold — and anchors many compounds: "yaad gereftan" (to learn), "tamaas gereftan" (to contact), "tahvil gereftan" (to receive/pick up), "jashn gereftan" (to celebrate), "aks gereftan" (to take a photo).',ex:{f:'Yaad gereftam. · Tamaas migiram. · Aks begirim!',p:'yaad ge-ref-TAM · ta-MAAS mi-GI-ram · aks be-GI-rim',e:'I learned. · I\'ll call. · Let\'s take a photo!'}},
      {title:'"Begir" — take it! (and hold on)',body:'"Begir" (take/catch!) is handed out constantly — with food, gifts, phones, babies. "Bagir bagir!" doubles for urgency. "Nagir" = don\'t take/catch. The verb is also used for "holding" a position or line.',ex:{f:'Begir, maal-e to. · Nagir, dast-et kesif-e.',p:'be-GIR, maa-LE to · na-GIR, das-TET ke-SIF-e',e:'Take it, it\'s yours. · Don\'t take it, your hand\'s dirty.'}},
