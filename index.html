  83:{
    grammar:[
      {title:'Phone Farsi — its own mini-dialect',body:'Calls open with "alo?" (only on the phone) or formal "befarmaid?" Voice checks: "sedaat miaad?" (can you hear me?), "sedaat nemiaad" (you\'re breaking up), "ghat shod" (call dropped). Never "salaam" as the very first word on a call — "alo" comes first.',ex:{f:'Alo? Sedaam miaad? · Ghat shod, dobaare zang mizanam.',p:'a-LO? se-DAAM mi-AAD? · ghat shod, do-BAA-re zang mi-ZA-nam',e:'Hello? Can you hear me? · It dropped, I\'ll call again.'}},
      {title:'The mandatory call-ending ritual',body:'Persian calls don\'t just end — they close with "be hame salaam beresoon" (say hi to everyone), answered "hatman" (definitely). Then warm sign-offs: "ghorboonet," "movaazeb khodet baash" (take care). Skipping this feels abrupt.',ex:{f:'Be hame salaam beresoon. — Hatman, ghorboonet.',p:'be ha-ME sa-LAAM be-re-SOON — hat-MAN, ghor-BOO-net',e:'Say hi to everyone. — Definitely, bless you.'}},
    ],
    phrases:[
      {cat:'Answer',f:'Alo?',p:'a-LO',e:'Hello? (phone only)'},
      {cat:'Hear me?',f:'Sedaat miaad?',p:'se-DAAT mi-AAD',e:'Can you hear me?'},
      {cat:'Breaking up',f:'Sedaat nemiaad',p:'se-DAAT ne-mi-AAD',e:'You\'re breaking up'},
      {cat:'Dropped',f:'Ghat shod',p:'ghat shod',e:'The call dropped'},
      {cat:'Greetings',f:'Be hame salaam beresoon',p:'be ha-ME sa-LAAM be-re-SOON',e:'Say hi to everyone'},
      {cat:'Take care',f:'Movaazeb khodet baash',p:'mo-VAA-zeb kho-DET baash',e:'Take care of yourself'},
    ],
    convos:[{
      title:'A quick call home',scene:'Calling Melinda\'s parents to check in',
      exchanges:[
        {spk:'Her mother',f:'Alo? Salaam pesaram!',p:'a-LO? sa-LAAM pe-SA-ram',e:'Hello? Hi son!'},
        {spk:'You',f:'Salaam! Sedaatoon miaad? Khoob hastid?',p:'sa-LAAM! se-DAA-toon mi-AAD? KHOOB has-TID',e:'Hi! Can I hear you? Are you well?'},
        {spk:'Her mother',f:'Shokr azizam. Kei miaayn pishemoon?',p:'shokr a-ZI-zam. kei mi-AAYN pi-she-MOON',e:'Thankful dear. When are you coming to us?'},
        {spk:'You',f:'Zoodi. Be hame salaam beresoonid.',p:'zoo-DI. be ha-ME sa-LAAM be-re-soo-NID',e:'Soon. Say hi to everyone.'},
        {spk:'Her mother',f:'Hatman. Movaazeb khodet baash, ghorboonet.',p:'hat-MAN. mo-VAA-zeb kho-DET baash, ghor-BOO-net',e:'Definitely. Take care, bless you.'},
      ]
    }],

  84:{
    grammar:[
      {title:'Emotions with "del" (heart)',body:'A huge share of Persian emotion idioms use "del" (heart): "delam tang shode" (I miss/heart is tight), "delam gerefte" (I\'m down), "del-am mikhaad" (I\'d love to), "delam shekast" (my heart broke), "del-daar" (comforting). The heart is where feeling lives, grammatically.',ex:{f:'Delam baraat tang shode. · Delam gerefte.',p:'de-LAM ba-RAAT tang sho-DE · de-LAM ge-ref-TE',e:'I miss you. · I\'m feeling down.'}},
      {title:'"-am shod" — becoming a feeling',body:'Many feelings are expressed as "X shodam" (I became X): "khoshhaal shodam" (I got happy), "naaraahat shodam" (I got upset), "zogh zade shodam" (I got excited). The change-of-state framing is more natural than a static "I am X."',ex:{f:'Khoshhaal shodam. · Naaraahat nasho.',p:'khosh-HAAL sho-DAM · naa-raa-HAT na-SHO',e:'I got happy. · Don\'t get upset.'}},
    ],
    phrases:[
      {cat:'Miss you',f:'Delam baraat tang shode',p:'de-LAM ba-RAAT tang sho-DE',e:'I\'ve missed you'},
      {cat:'Down',f:'Delam gerefte',p:'de-LAM ge-ref-TE',e:'I\'m feeling low'},
      {cat:'Bored',f:'Hoselam sar rafte',p:'ho-se-LAM sar raf-TE',e:'I\'m so bored'},
      {cat:'Excited',f:'Zogh zade shodam',p:'zogh za-DE sho-DAM',e:'I got so excited'},
      {cat:'Don\'t be upset',f:'Naaraahat nasho',p:'naa-raa-HAT na-SHO',e:'Don\'t get upset'},
      {cat:'Blessing',f:'Zende bashi',p:'zen-DE baa-SHI',e:'Bless you (thanks)'},
    ],
    convos:[{
      title:'A heartfelt reunion',scene:'Video-calling family after months apart',
      exchanges:[
        {spk:'Her mother',f:'Salaam azizam, delam baraat tang shode bood!',p:'sa-LAAM a-ZI-zam, de-LAM ba-RAAT tang sho-DE bood',e:'Hi dear, I\'d missed you!'},
        {spk:'You',f:'Man bishtar! Zogh zade shodam didametoon.',p:'man BISH-tar! zogh za-DE sho-DAM di-DA-me-TOON',e:'Me more! I got excited seeing you.'},
        {spk:'Her mother',f:'Zende bashi. Kei miaayn?',p:'zen-DE baa-SHI. kei mi-AAYN',e:'Bless you. When are you coming?'},

  86:{

      {title:'Norooz — the vocabulary of renewal',body:'Persian New Year (Norooz, ~March 21) has its own lexicon: "haft-seen" (the seven-S table), "sabze" (sprouts), "eydi" (gift money), "saal tahvil" (the turn-of-year moment), "did-o baazdid" (rounds of visits). Greetings: "eyd-etoon mobaarak" / "saal-e no mobaarak."',ex:{f:'Saal-e no mobaarak! Eydi-ye man koo?',p:'saa-LE no mo-baa-RAK! ey-DI-ye man koo',e:'Happy New Year! Where\'s my eydi?'}},

  87:{

      {title:'Shodan — "to become / to happen"',body:'"Shodan" is a shape-shifter: "become" (bozorg shodam = I grew up), "happen" (chi shod? = what happened?), and possibility (mishe? = is it possible/OK?). "Mishe...?" is THE polite request opener; "nemishe" = no can do; "dorost mishe" = it\'ll work out.',ex:{f:'Mishe komak koni? · Chi shod? · Dorost mishe.',p:'mi-SHE ko-MAK ko-NI? · chi shod? · do-ROST mi-SHE',e:'Could you help? · What happened? · It\'ll work out.'}},
      {title:'"Mishe" as the universal request softener',body:'Starting a request with "mishe...?" (is it possible that...?) makes it polite in any register. "Mishe lotfan panjare ro baaz koni?" (could you please open the window?). It\'s the single most useful politeness frame after "lotfan."',ex:{f:'Mishe ye kaari baraam koni?',p:'mi-SHE ye KAA-ri ba-RAAM ko-NI',e:'Could you do something for me?'}},
    ],
    phrases:[

  88:{

      {title:'Wedding vocabulary — aroosi season',body:'Weddings ("aroosi") have rich vocabulary: "aroos" (bride), "daamaad" (groom — also son-in-law!), "sofre-ye aghd" (ceremony spread), "aghd" (the contract), "aroosi" (the party). Blessings fly: "mobaarak baashe," "be paaye ham pir shid" (may you grow old together).',ex:{f:'Mobaarak baashe! Be paaye ham pir shid.',p:'mo-baa-RAK baa-SHE! be paa-YE ham pir shid',e:'Congratulations! May you grow old together.'}},

  89:{
    grammar:[
      {title:'Guest etiquette — the unwritten rules',body:'Never arrive empty-handed ("dast-e khaali"); bring "sheerini" (sweets), fruit, or flowers. Ask "kafsh dar biaaram?" (shoes off?) at the door. The exit is a slow ritual: "kam kam berim" (we should get going) announced well before actually leaving.',ex:{f:'Dast-e khaali nemiram. · Dige kam kam berim.',p:'das-TE khaa-LI ne-mi-RAM · di-GE kam kam be-RIM',e:'I won\'t go empty-handed. · We should slowly get going.'}},
      {title:'"Mozaahem shodim" — the polite exit',body:'On leaving, guests say "mozaahem shodim" (we\'ve imposed) — the host protests "mozaahem chie! Mehmoon-e ma-id" (nonsense, you\'re our guests). The check battle ("bezaar man hesaab konam") is also mandatory; losing gracefully to an elder is acceptable.',ex:{f:'Mozaahem shodim. — Mozaahem chie, baaz ham biyaayn!',p:'mo-zaa-HEM sho-DIM — mo-zaa-HEM chie, baaz ham bi-YAAYN',e:'We\'ve imposed. — Nonsense, come again!'}},
    ],
    phrases:[
      {cat:'Gift',f:'Sheerini',p:'shee-ri-NI',e:'Sweets (guest gift)'},
      {cat:'Not empty-handed',f:'Dast-e khaali nemiram',p:'das-TE khaa-LI ne-mi-RAM',e:'I won\'t go empty-handed'},
      {cat:'Shoes?',f:'Kafsh dar biaaram?',p:'kafsh dar bi-YAA-ram',e:'Shoes off?'},
      {cat:'I\'ll pay',f:'Bezaar man hesaab konam',p:'be-ZAAR man he-SAAB ko-NAM',e:'Let me pay'},
      {cat:'Getting going',f:'Dige kam kam berim',p:'di-GE kam kam be-RIM',e:'We should get going'},
      {cat:'We imposed',f:'Mozaahem shodim',p:'mo-zaa-HEM sho-DIM',e:'We\'ve imposed'},
    ],
    convos:[{
      title:'Leaving a gathering',scene:'The slow, warm Persian goodbye',
      exchanges:[
        {spk:'You',f:'Kheyli khosh gozasht, dige kam kam berim.',p:'KHEY-li khosh go-ZASHT, di-GE kam kam be-RIM',e:'We had a great time, we should get going.'},
        {spk:'Host',f:'Vaa, hala koja? Zoode!',p:'vaa, ha-LA ko-JA? zoo-DE',e:'Oh, where to now? It\'s early!'},
        {spk:'You',f:'Mozaahem shodim, dast-e shomaa dard nakone.',p:'mo-zaa-HEM sho-DIM, das-TE sho-MAA dard na-KO-ne',e:'We\'ve imposed, thank you so much.'},

  91:{
    grammar:[
      {title:'Errand shorthand — "sar-e raah" and "yek sar"',body:'Everyday logistics run on compact phrases. "Sar-e raah" (on the way) tacks a task onto a trip: "sar-e raah nun bekhar" (grab bread on the way). "Yek sar miram" = I\'ll pop over quickly. "Kaar daaram" = I have things to do / I\'m busy.',ex:{f:'Sar-e raah nun bekhar. · Yek sar miram baazaar.',p:'sar-e RAAH nun be-KHAR · yek sar mi-RAM baa-ZAAR',e:'Grab bread on the way. · I\'ll pop to the market.'}},
      {title:'"Baraam migiri?" — the favor ask',body:'"Baraam" (for me) + a verb makes a casual favor: "baraam migiri?" (can you get it for me?), "baraam mikhari?" (can you buy it for me?). Before heading out, the polite thing is "chizi mikhaay?" (need anything?).',ex:{f:'Chizi mikhaay? · Baraam migiri?',p:'chi-ZI mi-KHAAY · ba-RAAM mi-GI-ri',e:'Do you need anything? · Can you get it for me?'}},

  92:{

      {title:'Banking basics — variz vs. bardaasht',body:'Two opposite directions: "variz" (deposit/transfer in) and "bardaasht" (withdrawal out). "Hesaab" = account, "kaart" = card, "ramz" = PIN, "maande" = balance. Compound with "kardan": "variz konam" (I deposit), "bardaasht konam" (I withdraw).',ex:{f:'Pool variz konam. · Az hesaab bardaasht konam.',p:'pool va-RIZ ko-NAM · az he-SAAB bar-DAASHT ko-NAM',e:'I\'ll deposit money. · I\'ll withdraw from the account.'}},
      {title:'"Kaar nemikone" — universal malfunction',body:'Anything broken "kaar nemikone" (doesn\'t work): the card, the ATM, the app, the plan. It\'s the go-to complaint. "Ramz-o eshtebaah zadam" = I entered the PIN wrong.',ex:{f:'Kaart-am kaar nemikone. · Dastgaah kharaab-e.',p:'kaar-TAM kaar ne-mi-KO-ne · dast-GAAH kha-RAAB-e',e:'My card isn\'t working. · The machine is broken.'}},

  94:{
    grammar:[
      {title:'Appointments — vaght and nobat',body:'"Vaght gereftan" = to book an appointment ("vaght migiram" = I\'ll book). "Nobat" = turn/slot ("nobat-e shomast" = it\'s your turn). Reschedule: "aghab andaakhtan" (postpone), "jelo andaakhtan" (move up), "kensel/laghv kardan" (cancel).',ex:{f:'Vaght migiram. · Nobat-e shomast. · Aghab bendaazam.',p:'vaght mi-GI-ram · no-BA-te sho-MAST · a-GHAB ben-DAA-zam',e:'I\'ll book. · It\'s your turn. · Let me postpone it.'}},
      {title:'"Kei aazaad-in?" — coordinating time',body:'"Aazaad" = free/available. "Kei aazaad-in?" (when are you free?) coordinates any meeting. "Taid mikonam" = I confirm. "Vaght daari?" (do you have time?) is the casual version.',ex:{f:'Kei aazaad-in? · Taid mikonam.',p:'kei aa-ZAA-din · ta-ID mi-KO-nam',e:'When are you free? · I confirm.'}},
    ],
    phrases:[
      {cat:'Appointment',f:'Vaght migiram',p:'vaght mi-GI-ram',e:'I\'ll book an appointment'},
      {cat:'Your turn',f:'Nobat-e shomast',p:'no-BA-te sho-MAST',e:'It\'s your turn'},

  96:{
    grammar:[
      {title:'Naming a problem calmly',body:'"Moshkel" = problem. "Moshkel pish oomad" = a problem came up. State issues plainly: "kaar nemikone" (not working), "kharaab shode" (broken), "gom shode" (lost). Then ask "chi kaar konam?" (what should I do?) or "dorostesh mikonid?" (can you fix it?).',ex:{f:'Yek moshkel pish oomad. · Dorostesh mikonid?',p:'yek mosh-KEL pish oo-MAD · do-ROS-tesh mi-KO-nid',e:'A problem came up. · Can you fix it?'}},
      {title:'"Gom shode" vs "kharaab shode"',body:'"Gom shode" = it\'s lost (missing). "Kharaab shode" = it\'s broken (malfunctioning). Both use "shode" (has become). "Komak mikhaam" = I need help — direct and fine to say.',ex:{f:'Gooshim gom shode. · Maashinam kharaab shode.',p:'goo-SHIM gom sho-DE · maa-SHI-nam kha-RAAB sho-DE',e:'My phone is lost. · My car broke down.'}},

  97:{
    grammar:[
      {title:'Complaints — soft first, firm if needed',body:'Persian complaint etiquette starts gentle: "dorost nist" (this isn\'t right), "mishe check konid?" (could you check?). "Eshtebaah shode" (a mistake was made) assigns no blame — graceful. Escalate only if needed: "ghabool nist" (unacceptable), "pool-am-o pas bedid" (refund me).',ex:{f:'Dorost nist, mishe check konid? · Eshtebaah shode.',p:'do-ROST nist, mi-SHE chek ko-NID · esh-te-BAAH sho-DE',e:'This isn\'t right, could you check? · A mistake was made.'}},
      {title:'"Mishe lotfan...?" — polite requests',body:'"Mishe lotfan...?" (could you please...?) is the most useful request frame. "Mishe lotfan yeki dige biyaarid?" (could you bring another?). Combine with "entezaar daaram" (I expect / I\'ve been waiting) to note a delay politely.',ex:{f:'Mishe lotfan avaz-esh konid?',p:'mi-SHE LOT-fan a-VA-zesh ko-NID',e:'Could you please replace it?'}},
    ],
    phrases:[

      {cat:'Unacceptable',f:'Ghabool nist',p:'gha-BOOL nist',e:'This is unacceptable'},

    ],

  98:{
    grammar:[
      {title:'Apologies — bebakhshid vs. moteassefam',body:'"Bebakhshid" = excuse me / sorry (light: bumps, getting attention). "Moteassefam" = I\'m sorry (sincere, deeper). Take responsibility: "taghsir-e man bood" (it was my fault), "ghasd nadaashtam" (I didn\'t mean to).',ex:{f:'Moteassefam, taghsir-e man bood.',p:'mo-te-AS-se-fam, tagh-SI-re man bood',e:'I\'m sorry, it was my fault.'}},
      {title:'Forgiving — "eshkaal nadaare"',body:'To wave off an apology: "eshkaal nadaare" (no problem), "moshkeli nist" (it\'s fine), "faramoosh kon" (forget it). "Baa ham khoob-im" = we\'re good. Persian values quick, warm reconciliation.',ex:{f:'Eshkaal nadaare, faramoosh kon.',p:'esh-KAAL na-DAA-re, fa-ra-MOOSH kon',e:'No problem, forget it.'}},
    ],
    phrases:[
      {cat:'Sorry (light)',f:'Bebakhshid',p:'be-BAKH-shid',e:'Excuse me / sorry'},

      {cat:'Didn\'t mean to',f:'Ghasd nadaashtam',p:'ghasd na-DAASH-tam',e:'I didn\'t mean to'},
      {cat:'No worries',f:'Eshkaal nadaare',p:'esh-KAAL na-DAA-re',e:'It\'s no problem'},
      {cat:'Forget it',f:'Faramoosh kon',p:'fa-ra-MOOSH kon',e:'Let it go'},
    ],
    convos:[{

        {spk:'Friend',f:'Faramoosh kon, baa ham khoob-im.',p:'fa-ra-MOOSH kon, baa ham KHOO-bim',e:'Forget it, we\'re good.'},

  99:{
    grammar:[
      {title:'Tavaanestan — "can / to be able"',body:'"Mitunam" (I can), "nemitunam" (I can\'t) — spoken forms of tavaanestan. Always followed by a subjunctive verb: "mitunam biyam" (I can come), "mituni komak koni?" (can you help?). Past "mitunestam" often means "I could have."',ex:{f:'Mituni komak koni? · Nemitunam biyam.',p:'mi-TOO-ni ko-MAK ko-NI · ne-mi-TOO-nam bi-YAM',e:'Can you help? · I can\'t come.'}},
      {title:'"Betunam" — the subjunctive of can',body:'After "ke" (so that) or in wishes, use "betunam": "zang mizanam ke betunim hamaahang konim" (I\'ll call so we can coordinate). "Kaash mitunestam" = I wish I could.',ex:{f:'Kaash mitunestam biyam.',p:'kaash mi-too-NES-tam bi-YAM',e:'I wish I could come.'}},
    ],
    phrases:[
      {cat:'I can',f:'Mitunam',p:'mi-TOO-nam',e:'I can'},

      {cat:'Could have',f:'Mitunesti',p:'mi-too-NES-ti',e:'You could have'},
      {cat:'So I can',f:'Betunam',p:'be-TOO-nam',e:'(so that) I can'},
      {cat:'Wish I could',f:'Kaash mitunestam',p:'kaash mi-too-NES-tam',e:'I wish I could'},
    ],

  100:{

      {title:'Day 100 — expressing pride and momentum',body:'Milestone language: "baavaram nemishe" (I can\'t believe it), "eftekhaar mikonam" (I\'m proud), "az pas-esh baraamiyam" (I can handle it), "adaame midam" (I\'ll keep going). These are the phrases of self-encouragement — worth internalizing.',ex:{f:'Sad rooz shod, baavaram nemishe!',p:'sad rooz shod, BAA-va-ram ne-mi-SHE',e:'It\'s been 100 days, I can\'t believe it!'}},

  101:{
    grammar:[
      {title:'Conditionals — "age... , ...mikonam"',body:'"Age" (spoken "agar," = if) sets up a condition; the result clause follows. Real conditions use present/present: "age biyaay, shaam dorost mikonam" (if you come, I\'ll cook). The if-clause verb is often subjunctive: "age biyaay" (if you come).',ex:{f:'Age vaght daashti, zang bezan.',p:'a-ge vaght DAASH-ti, zang be-ZAN',e:'If you have time, call.'}},
      {title:'"Vagarna" and "dar in soorat"',body:'"Vagarna" = otherwise / or else: "zood biyaa, vagarna dir mishe" (come early, otherwise it\'ll be late). "Dar in soorat" = in that case. "Be shart-e inke" = on condition that.',ex:{f:'Zood biyaa, vagarna miram.',p:'zood bi-YAA, va-gar-NA mi-RAM',e:'Come early, otherwise I\'ll leave.'}},
    ],
    phrases:[
      {cat:'If',f:'Age',p:'a-GE',e:'If (spoken)'},
      {cat:'If you come',f:'Age biyaay',p:'a-GE bi-YAAY',e:'If you come'},
      {cat:'Otherwise',f:'Vagarna',p:'va-gar-NA',e:'Otherwise / or else'},
      {cat:'In that case',f:'Dar in soorat',p:'dar in soo-RAT',e:'In that case'},
      {cat:'On condition',f:'Be shart-e inke',p:'be shar-TE in-ke',e:'On condition that'},
      {cat:'What if?',f:'Chi mishe age...?',p:'chi mi-SHE a-ge',e:'What happens if...?'},
    ],
    convos:[{
      title:'Making a plan with conditions',scene:'Negotiating the evening',
      exchanges:[
        {spk:'Melinda',f:'Age zood biyaay khoone, shaam dorost mikonam.',p:'a-ge zood bi-YAAY KHOO-ne, shaam do-ROST mi-KO-nam',e:'If you come home early, I\'ll cook dinner.'},
        {spk:'You',f:'Baashe, vali age kaar toolaani shod chi?',p:'BAA-she, va-LI a-ge kaar too-laa-NI shod chi',e:'Okay, but what if work runs long?'},
        {spk:'Melinda',f:'Dar in soorat biroon mikhorim.',p:'dar in soo-RAT bi-ROON mi-KHO-rim',e:'In that case we\'ll eat out.'},
        {spk:'You',f:'Ghabool, be shart-e inke to entekhaab koni.',p:'gha-BOOL, be shar-TE in-ke to en-te-KHAAB ko-NI',e:'Deal, on condition that you choose.'},
      ]
    }],
    verbs:[],
  },
  102:{
    grammar:[
      {title:'Reported speech — "goft ke..."',body:'To relay what someone said, use "goft ke..." (said that). The reported clause keeps normal order: "goft ke dir miyaad" (said he\'s coming late). "Behem goft" = told me. "Porsid ke" = asked whether. "Ghol daad" = promised.',ex:{f:'Goft ke miyaad. · Behem goft negaraan nabaasham.',p:'goft ke mi-YAD · be-HEM goft ne-ga-RAAN na-BAA-sham',e:'Said he\'s coming. · Told me not to worry.'}},
      {title:'"Shenidam migan" — hearsay',body:'"Shenidam migan..." (I heard they say...) reports rumor. "Mige ke" = says that. Reported speech is the backbone of family updates: who said what, who promised what.',ex:{f:'Shenidam migan khoone kharidan.',p:'she-ni-DAM mi-GAN KHOO-ne kha-ri-DAN',e:'I heard they say they bought a house.'}},
    ],
    phrases:[
      {cat:'Said that',f:'Goft ke',p:'goft ke',e:'Said that'},
      {cat:'Told me',f:'Behem goft',p:'be-HEM goft',e:'Told me'},
      {cat:'Asked',f:'Porsid ke',p:'por-SID ke',e:'Asked whether'},
      {cat:'Promised',f:'Ghol daad',p:'ghol daad',e:'Promised'},
      {cat:'Says that',f:'Mige ke',p:'mi-GE ke',e:'Says that'},
      {cat:'Hearsay',f:'Shenidam migan',p:'she-ni-DAM mi-GAN',e:'I heard they say'},
    ],
    convos:[{
      title:'Passing on a message',scene:'Relaying what her dad said',
      exchanges:[
        {spk:'Melinda',f:'Baabaam chi goft?',p:'baa-BAAM chi goft',e:'What did my dad say?'},
        {spk:'You',f:'Goft ke farda hame miyan inja.',p:'goft ke far-DA ha-ME mi-YAN in-JA',e:'He said everyone\'s coming here tomorrow.'},
        {spk:'Melinda',f:'Chizi dige nagoft?',p:'chi-ZI di-GE na-GOFT',e:'Didn\'t he say anything else?'},
        {spk:'You',f:'Ghol daad ke shaam biyaare.',p:'ghol daad ke shaam bi-YAA-re',e:'He promised to bring dinner.'},
      ]
    }],
    verbs:[],
  },
  103:{
    grammar:[
      {title:'Navigation — turns and landmarks',body:'"Mostaghim" (straight), "bepich" (turn), "dast-e raast/chap" (right/left), "sar-e chaharaah" (at the intersection). "Rad shodi" (you passed it), "bargard" (go back), "nazdik-e" (it\'s near), "door-e" (it\'s far).',ex:{f:'Mostaghim boro, sar-e chaharaah bepich.',p:'mos-ta-GHIM bo-RO, sar-e cha-haar-RAAH be-PICH',e:'Go straight, turn at the intersection.'}},
      {title:'Giving distance and reassurance',body:'"Cheghadr rah-e?" (how far?). Answers: "nazdik-e" (close), "panj daghighe" (five minutes), "piyaade" (on foot). "Rad shodi" warns you\'ve overshot.',ex:{f:'Nazdik-e, panj daghighe piyaade.',p:'naz-DI-ke, panj da-GHI-ghe pi-YAA-de',e:'It\'s close, five minutes on foot.'}},
    ],
    phrases:[
      {cat:'Straight',f:'Mostaghim',p:'mos-ta-GHIM',e:'Straight ahead'},
      {cat:'Turn',f:'Bepich',p:'be-PICH',e:'Turn'},
      {cat:'Right/Left',f:'Dast-e raast / chap',p:'das-te RAAST / CHAP',e:'Right / Left'},
      {cat:'Intersection',f:'Sar-e chaharaah',p:'sar-e cha-haar-RAAH',e:'At the intersection'},
      {cat:'Passed it',f:'Rad shodi',p:'rad sho-DI',e:'You passed it'},
      {cat:'It\'s near',f:'Nazdik-e',p:'naz-DI-ke',e:'It\'s close'},
    ],
    convos:[{
      title:'Guiding a driver',scene:'Directing a taxi to your destination',
      exchanges:[
        {spk:'Driver',f:'Az koja beram?',p:'az ko-JA be-RAM',e:'Which way should I go?'},
        {spk:'You',f:'Mostaghim, ta sar-e chaharaah.',p:'mos-ta-GHIM, ta sar-e cha-haar-RAAH',e:'Straight, to the intersection.'},
        {spk:'You',f:'Oonja dast-e raast bepich.',p:'oon-JA das-te RAAST be-PICH',e:'Turn right there.'},
        {spk:'Driver',f:'Inja?',p:'in-JA',e:'Here?'},
        {spk:'You',f:'Rad shodi, kami bargard. Nazdik-e.',p:'rad sho-DI, ka-MI bar-GARD. naz-DI-ke',e:'You passed it, back up a bit. It\'s close.'},
      ]
    }],
    verbs:[],
  },
  104:{
    grammar:[
      {title:'Bargaining — the price dance',body:'"Chand-e?" (how much?), "geroone" (it\'s expensive), "arzoon-tar nemishe?" (can\'t it be cheaper?), "takhfif" (discount), "aakharesh chand?" (best price?). "Beserfe" = it\'s worth it. Paying cash ("naghdi") often earns a discount.',ex:{f:'Geroone, takhfif nadaarid? · Aakharesh chand?',p:'ge-ROO-ne, takh-FIF na-DAA-rid · AA-kha-resh chand',e:'It\'s pricey, no discount? · Best price?'}},
      {title:'Comparatives with "-tar"',body:'Add "-tar" for "more": "arzoon-tar" (cheaper), "behtar" (better), "bozorg-tar" (bigger). "Arzoon-tar nemishe?" uses shodan: "can\'t it become cheaper?" — the classic haggle.',ex:{f:'Yek kam arzoon-tar konid.',p:'yek kam ar-ZOON-tar ko-NID',e:'Make it a little cheaper.'}},

  106:{
    grammar:[
      {title:'Taxi Farsi — darbast and stops',body:'"Darbast" = private hire (whole taxi to yourself), vs. shared "savaari." "Negah daar" (stop!), "piyaade misham" (I\'ll get off), "keraaye" (fare). "Doresh bezan" = go around it. Iranian taxis often negotiate before the ride.',ex:{f:'Darbast miram. · Haminjaa negah daar.',p:'dar-BAST mi-RAM · ha-min-JAA ne-GAH daar',e:'I\'m going private. · Stop right here.'}},
      {title:'"Kojaa piyaade mishid?" — the driver\'s question',body:'Drivers ask "kojaa piyaade mishid?" (where do you get off?). "Piyaade shodan" = to get off/out. "Cheghadr rah-e?" = how far is it? Answer stops clearly to avoid overshooting.',ex:{f:'Sar-e chaharaah piyaade misham.',p:'sar-e cha-haar-RAAH pi-YAA-de mi-SHAM',e:'I\'ll get off at the intersection.'}},

  107:{
    grammar:[
      {title:'Khaastan — "to want / to intend"',body:'"Mikhaam" (I want) + subjunctive: "mikhaam beram" (I want to go). Past "mikhaastam" = I wanted / was going to. "Delam mikhaad" (my heart wants) = I\'d love to — warmer than plain wanting.',ex:{f:'Mikhaam beram. · Delam mikhaad bemoonam.',p:'mi-KHAAM be-RAM · de-LAM mi-KHAAD be-MOO-nam',e:'I want to go. · I\'d love to stay.'}},
      {title:'"Har chi bekhaay" — whatever you want',body:'After "har chi" (whatever), use subjunctive: "har chi bekhaay" (whatever you want). "Mikhaastam... vali..." introduces an unfulfilled intention: "I was going to... but..."',ex:{f:'Har chi bekhaay baraat migiram.',p:'har chi be-KHAAY ba-RAAT mi-GI-ram',e:'Whatever you want, I\'ll get you.'}},
    ],
    phrases:[

  108:{
    grammar:[
      {title:'The future — "gharaare" and present-as-future',body:'Spoken Farsi often uses the present for the future, or "gharaare" (it\'s planned to) + subjunctive: "gharaare berim" (we\'re going to go). "Be zoodi" (soon), "dar aayande" (in the future), "barnaame daaram" (I have plans).',ex:{f:'Gharaare khoone bekharim. · Be zoodi mibinamet.',p:'gha-RAA-re KHOO-ne be-kha-RIM · be zoo-DI mi-BI-na-met',e:'We\'re going to buy a house. · See you soon.'}},
      {title:'"Taa haalaa" — up to now',body:'"Taa haalaa" (so far / up to now) + past = experience through the present: "taa haalaa Iran narftam" (so far I haven\'t been to Iran). Pairs naturally with reflection on plans.',ex:{f:'Taa haalaa nashode, vali gharaare beshe.',p:'taa HAA-laa na-sho-DE, va-LI gha-RAA-re be-SHE',e:'It hasn\'t happened yet, but it\'s planned to.'}},

  109:{
    grammar:[
      {title:'Fast speech — how words collapse',body:'Real speech contracts. "Che towr hasti" → "chetori" (how are you), "kojaa hasti" → "kojaayi" (where are you), "che kaar mikoni" → "chikaar mikoni" (what are you doing). The "hasti" often becomes a "-yi" ending. Recognizing these unlocks native-speed listening.',ex:{f:'Chetori? Kojaayi? Chikaar mikoni?',p:'che-TO-ri · ko-JAA-yi · chi-KAAR mi-KO-ni',e:'How are you? Where are you? What are you doing?'}},
      {title:'"Ye" and dropped syllables',body:'"Yek" → "ye" (a/one), "yek lahze" → "ye lahze" (one sec). Speakers drop and blur constantly: "mikhaay biyaay?" (wanna come?) runs together. Listen for rhythm, not textbook clarity.',ex:{f:'Ye lahze sabr kon. · Bikaaram, biyaam?',p:'ye lah-ZE sabr kon · bi-KAA-ram, bi-YAAM',e:'Wait one sec. · I\'m free, should I come?'}},
    ],
    phrases:[
      {cat:'How are you?',f:'Chetori?',p:'che-TO-ri',e:'How are you?'},
      {cat:'Where are you?',f:'Kojaayi?',p:'ko-JAA-yi',e:'Where are you?'},
      {cat:'Doing what?',f:'Chikaar mikoni?',p:'chi-KAAR mi-KO-ni',e:'What are you doing?'},
      {cat:'One sec',f:'Ye lahze',p:'ye lah-ZE',e:'One sec'},
      {cat:'I\'m free',f:'Bikaaram',p:'bi-KAA-ram',e:'I\'m free / idle'},
      {cat:'Wanna come?',f:'Mikhaay biyaay?',p:'mi-KHAAY bi-YAAY',e:'Wanna come?'},

  111:{
    grammar:[
      {title:'Nuanced feelings — beyond happy/sad',body:'"Kalaafe" (frustrated/fed up), "delkhor" (hurt feelings), "zogh" (thrilled), "aaroom" (calm/relieved). Framed with "shodam" (I became): "kalaafe shodam" (I got frustrated), "aaroom shodam" (I felt relieved). "Az bas..." = from so much...',ex:{f:'Kalaafe shodam az bas montazer moondam.',p:'ka-LAA-fe sho-DAM az bas mon-ta-ZER moon-DAM',e:'I got frustrated from waiting so long.'}},
      {title:'"Delkhor" — the gentle hurt',body:'"Delkhor shodam" = my feelings got hurt (soft, not angry). Distinct from "asabaani" (angry). "Zogh daaram" = I\'m excited/eager. These let you name feelings precisely rather than just "khoob/bad."',ex:{f:'Delkhor nasho, ghasd nadaashtam.',p:'del-KHOR na-SHO, ghasd na-DAASH-tam',e:'Don\'t be hurt, I didn\'t mean it.'}},
    ],
    phrases:[
      {cat:'Frustrated',f:'Kalaafe-am',p:'ka-LAA-fe-am',e:'I\'m frustrated'},
      {cat:'Hurt',f:'Delkhor shodam',p:'del-KHOR sho-DAM',e:'My feelings got hurt'},
      {cat:'Relieved',f:'Aaroom shodam',p:'aa-ROOM sho-DAM',e:'I felt relieved'},
      {cat:'Thrilled',f:'Zogh daaram',p:'zogh DAA-ram',e:'I\'m excited'},
      {cat:'From so much',f:'Az bas',p:'az bas',e:'From so much...'},
    ],
    convos:[{
      title:'Talking through a feeling',scene:'A heart-to-heart',

        {spk:'Melinda',f:'Aaroom baash, tamoom shod dige.',p:'aa-ROOM baash, ta-MOOM shod di-GE',e:'Relax, it\'s over now.'},
        {spk:'You',f:'Are, hala aaroom shodam.',p:'a-RE, ha-LA aa-ROOM sho-DAM',e:'Yeah, now I feel relieved.'},

  112:{
    grammar:[
      {title:'Advice — "jaaye to boodam"',body:'"Jaaye to boodam..." (if I were you) softly gives advice: "jaaye to boodam, sabr mikardam" (if I were you, I\'d wait). "Behtare ke" (it\'s better that), "pishnahaad midam" (I suggest), "sa\'y kon" (try to). Gentle, not bossy.',ex:{f:'Jaaye to boodam, miraftam doktor.',p:'JAA-ye to boo-DAM, mi-raf-TAM dok-TOR',e:'If I were you, I\'d go to the doctor.'}},
      {title:'"Nazaret chie?" — inviting input',body:'"Nazaret chie?" (what do you think?) shows you value their view. "Negaraan nabaash" (don\'t worry) reassures. Asking before advising is the polite Persian order.',ex:{f:'Nazaret chie? · Negaraan nabaash, dorost mishe.',p:'na-ZA-ret chie · ne-ga-RAAN na-BAASH, do-ROST mi-SHE',e:'What do you think? · Don\'t worry, it\'ll work out.'}},

    phrases:[

  113:{
    grammar:[
      {title:'Raftan & Aamadan — go and come, all tenses',body:'Two irregular essentials. Go: "miram" (I go), "raftam" (I went), "beram" (subjunctive). Come: "miyaam" (I come), "oomadam" (I came), "biyaam" (subjunctive). After "mikhaam" always use subjunctive: "mikhaam beram" (I want to go).',ex:{f:'Mikhaam beram. · Diruz oomadam.',p:'mi-KHAAM be-RAM · di-ROOZ oo-ma-DAM',e:'I want to go. · I came yesterday.'}},
      {title:'"Rafto-aamad" — social visiting',body:'"Rafto-aamad" (coming and going) = the back-and-forth of family visits. "Rafto-aamad daarim" = we visit each other. "Beram ya namram?" = should I go or not? — subjunctive for deliberating.',ex:{f:'Baa-ham rafto-aamad daarim.',p:'baa-ham raf-to-AA-mad DAA-rim',e:'We visit back and forth.'}},
    ],
    phrases:[
      {cat:'I go',f:'Miram',p:'mi-RAM',e:'I go'},

      {cat:'Should I go?',f:'Beram?',p:'be-RAM',e:'Should I go?'},

  114:{

let refDay = 1; // which day tab is active in reference

function openRef(){
  refDay = getCurrentDay();
  document.getElementById('ref-daycount').textContent = refDay;
  buildRefTabs();
  renderRefDay(refDay);
  show('s-ref');
}

function buildRefTabs(){
  const day = getCurrentDay();
  const tabs = document.getElementById('ref-tabs');
  tabs.innerHTML = '';
  // Pronunciation tab always first
  const phonBtn = document.createElement('button');
  phonBtn.className='ref-tab-btn'+(refDay==='phon'?' active':'');
  phonBtn.textContent='📢 Pronunciation';
  phonBtn.onclick=()=>{ refDay='phon'; buildRefTabs(); renderRefDay('phon'); };
  tabs.appendChild(phonBtn);
  // Grammar overview tab
  const gramBtn = document.createElement('button');
  gramBtn.className='ref-tab-btn'+(refDay==='grammar'?' active':'');
  gramBtn.textContent='📐 Grammar Rules';
  gramBtn.onclick=()=>{ refDay='grammar'; buildRefTabs(); renderRefDay('grammar'); };
  tabs.appendChild(gramBtn);
  // One tab per unlocked day
  for(let d=1;d<=day;d++){
    const btn=document.createElement('button');
    btn.className='ref-tab-btn'+(refDay===d?' active':'');
    btn.textContent=`${CURRICULUM[d-1].icon} Day ${d}`;
    btn.onclick=(()=>{const dd=d; return ()=>{refDay=dd; buildRefTabs(); renderRefDay(dd);};})();
    tabs.appendChild(btn);
  }
  // Locked preview tabs
  for(let d=day+1;d<=Math.min(day+3,30);d++){
    const btn=document.createElement('button');
    btn.className='ref-tab-btn';btn.style.opacity='0.3';btn.disabled=true;
    btn.textContent=`🔒 Day ${d}`;
    tabs.appendChild(btn);
  }
}

function renderRefDay(d){
  const content = document.getElementById('ref-content');
  if(d==='phon'){ content.innerHTML=renderPhonSection(); return; }
  if(d==='grammar'){ content.innerHTML=renderAllGrammar(); return; }
  const lesson=CURRICULUM[d-1];
  const ref=REF_DATA[d]||{grammar:[],phrases:[],convos:[],verbs:[]};
  let html='';
  html+=`<div style="margin-bottom:20px"><div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);margin-bottom:4px">${lesson.icon} Day ${d}: ${lesson.theme}</div><div style="font-size:13px;color:var(--muted)">${lesson.desc}</div></div>`;
  // Vocab — always shown regardless of whether REF_DATA exists for this day
  html+=`<div class="ref-section-head">📦 Vocabulary — ${lesson.vocab.length} words</div>`;
  html+=`<table class="ref-vocab"><tr><th>Farsi</th><th>Phonetic</th><th>English</th><th>Note</th></tr>`;
  lesson.vocab.forEach(v=>{ html+=`<tr><td class="rv-farsi">${v.f}</td><td class="rv-phon">🔊 ${v.p}</td><td class="rv-eng">${v.e}</td><td class="rv-note">${v.note||''}</td></tr>`; });
  html+=`</table>`;
  // Verb tables
  if(ref.verbs&&ref.verbs.length){
    html+=`<div class="ref-section-head">⚡ Verb Conjugation</div>`;
    ref.verbs.forEach(vb=>{
      html+=`<div class="conj-verb-label"><span class="conj-verb-name">${vb.name} <span class="tense-pill pill-present">${vb.tense}</span></span><span class="conj-verb-root">root: ${vb.root}</span></div>`;
      html+=`<table class="ref-conj" style="border:0.5px solid rgba(201,168,76,0.2);border-top:none;margin-bottom:16px"><tr><th>Person</th><th>Form</th><th>Phonetic</th><th>English</th></tr>`;
      vb.rows.forEach(r=>{ html+=`<tr><td class="rc-person">${r.person}</td><td class="rc-form">${r.form}</td><td class="rc-phon">${r.phon}</td><td class="rc-eng">${r.eng}</td></tr>`; });
      html+=`</table>`;
      // Negation row
      const negForm=vb.rows[0]?'ne'+vb.rows[0].form:'ne-mi-…';
      html+=`<div style="font-size:12px;color:var(--muted);padding:6px 4px;margin-bottom:16px">Negation: replace <span style="font-family:'DM Mono',monospace;color:var(--gold)">mi-</span> with <span style="font-family:'DM Mono',monospace;color:var(--gold)">ne-mi-</span> &nbsp;→&nbsp; <span style="font-family:'DM Mono',monospace;color:var(--gold)">${negForm}</span> = I don't…</div>`;
    });
  }
  // Grammar
  if(ref.grammar&&ref.grammar.length){
    html+=`<div class="ref-section-head">📐 Sentence Structure & Grammar</div>`;
    ref.grammar.forEach(g=>{
      html+=`<div class="ref-rule"><div class="ref-rule-title">${g.title}</div><div class="ref-rule-body">${g.body}</div>`;
      if(g.ex) html+=`<div class="ref-example"><div class="ref-ex-farsi">${g.ex.f}</div><div class="ref-ex-phon">🔊 ${g.ex.p}</div><div class="ref-ex-eng">${g.ex.e}</div></div>`;
      html+=`</div>`;
    });
  }
  // Phrases
  if(ref.phrases&&ref.phrases.length){
    html+=`<div class="ref-section-head">💬 Useful Phrases</div><div class="ref-phrase-grid">`;
    ref.phrases.forEach(ph=>{
      html+=`<div class="ref-phrase-card"><div class="ref-phrase-cat">${ph.cat}</div><div class="ref-phrase-f">${ph.f}</div><div class="ref-phrase-p">🔊 ${ph.p}</div><div class="ref-phrase-e">${ph.e}</div>${ph.note?`<div class="ref-phrase-note">${ph.note}</div>`:''}</div>`;
    });
    html+=`</div>`;
  }
  // Conversations
  if(ref.convos&&ref.convos.length){
    html+=`<div class="ref-section-head">🗣️ Conversation Example</div>`;
    ref.convos.forEach(cv=>{
      html+=`<div style="margin-bottom:20px"><div style="font-weight:500;margin-bottom:8px">${cv.title}</div><div class="ref-convo-scene">${cv.scene}</div>`;
      cv.exchanges.forEach(ex=>{
        const right=ex.spk==='You';
        html+=`<div class="ref-bubble-row ${right?'right':'left'}"><div class="ref-speaker">${ex.spk}</div><div class="ref-bubble ${right?'right':'left'}"><div class="ref-b-farsi">${ex.f}</div><div class="ref-b-phon">🔊 ${ex.p}</div><div class="ref-b-eng">${ex.e}</div></div></div>`;
      });
      html+=`</div>`;
    });
  }
  // Fallback for days not yet expanded in REF_DATA
  if(!ref.grammar.length && !ref.phrases.length && !ref.convos.length && !ref.verbs.length){
    html+=`<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;border:0.5px dashed rgba(201,168,76,0.2);border-radius:var(--radius);margin-top:16px">
      Full reference notes for Day ${d} are coming — vocabulary is always available above.
    </div>`;
  }
  content.innerHTML=html;
}

function renderPhonSection(){
  let h=`<div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);margin-bottom:8px">Pronunciation Guide</div>`;
  h+=`<div style="font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7">CAPITALS in phonetic spellings mark the stressed syllable. Once you know these sounds, you can pronounce almost any Farsi word.</div>`;
  h+=`<div class="ref-section-head">Special sounds not in English</div><div class="ref-phon-grid">`;
  PHON_GUIDE.forEach(p=>{ h+=`<div class="ref-phon-item"><div class="ref-phon-key">${p.k}</div><div class="ref-phon-val">${p.v}</div></div>`; });
  h+=`</div>`;
  h+=`<div class="ref-section-head">Vowel Reference</div>`;
  h+=`<table class="ref-vocab"><tr><th>Symbol</th><th>Sound</th><th>Example</th></tr>
    <tr><td class="rv-farsi">a</td><td class="rv-eng">Short "a"</td><td class="rv-note">cat, bat</td></tr>
    <tr><td class="rv-farsi">aa</td><td class="rv-eng">Long "a"</td><td class="rv-note">father, spa</td></tr>
    <tr><td class="rv-farsi">i</td><td class="rv-eng">Short "i"</td><td class="rv-note">sit, bit</td></tr>
    <tr><td class="rv-farsi">ee</td><td class="rv-eng">Long "ee"</td><td class="rv-note">see, free</td></tr>
    <tr><td class="rv-farsi">o</td><td class="rv-eng">Short "o"</td><td class="rv-note">got, hot</td></tr>
    <tr><td class="rv-farsi">oo</td><td class="rv-eng">Long "oo"</td><td class="rv-note">food, cool</td></tr>
    <tr><td class="rv-farsi">e</td><td class="rv-eng">Short "e"</td><td class="rv-note">bed, red — never silent</td></tr>
  </table>`;
  return h;
}

function renderAllGrammar(){
  const day=getCurrentDay();
  let h=`<div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);margin-bottom:8px">Grammar Rules</div>`;
  h+=`<div style="font-size:13px;color:var(--muted);margin-bottom:20px">All grammar rules introduced through Day ${day}, in order.</div>`;
  for(let d=1;d<=day;d++){
    const ref=REF_DATA[d];
    if(!ref||!ref.grammar||!ref.grammar.length) continue;
    h+=`<div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:20px 0 10px;opacity:0.7">${CURRICULUM[d-1].icon} Day ${d} — ${CURRICULUM[d-1].theme}</div>`;
    ref.grammar.forEach(g=>{
      h+=`<div class="ref-rule"><div class="ref-rule-title">${g.title}</div><div class="ref-rule-body">${g.body}</div>`;
      if(g.ex) h+=`<div class="ref-example"><div class="ref-ex-farsi">${g.ex.f}</div><div class="ref-ex-phon">🔊 ${g.ex.p}</div><div class="ref-ex-eng">${g.ex.e}</div></div>`;
      h+=`</div>`;
    });
  }
  return h;
}

/* ══ INIT ══ */
(async () => {
  try {
    loadLocalST();  // instant — renders immediately from localStorage
    buildHome();    // show UI right away with local data
    await loadCloud(); // async merge from cloud (re-renders if different)
  } catch(e){
    console.error('Init error:', e);
    document.getElementById('s-home').innerHTML = `
      <div style="padding:40px 20px;max-width:680px;margin:0 auto;text-align:center">
        <div style="font-size:32px;margin-bottom:16px">🔄</div>
        <div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);margin-bottom:12px">Refreshing your session</div>
        <div style="font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.6">
          A small issue was detected on startup.<br>
          <strong style="color:var(--paper)">Your progress is safe in localStorage.</strong>
        </div>
        <button class="btn btn-gold" style="margin-bottom:12px;width:100%;max-width:320px" onclick="hardReset(false)">Reload &amp; keep progress</button><br>
        <button class="btn btn-outline" style="width:100%;max-width:320px;margin-top:10px" onclick="hardReset(true)">Full reset (clear all data)</button>
      </div>`;
    document.getElementById('s-home').classList.add('active');
  }
})();

function hardReset(clearAll){
  if(clearAll){ try{ localStorage.clear(); }catch(e){} }
  window.location.reload();
}
</script>
